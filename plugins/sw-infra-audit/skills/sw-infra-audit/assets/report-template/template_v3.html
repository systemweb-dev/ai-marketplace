<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>%%TITLE%%</title>
<!-- Fontes OFL 1.1 embutidas em base64 pelo build_report.py: o PDF e gerado sem rede.
     Creditos e licenca em assets/report-template/fontes/LICENCAS.md -->
%%FONTES%%
<style>
.idx a{color:inherit;text-decoration:none}
/* =======================================================================
   TEMA. O relatorio e um documento: imprime em A4 e costuma virar PDF, entao o
   claro e o padrao e e o unico que a impressao conhece. O escuro existe so para
   quem le na tela com o sistema em escuro — por isso vive dentro de @media
   screen, e nao vaza para o papel.
   ======================================================================= */
:root{--papel:#f7f7f7;--campo:#ffffff;--tinta:#17171a;--tinta2:#3f4046;--fraco:#66676e;
 --fio:#e3e3e5;--linha:#eeeeef;--acc:#2a5f86;--crit:#b02a37;--ok:#12683f;--warn:#8a5806;
 --campo2:color-mix(in srgb, var(--campo) 92%, var(--tinta));
 --accs:color-mix(in srgb, var(--acc) 12%, var(--campo));
 --crits:color-mix(in srgb, var(--crit) 12%, var(--campo));
 --oks:color-mix(in srgb, var(--ok) 12%, var(--campo))}
@media screen and (prefers-color-scheme: dark){
  :root{--papel:#111113;--campo:#1a1a1d;--tinta:#f3f3f4;--tinta2:#c2c3c7;--fraco:#8f9096;
   --fio:#2c2c31;--linha:#242428;--acc:#7fb6e0;--crit:#ff7d88;--ok:#56d99a;--warn:#f5c451;
   --accs:color-mix(in srgb, var(--acc) 20%, var(--campo));
   --crits:color-mix(in srgb, var(--crit) 20%, var(--campo));
   --oks:color-mix(in srgb, var(--ok) 20%, var(--campo))}
}
/* a cor E informacao aqui (gravidade, estado): sem isto o navegador branqueia o
   fundo ao imprimir e a faixa vermelha some */
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:var(--papel)}
/* COMANDO. `docker service update --health-cmd ...` passa de 200 caracteres: sem a
   quebra ele sangra para fora da pagina e, no PDF, simplesmente some no corte. */
pre{margin:14px 0 0;padding:13px 15px;background:#16171d;color:#e8e9ee;border-radius:3px;
 font:400 12.4px/1.62 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2}
code{font-family:var(--mono);font-size:.93em;overflow-wrap:anywhere}
/* tabela e cartao nao se partem no meio quando ha pagina suficiente adiante */
table,.no,.rec,.item,.app,.dim{break-inside:avoid}
h2,h3,h4,.sub2{break-after:avoid}

body{padding:0;background:var(--papel)}
:root{--r:4px;--r2:3px;--disp:"Bricolage Grotesque", system-ui, sans-serif;--sans:"Figtree", system-ui, sans-serif;--mono:"JetBrains Mono", ui-monospace, monospace;
 /* escala de espaco. Os valores estruturais saem daqui; micro-espaco de icone fica solto. */
 --s1:8px;--s2:12px;--s3:16px;--s4:24px;--s5:32px;--s6:40px;--s7:56px;--s8:72px;
 color:var(--tinta);font-family:var(--sans);font-size:16.5px;line-height:1.68;letter-spacing:-.003em}
::selection{background:var(--tinta);color:#fff}
p,h1,h2,h3,h4{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
.n{font-variant-numeric:tabular-nums;font-family:var(--mono);letter-spacing:-.02em}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;
 stroke-linecap:round;stroke-linejoin:round}
.capa{padding:var(--s7) 44px var(--s6);background:var(--campo);border-bottom:1px solid var(--fio)}
.marca{display:flex;align-items:center;gap:10px;font:600 12px/1 var(--sans);
 letter-spacing:.04em;text-transform:uppercase;color:var(--acc);margin-bottom:22px}
.marca .ic{width:17px;height:17px}
.capa h1{font:700 38px/1.12 var(--disp);letter-spacing:-.018em;max-width:18ch;
 margin-bottom:var(--s4)}
.capa .tese{margin-top:0;font-size:16.5px;line-height:1.66;color:var(--tinta2);max-width:60ch}
.capa .tese b{color:var(--tinta);font-weight:600}
.capa-l{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s6);align-items:start}
.alvo-card{border:1px solid var(--fio);border-radius:var(--r2);padding:var(--s4);
 min-width:268px;background:var(--campo2)}
.alvo-card .nome{display:flex;align-items:center;gap:9px;font:600 17px/1.2 var(--sans)}
.alvo-card .nome .ic{width:19px;height:19px;color:var(--acc)}
.alvo-card .ctx{font:400 12.5px/1.4 var(--mono);color:var(--fraco);margin:6px 0 16px}
.alvo-card .l{display:flex;justify-content:space-between;gap:var(--s2);padding:5px 0;
 font-size:13.6px;color:var(--fraco)}
/* O cartao responde "esta tudo ok com o servidor?" em tres blocos, porque a resposta nao e
   uma so: a infraestrutura pode estar inteira com um fluxo de aplicacao parado. Juntar os
   dois num selo unico foi o que fazia o relatorio dizer "Degradado" ao lado de 57/57 no ar. */
.chk{padding:var(--s2) 0;border-top:1px solid var(--fio)}
.chk:first-of-type{border-top:0;padding-top:var(--s1)}
.ch2{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s1)}
.ch2 .ic{width:16px;height:16px}
.ch2 b{font:600 13.5px/1 var(--sans)}
.ch2 em{margin-left:auto;font-style:normal;font:600 11.5px/1 var(--sans);
 padding:4px 9px;border-radius:99px}
.chk.ok .ch2 .ic,.chk.ok .ch2 b{color:var(--ok)}
.chk.ok .ch2 em{background:var(--oks);color:var(--ok)}
.chk.mal .ch2 .ic,.chk.mal .ch2 b{color:var(--crit)}
.chk.mal .ch2 em{background:var(--crits);color:var(--crit)}
.chk.neutro .ch2 .ic,.chk.neutro .ch2 b{color:var(--fraco)}
.chk.neutro .l{color:var(--fraco)}
.chk.neutro .l b{color:var(--tinta2);font-weight:400}
.alvo-card .l b{font:500 14px/1 var(--mono);color:var(--tinta)}
.alvo-card .l b.mal{color:var(--crit)}
.estado{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:99px;
 font:600 12px/1 var(--sans);background:var(--crits);color:var(--crit)}
.estado i{width:7px;height:7px;border-radius:99px;background:currentColor}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--s4) var(--s2);
 margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--fio);align-items:start}
.kpis .v{font:700 34px/1 var(--disp);letter-spacing:-.02em}
.kpis .v.mal{color:var(--crit)}
.kpis .v.bom{color:var(--ok)}
.kpis .lb{font-size:12.6px;line-height:1.4;color:var(--fraco);margin-top:var(--s1)}
.fora{padding:14px 44px;background:var(--campo2);border-bottom:1px solid var(--fio);
 display:flex;align-items:center;gap:10px;font-size:13px;color:var(--fraco)}
.fora .ic{width:16px;height:16px}
.idx{padding:var(--s5) 44px var(--s6);border-bottom:1px solid var(--fio)}
.idx-h{font:600 12px/1 var(--sans);letter-spacing:.06em;text-transform:uppercase;
 color:var(--fraco);margin-bottom:var(--s4)}
.idx ol{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:2px 26px}
.idx li{display:grid;grid-template-columns:20px 1fr auto;gap:12px;align-items:center;
 padding:11px 0;border-bottom:1px solid var(--linha)}
.idx li .ic{width:17px;height:17px;color:var(--fraco)}
.idx li .t{font-size:14.5px;font-weight:500}
.idx li .v{font:500 13px/1 var(--mono);color:var(--fraco)}
.idx li.q .ic,.idx li.q .v{color:var(--crit)}
section.sec{padding:var(--s6) 44px 0}
.sh{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.sh .box{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--r2);
 background:var(--accs);color:var(--acc)}
.sh .box .ic{width:18px;height:18px}
.sh h2{font:600 20px/1.2 var(--sans);letter-spacing:-.018em}
.sh .desc{font-size:13.5px;color:var(--fraco);margin-left:auto;text-align:right}
.sh.alerta .box{background:var(--crits);color:var(--crit)}
.cartao{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);padding:var(--s4)}
.duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);align-items:start}
.achado{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);
 margin-bottom:16px;overflow:hidden}
.achado .cab{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:var(--s3);
 align-items:center;padding:var(--s4) var(--s4) 0}
.achado .sel{display:grid;place-items:center;width:38px;height:38px;border-radius:var(--r2);
 background:var(--crits);color:var(--crit)}
.achado.med .sel{background:var(--linha);color:var(--tinta2)}
.achado .sel .ic{width:19px;height:19px}
.achado h3{font:600 19px/1.3 var(--sans);letter-spacing:-.018em}
.achado .regra{font:400 12px/1 var(--mono);color:var(--fraco);margin-top:5px}
.achado .qt{font:700 30px/1 var(--disp);color:var(--crit);letter-spacing:-.02em}
.achado.med .qt{color:var(--tinta2)}
.achado .qt em{display:block;font:400 11.5px/1 var(--sans);font-style:normal;
 color:var(--fraco);margin-top:6px;text-align:right}
.achado .pq{padding:var(--s3) var(--s4) var(--s4);font-size:15px;line-height:1.66;color:var(--tinta2);max-width:72ch}
.achado .pq b{color:var(--tinta);font-weight:600}
.achado .dados{padding:0 var(--s4) var(--s4)}
.fix{background:var(--accs);border-top:1px solid var(--fio);padding:var(--s4)}
.fix .fh{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.fix .fh .ic{width:19px;height:19px;color:var(--acc)}
.fix .fh b{font:600 14px/1 var(--sans);color:var(--acc)}
.fix .fh span{margin-left:auto;font-size:12.5px;color:var(--fraco)}
.fix ol{counter-reset:s;display:grid;gap:var(--s2)}
.fix ol li{counter-increment:s;display:grid;grid-template-columns:24px 1fr;gap:12px;
 font-size:14.5px;color:var(--tinta2)}
.fix ol li>span{grid-column:2}
.fix ol li::before{content:counter(s);display:grid;place-items:center;width:22px;height:22px;
 border-radius:99px;background:#fff;color:var(--acc);font:600 12px/1 var(--mono)}
.custo{display:inline-block;margin-left:8px;padding:3px 8px;border-radius:99px;
 font:600 11px/1.3 var(--sans);background:#fff;color:var(--fraco)}
.custo.risco{background:var(--crits);color:var(--crit)}
.fix pre{margin:16px 0 0;background:#16171d;color:#e8e9ee;border-radius:var(--r2);
 font:400 13px/1.7 var(--mono);padding:16px 18px;white-space:pre-wrap;word-break:break-word}
.fix pre .c{color:#8f95a3}
.fix .sub{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--fio)}
.fix .sub b{display:flex;align-items:center;gap:8px;font:600 12.5px/1 var(--sans);
 color:var(--tinta);margin-bottom:8px}
.fix .sub b .ic{width:15px;height:15px}
.fix .sub.nao b{color:var(--warn)}
.fix .sub p{font-size:14px;color:var(--tinta2)}
.fix code,.fixmin code,.nota code{font:400 13px/1.5 var(--mono);
 background:#fff;padding:2px 6px;border-radius:5px;color:var(--tinta)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(324px,1fr));gap:var(--s3)}
.app{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);padding:20px 22px}
.app.crit{border-color:var(--crit);background:var(--campo)}
.app .ah{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.app .ah .box{display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r2);
 background:var(--linha);color:var(--tinta2)}
.app.crit .ah .box{background:var(--crits);color:var(--crit)}
.app .ah .box .ic{width:17px;height:17px}
.app .ah h4{font:600 16.5px/1.25 var(--sans);letter-spacing:-.015em}
.app .ah .qt{margin-left:auto;font:500 13px/1 var(--mono);color:var(--fraco);white-space:nowrap}
.app .svcs{display:grid;gap:7px;margin-top:15px;padding-top:14px;border-top:1px solid var(--linha)}
.app .svcs .s{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:baseline}
.app .svcs .s .nm{font:400 12.5px/1.4 var(--mono);color:var(--tinta2);overflow-wrap:anywhere}
.app .svcs .s .tag{font:600 11.5px/1.3 var(--sans);color:var(--fraco);white-space:nowrap}
.app .svcs .s .tag.mal{color:var(--crit)}
.app .sinal{margin-top:14px;padding:11px 13px;border-radius:var(--r2);background:var(--crits);
 display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--crit)}
.app .sinal .ic{width:16px;height:16px;margin-top:3px}
.pn{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3);align-items:start}
.pn .col{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);overflow:hidden}
.pn .col>h3{display:flex;align-items:center;gap:10px;padding:16px 22px;
 border-bottom:1px solid var(--fio);font:600 15px/1 var(--sans)}
.pn .col>h3 .ic{width:18px;height:18px}
.pn .col>h3 .c{margin-left:auto;font:500 15px/1 var(--mono)}
.pn .pos>h3{color:var(--ok);background:var(--oks)}
.pn .neg>h3{color:var(--crit);background:var(--crits)}
.item{padding:var(--s3) var(--s4);border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.item .l1{display:flex;align-items:baseline;justify-content:space-between;gap:16px}
.item .tt{font-size:15px;font-weight:600;letter-spacing:-.01em}
.item .ev{font:500 16px/1 var(--mono);white-space:nowrap}
.pos .ev{color:var(--ok)}
.neg .ev{color:var(--crit)}
.item .sub{font-size:13.8px;color:var(--fraco);margin-top:7px}
.item .fixmin{margin-top:13px;padding:13px 15px;border-radius:var(--r2);background:var(--accs)}
.item .fixmin b{display:flex;align-items:center;gap:8px;font:600 12.5px/1 var(--sans);
 color:var(--acc);margin-bottom:7px}
.item .fixmin b .ic{width:15px;height:15px}
.item .fixmin p{font-size:13.8px;color:var(--tinta2)}
.nos{display:grid;grid-template-columns:repeat(auto-fit,minmax(214px,1fr));gap:var(--s3)}
.no{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);padding:var(--s4)}
.no .nh{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.no .nh .ic{width:17px;height:17px;color:var(--fraco)}
.no .nh b{font:400 13px/1.3 var(--mono)}
.no .nh em{font-style:normal;margin-left:auto;font:600 11px/1.3 var(--sans);
 padding:3px 9px;border-radius:99px;background:var(--accs);color:var(--acc)}
.no .l{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;font-size:13.5px;color:var(--fraco);min-width:0}
.no .l b{font:500 13.5px/1 var(--mono);color:var(--tinta);white-space:nowrap}
.no .l b.mal{color:var(--crit)}
.cen{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:var(--s3);align-items:baseline;
 padding:var(--s3) 0;border-bottom:1px solid var(--linha)}
.cen:last-child{border-bottom:0}
.cen .ic{width:17px;height:17px;color:var(--crit);align-self:center}
.cen .se{font-size:14px;color:var(--fraco)}
.cen .en{font-size:14.8px;color:var(--tinta);margin-top:3px}
.cen .pk{font:700 22px/1 var(--disp);color:var(--crit);white-space:nowrap}
.rec{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:var(--s3);align-items:start;
 background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);padding:var(--s4);margin-bottom:var(--s2)}
.rec .o{display:grid;place-items:center;width:38px;height:38px;border-radius:99px;
 background:var(--accs);color:var(--acc);font:600 15px/1 var(--mono)}
.rec.top .o{background:var(--crits);color:var(--crit)}
.rec h4{font:600 16.5px/1.3 var(--sans);letter-spacing:-.015em}
.rec p{font-size:14.5px;color:var(--tinta2);margin-top:7px;max-width:70ch}
.rec .tags{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tag{padding:5px 11px;border-radius:99px;font:600 12px/1.3 var(--sans);
 background:var(--linha);color:var(--tinta2)}
.tag.alto{background:var(--crits);color:var(--crit)}
.tag.baixo{background:var(--oks);color:var(--ok)}
.rec .quando{font:600 12.5px/1.5 var(--sans);color:var(--fraco);text-align:right;white-space:nowrap}
.nota{display:flex;gap:var(--s2);align-items:flex-start;margin-top:var(--s4);padding:var(--s3) var(--s4);
 border-radius:var(--r2);background:var(--campo2);border:1px solid var(--fio)}
.nota .ic{width:18px;height:18px;color:var(--fraco);margin-top:2px}
.nota>div>b{display:block;font:600 14px/1 var(--sans);color:var(--tinta);margin-bottom:8px}
.nota p b{display:inline;font:inherit;font-weight:600;color:var(--tinta);margin:0}
.nota p{font-size:14px;color:var(--tinta2)}
table{width:100%;border-collapse:collapse;background:var(--campo);border:1px solid var(--fio);
 border-radius:var(--r2);overflow:hidden}
/* Tabela DENTRO de cartao nao e tabela-cartao. O canto arredondado da regra acima
   comia a primeira letra da primeira coluna ("NOME" saia com o N cortado) — so
   aparece renderizando o PDF em alta resolucao, e e por isso que tem teste. */
.campos,.ocs{overflow:visible;border-radius:0;border:0;background:transparent}
th{text-align:left;font:600 12px/1 var(--sans);letter-spacing:.04em;color:var(--fraco);
 padding:14px 18px;border-bottom:1px solid var(--fio);background:var(--campo2)}
td{padding:14px 18px;border-bottom:1px solid var(--linha);font-size:14.2px;color:var(--tinta2)}
tr:last-child td{border-bottom:0}
td.m{font:400 13px/1.45 var(--mono);color:var(--tinta);overflow-wrap:anywhere}
td.r,th.r{text-align:right}
@media screen and (max-width:860px){
  .duas,.pn,.capa-l{grid-template-columns:1fr}
}
@media screen and (max-width:520px){
  .capa,.idx,section.sec,.fora{padding-left:20px;padding-right:20px}
  .capa h1{font-size:30px}
}
.g{display:grid;gap:7px}
.g .b{display:grid;grid-template-columns:148px minmax(0,1fr) 92px;gap:14px;align-items:center}
.g .b .nm{font:600 12.5px/1.3 var(--sans);color:var(--c);text-align:right;
 letter-spacing:.02em;text-transform:uppercase}
.g .b .tr{height:26px;background:var(--linha);border-radius:2px;position:relative}
.g .b .tr i{position:absolute;top:0;bottom:0;left:0;background:var(--c);border-radius:2px}
.g .b .vl{font:500 16px/1 var(--mono);color:var(--c)}
.g .b .vl em{display:block;font:400 11px/1 var(--sans);font-style:normal;
 color:var(--fraco);margin-top:5px}
.g .b.k0{--c:#aeb2ba}
.g .b.k3{--c:var(--fraco)}
.g .b.k2{--c:var(--acc)}
.g .b.k1{--c:var(--crit)}
@media screen and (max-width:860px){
  .g .b{grid-template-columns:1fr;gap:4px}
  .g .b .nm{text-align:left}
}
.fix ol.rb{display:grid;gap:0;counter-reset:s}
.fix ol.rb>li{counter-increment:s;display:block;padding:20px 0;
 border-top:1px solid var(--fio)}
.fix ol.rb>li:first-child{border-top:0;padding-top:4px}
.fix ol.rb>li::before{display:none}
.ph{display:flex;align-items:center;gap:11px;margin-bottom:9px}
.ph::before{content:"Passo " counter(s);display:inline-grid;place-items:center;
 padding:5px 11px;border-radius:99px;background:#fff;color:var(--acc);
 font:600 11.5px/1 var(--mono);white-space:nowrap}
.ph b{font:600 15.5px/1.3 var(--sans);letter-spacing:-.012em;color:var(--tinta)}
.ph .custo{margin-left:auto}
.pf{font-size:14.3px;color:var(--tinta2);max-width:74ch}
.fix ol.rb pre{margin-top:11px}
.pv{margin-top:12px}
.fix pre.saida{background:#fff;color:var(--tinta2);border:1px solid var(--fio);
 font-size:12.3px;line-height:1.6;padding:12px 14px}
.pm{margin-top:11px;font-size:14px;color:var(--tinta2);max-width:76ch}
.pm b{color:var(--tinta)}
.dec{margin:18px 0;padding:18px 20px;border-radius:var(--r2);background:#fff;
 border:1px solid var(--fio)}
.dh{display:flex;align-items:center;gap:9px;font:600 13px/1 var(--sans);
 color:var(--acc);margin-bottom:13px}
.dh .ic{width:17px;height:17px}
.dl{display:grid;gap:4px;padding:11px 0;border-top:1px solid var(--linha)}
.dl:first-of-type{border-top:0;padding-top:0}
.dl b{font:600 14px/1.35 var(--sans)}
.dl span{font-size:13.8px;color:var(--tinta2)}
.antes{margin-bottom:18px;padding:14px 16px;border-radius:var(--r2);background:#fff;
 border:1px solid var(--fio);font-size:13.8px;color:var(--tinta2)}
.antes b{display:block;font:600 12.5px/1 var(--sans);color:var(--tinta);margin-bottom:7px}
.nota-g{margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--fio)}
.nota-h{display:flex;align-items:baseline;gap:var(--s2);margin-bottom:var(--s4)}
.nota-h b{font:600 13px/1 var(--sans);letter-spacing:.04em;text-transform:uppercase;color:var(--fraco)}
.nota-h span{font-size:13px;color:var(--fraco)}
.nota-h .unica{margin-left:auto;display:none;align-items:baseline;gap:9px}
.nota-h .unica b{font:700 30px/1 var(--disp);color:var(--crit);letter-spacing:-.02em;
 text-transform:none}
.nota-h .unica em{font-style:normal;font-size:12.5px;color:var(--fraco)}
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4) var(--s5)}
.dim .dt{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dim .dt b{font:600 14.5px/1.3 var(--sans)}
.dim .dt .p{font:500 15px/1 var(--mono)}
.dim.bom .dt .p{color:var(--ok)}
.dim.mal .dt .p{color:var(--crit)}
.dim.meio .dt .p{color:var(--warn)}
.dim .tr{margin-top:9px;height:7px;border-radius:99px;background:var(--linha);overflow:hidden}
.dim .tr i{display:block;height:100%;border-radius:99px;background:#9aa2b1}
.dim.bom .tr i{background:var(--ok)}
.dim.mal .tr i{background:var(--crit)}
.dim.meio .tr i{background:var(--warn)}
.dim .ver{font-size:13px;color:var(--tinta2);margin-top:9px}
.dim .ev{font:400 11.5px/1.5 var(--mono);color:var(--fraco);margin-top:5px}
.wrap{max-width:none}
.capa{padding:40px 40px 30px}
section.sec{padding:0 40px}
.faixa{margin-top:30px;border-left:4px solid var(--c);padding-left:22px}
.faixa.f1{--c:var(--crit)}
.faixa.f2{--c:var(--acc)}
.faixa.f3{--c:var(--fraco)}
.fxh{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
.fxh h2{font:700 15px/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;color:var(--c)}
.fxh .q{font:500 12.5px/1 var(--mono);color:var(--fraco)}
.fxh .quando{margin-left:auto;font-size:12.5px;color:var(--fraco)}
.sh{display:none}
.sub2{font:600 12.5px/1 var(--sans);letter-spacing:.05em;text-transform:uppercase;
 color:var(--fraco);margin:22px 0 12px}
.pn,.duas{grid-template-columns:1fr;gap:14px}
.apps{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.nos{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.achado,.cartao,.app,.col,.rec{border-radius:4px}
/* --- cascata da abertura: o resumo da triagem, antes de qualquer faixa --- */
.casc{display:grid;gap:var(--s1);margin:var(--s6) 0 0;padding:var(--s5);background:var(--campo);
 border:1px solid var(--fio);border-radius:4px}
.casc .b{display:grid;grid-template-columns:172px minmax(0,1fr) 104px;gap:16px;align-items:center}
.casc .b .nm{font:600 12.5px/1.3 var(--sans);letter-spacing:.04em;text-transform:uppercase;
 color:var(--c);text-align:right}
.casc .b .tr{height:26px;background:var(--linha);border-radius:3px;overflow:hidden}
.casc .b .tr i{display:block;height:100%;background:var(--c);border-radius:3px}
.casc .b .vl{font:500 17px/1 var(--mono);color:var(--c)}
.casc .b .vl em{display:block;font:400 11px/1 var(--sans);font-style:normal;
 color:var(--fraco);margin-top:6px}
.casc .k0{--c:var(--fraco)}
.casc .k3{--c:var(--tinta2)}
.casc .k2{--c:var(--acc)}
.casc .k1{--c:var(--crit)}
/* --- indice por faixa, nao por tema --- */
.idx ol.porfaixa{grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:var(--s2)}
.porfaixa li{grid-template-columns:4px 1fr auto;gap:var(--s3);align-items:start;
 border-bottom:0;background:var(--campo);border:1px solid var(--fio);border-radius:4px;padding:var(--s4)}
.porfaixa li>i{align-self:stretch;background:var(--c);border-radius:3px}
.porfaixa li .t{font:700 14.5px/1.2 var(--disp);color:var(--c);letter-spacing:.02em}
.porfaixa li .d{grid-column:2;font-size:12.8px;color:var(--fraco);margin-top:5px}
.porfaixa li .v{font:500 12.5px/1 var(--mono);color:var(--fraco)}
.porfaixa .f1{--c:var(--crit)}
.porfaixa .f2{--c:var(--acc)}
.porfaixa .f3{--c:var(--fraco)}
/* --- cabecalho da faixa com o peso dela no total --- */
.fxh{flex-wrap:wrap}
.fxh .peso{flex-basis:100%;height:3px;background:var(--linha);border-radius:2px;margin-top:11px}
.fxh .peso i{display:block;height:100%;background:var(--c);border-radius:2px}
/* --- rotulo da secao dentro da faixa (o .sh some aqui) --- */
.sub2{display:flex;align-items:center;gap:10px;font:600 12.5px/1 var(--sans);
 letter-spacing:.05em;text-transform:uppercase;color:var(--fraco);margin:26px 0 13px}
.sub2::after{content:"";flex:1;height:1px;background:var(--fio)}
.faixa>.sub2:first-child{margin-top:0}
/* =======================================================================
   TAMANHO DE PDF. Padrao: A4 PAISAGEM, 1070px de conteudo — 44% mais largura
   que o retrato, que e o que um relatorio de tabela e ranking pede. A altura
   util cai de 1036 para 718px por pagina, entao o documento ganha paginas: o
   troco e esse, e vale porque ninguem le tabela de 6 colunas em 741px.
   ======================================================================= */
@page{size:A4 landscape;margin:10mm 7mm}
.wrap{max-width:1070px;margin:0 auto;background:var(--campo);
 box-shadow:0 1px 3px rgba(0,0,0,.07),0 12px 34px -20px rgba(0,0,0,.28)}
.capa,section.sec,.faixa,.idx,.fora{padding-left:var(--s6);padding-right:var(--s6)}
.faixa{border-left-width:3px;margin-left:0;padding-left:var(--s5)}
/* em paisagem o lado a lado volta a caber, e e o ponto de usar paisagem */
.pn,.duas{grid-template-columns:repeat(2,minmax(0,1fr))}
.sisgrid,.apps{grid-template-columns:repeat(auto-fit,minmax(460px,1fr))}
.nos{grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3)}
.idx ol.porfaixa{grid-template-columns:repeat(3,minmax(0,1fr))}
/* em retrato tudo empilha de novo */
/* =======================================================================
   SEPARACAO ENTRE TOPICOS. Antes o rotulo era um fio fino e o olho nao via a
   troca de assunto. Agora cada quebra tem faixa propria, respiro e numeral.
   ======================================================================= */
.sub2{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:baseline;
 counter-increment:topico;margin:var(--s8) calc(var(--s5)*-1) var(--s5);
 padding:var(--s4) var(--s5) var(--s3);
 background:var(--campo2);border-top:2px solid var(--tinta);border-bottom:1px solid var(--fio);
 font:600 16.5px/1.3 var(--sans);letter-spacing:-.012em;text-transform:none;color:var(--tinta)}
.sub2::after{display:none}
.sub2::before{content:counter(topico,decimal-leading-zero);font:500 12px/1.5 var(--mono);
 color:var(--acc)}
.faixa{counter-reset:topico}
.faixa>.sub2:first-child{margin-top:0}
section.sec .sh{margin-bottom:var(--s4);padding-bottom:var(--s3);border-bottom:1px solid var(--fio)}
/* a faixa fica visivelmente separada da anterior */
.faixa{margin-top:var(--s8);padding-top:var(--s6);padding-bottom:var(--s7);
 border-top:1px solid var(--fio)}
.faixa:first-of-type{margin-top:var(--s6)}
.fxh{padding-bottom:var(--s3);border-bottom:1px solid var(--fio);margin-bottom:var(--s5)}
/* a camada tambem: era so um fio */
.camada{margin-top:var(--s6);padding-top:var(--s5);border-top:1px solid var(--fio)}
.camada:first-of-type{margin-top:0;padding-top:0;border-top:0}
/* =======================================================================
   IMPRESSAO. Sem isso o PDF corta cartao no meio e separa titulo do corpo.
   ======================================================================= */
@media print{
  .wrap{max-width:none;box-shadow:none}
  .capa,section.sec,.faixa,.idx,.fora{padding-left:0;padding-right:0}
  .faixa{padding-left:14px}
  .sub2{margin-left:0;margin-right:0;padding-left:14px;padding-right:14px}
  .sub2,.fxh,.sh,.grh,.pt{break-after:avoid;page-break-after:avoid}
  .faixa{break-before:page;page-break-before:always}
  .faixa:first-of-type{break-before:auto;page-break-before:auto}
  .achado,.fix{break-inside:auto}
  .fix ol.rb>li{break-inside:avoid;page-break-inside:avoid}
}
/* --- aviso de projeto: estes paineis nao sao medida desta rodada --- */
.pt{font:600 15px/1.3 var(--sans);letter-spacing:-.01em;margin-bottom:var(--s4)}
.pt span{display:block;font:400 12.6px/1.4 var(--sans);color:var(--fraco);margin-top:4px}
.un{margin-top:12px;font:400 12px/1 var(--mono);color:var(--fraco)}
.rk{display:grid;grid-template-columns:20px minmax(0,auto) minmax(90px,1fr) 66px;gap:14px;
 align-items:center;padding:8px 0;border-top:1px solid var(--linha)}
.rks .rk:first-child{border-top:0}
.rk .o{font:500 11.5px/1 var(--mono);color:var(--fraco)}
.rk .nm{font:400 12.6px/1.35 var(--mono);color:var(--tinta2);overflow-wrap:anywhere}
.rk .tr{height:7px;background:var(--linha);border-radius:99px;overflow:hidden}
.rk .tr i{display:block;height:100%;background:var(--tinta2);border-radius:99px}
.rk .vl{font:500 13px/1 var(--mono);text-align:right}
.rk.topo .tr i{background:var(--warn)}
/* --- natureza do trafego --- */
.cl{display:grid;grid-template-columns:11px auto auto;gap:9px;align-items:baseline}
.cl .d{width:11px;height:11px;border-radius:2px;align-self:center}
.cl .d.ok{background:var(--ok)}
.cl .d.neutro{background:#9aa2b1}
.cl .d.warn{background:var(--warn)}
.cl .d.crit{background:var(--crit)}
.cl .nm{font-size:13.4px;font-weight:600}
.cl .pc{font:500 13px/1 var(--mono);color:var(--fraco)}
.cl .ex{grid-column:2/-1;font-size:12.4px;color:var(--fraco);margin-top:2px}
table.tvar{margin-top:4px}
table.tvar th{padding:10px 14px}
table.tvar td{padding:10px 14px;font-size:13.4px}
/* --- servico nao mapeado --- */
.nm2{margin-top:12px;padding:12px 14px;border-radius:4px;background:var(--campo2);
 border:1px solid var(--linha)}
.nh2{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:7px}
.nh2 .ic{width:16px;height:16px;color:var(--warn)}
.nh2 b{font:600 13px/1 var(--sans);color:var(--warn)}
.nh2 span{font-size:12.4px;color:var(--fraco)}
.nm3{font-size:13.2px;color:var(--tinta2)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:7px 0;
 border-top:1px solid var(--linha);font-size:13.2px;color:var(--fraco)}
.kv:first-of-type{border-top:0}
.kv b{font:500 13px/1 var(--mono);color:var(--tinta)}
.kv b.mal{color:var(--crit)}
.prop{margin-top:14px;padding:15px 16px;border-radius:4px;background:var(--accs)}
.ph2{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.ph2 .ic{width:17px;height:17px;color:var(--acc)}
.ph2 b{font:600 13.5px/1 var(--sans);color:var(--acc)}
.pm2{font-size:13.4px;color:var(--tinta2)}
.prop pre{margin-top:11px;background:#17181c;color:#e9e9ea;border-radius:4px;
 font:400 12.5px/1.7 var(--mono);padding:13px 15px;white-space:pre-wrap}
.prop pre .c{color:#94979d}
.pc2{margin-top:10px;font-size:12.6px;color:var(--fraco)}
/* --- o cluster sobe para o topo, antes das faixas --- */
.topo-cluster{margin-top:var(--s6)}
/* --- sistemas por camada: recebe, processa, enfileira, guarda, observa --- */
.camada{margin-top:28px}
.camada:first-of-type{margin-top:0}
.ch{display:flex;align-items:center;gap:var(--s2);padding-bottom:var(--s2);margin-bottom:var(--s4);
 border-bottom:1px solid var(--fio)}
.ch .ic{width:18px;height:18px;color:var(--acc)}
.ch h3{font:700 15px/1 var(--disp);letter-spacing:.03em;text-transform:uppercase}
.ch .p{font:400 12px/1 var(--mono);color:var(--fraco)}
.ch .p code{font:inherit;background:var(--linha);padding:3px 7px;border-radius:3px}
.ch .q{margin-left:auto;font:500 12.5px/1 var(--mono);color:var(--fraco)}
.sisgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(390px,1fr));gap:var(--s3)}
.sis{background:var(--campo);border:1px solid var(--fio);border-radius:4px;padding:var(--s4)}
.sis.crit{border-color:var(--crit)}
.sh2{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.sh2 .box{display:grid;place-items:center;width:34px;height:34px;border-radius:4px;
 background:var(--linha);color:var(--tinta2)}
.sis.crit .sh2 .box{background:var(--crits);color:var(--crit)}
.sh2 .box .ic{width:18px;height:18px}
.sh2 h4{font:600 16px/1.2 var(--sans);letter-spacing:-.015em}
.sh2 .img{font:400 11.8px/1.4 var(--mono);color:var(--fraco);margin-top:3px;overflow-wrap:anywhere}
.sh2 .qt{margin-left:auto;font:500 12.5px/1 var(--mono);color:var(--fraco);white-space:nowrap}
.sis .sinal{display:flex;gap:9px;align-items:flex-start;margin-top:12px;padding:11px 13px;
 border-radius:4px;background:var(--crits);color:var(--crit);font-size:13.5px}
.sis .sinal .ic{width:16px;height:16px;margin-top:3px}
/* --- o grafico dentro do sistema --- */
.gr{margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--linha)}
.grh{font:600 12px/1.4 var(--sans);letter-spacing:.03em;color:var(--tinta);margin-bottom:12px}
.grh span{font-weight:400;color:var(--fraco)}
.grn{margin-top:12px;font-size:13px;color:var(--tinta2)}
.rep{display:grid;grid-template-columns:minmax(0,1fr) 88px 58px 78px;gap:12px;
 align-items:center;padding:7px 0;border-top:1px solid var(--linha)}
.rep:first-of-type{border-top:0}
.rep .nm{font:400 12.5px/1.35 var(--mono);color:var(--tinta2);overflow-wrap:anywhere}
.rep .tr{height:7px;background:var(--linha);border-radius:99px;overflow:hidden}
.rep .tr i{display:block;height:100%;background:var(--ok)}
.rep.mal .tr i{background:var(--crit)}
.rep .vl{font:500 13px/1 var(--mono);text-align:right}
.rep .fa{font:500 11.5px/1 var(--mono);color:var(--crit);text-align:right}
.gr.prio .pr{grid-template-columns:22px minmax(0,1fr) 118px 78px 62px}
.al{display:grid;grid-template-columns:minmax(0,1fr) 128px 52px;gap:12px;align-items:center;
 padding:7px 0}
.al .lb{font-size:13px;color:var(--tinta2)}
.al .tr{height:8px;background:var(--linha);border-radius:99px;overflow:hidden}
.al .tr i{display:block;height:100%}
.al .tr i.ok{background:var(--ok)}
.al .tr i.mal{background:var(--crit)}
.al .vl{font:500 13px/1 var(--mono);text-align:right}
/* --- o LUGAR do grafico que nao pode ser desenhado: buraco explicito --- */
.vazio{margin-top:16px;padding:15px 16px;border-top:1px solid var(--linha);
 background:repeating-linear-gradient(135deg,transparent 0 7px,var(--linha) 7px 8px);
 border-radius:0 0 3px 3px}
.vh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:8px}
.vh .ic{width:16px;height:16px;color:var(--fraco)}
.vh b{font:600 12.5px/1 var(--sans);color:var(--tinta2)}
.vh span{font:400 12px/1.4 var(--mono);color:var(--fraco)}
.vm{font-size:13.2px;color:var(--tinta2);background:var(--campo);padding:9px 11px;border-radius:3px}
@media screen and (max-width:760px){
  .sisgrid{grid-template-columns:1fr}
  .rep{grid-template-columns:1fr auto;gap:6px}
  .rep .tr,.rep .fa{display:none}
}
/* --- lista de prioridade das filas --- */
.g.prio{display:grid;gap:0}
.prh,.pr{display:grid;grid-template-columns:26px minmax(0,1fr) 148px 92px 86px;
 gap:14px;align-items:center}
.prh{padding-bottom:9px;border-bottom:1px solid var(--fio);font:600 11.5px/1 var(--sans);
 letter-spacing:.04em;color:var(--fraco)}
.prh .d{text-align:right}
.pr{padding:11px 0;border-bottom:1px solid var(--linha)}
.pr:last-of-type{border-bottom:0}
.pr .o{font:500 12px/1 var(--mono);color:var(--fraco)}
.pr .nm{font:400 13px/1.4 var(--mono);color:var(--tinta2);overflow-wrap:anywhere}
.pr .tr{height:8px;background:var(--linha);border-radius:99px;overflow:hidden}
.pr .tr i{display:block;height:100%;background:var(--tinta2);border-radius:99px}
.pr .vl,.pr .ac{font:500 14px/1 var(--mono);text-align:right}
.pr .ac{color:var(--fraco);font-size:12.5px}
.pr.topo .nm,.pr.topo .vl{color:var(--crit)}
.pr.topo .vl{font-size:19px}
.pr.topo .tr i{background:var(--crit)}
.prn{margin-top:14px;font-size:13.5px;color:var(--tinta2)}
@media screen and (max-width:860px){
  .casc .b{grid-template-columns:1fr;gap:5px}
  .casc .b .nm{text-align:left}
  .prh{display:none}
  .pr{grid-template-columns:26px 1fr auto;gap:8px}
  .pr .tr,.pr .ac{display:none}
}
/* =======================================================================
   PECAS REAPROVEITADAS DO RENDERIZADOR ANTERIOR.
   `_resposta`, `_node_failures` e `_table` continuam sendo as funcoes que
   garantem o contrato — a FONTE junto do numero, `sem_dados` com o motivo,
   lista virando ranking. O desenho novo nasceu sem o CSS delas, e o
   resultado era texto grudado ("Filasfonte: admin_http") e tabela sem
   alinhamento. Estas regras traduzem aquele vocabulario para este.
   ======================================================================= */

/* --- o miolo de toda secao --- */
.conteudo{display:flex;flex-direction:column;gap:var(--s3)}
.conteudo>:first-child{margin-top:0}

/* --- uma resposta medida, com a fonte que respondeu --- */
.insight{border:1px solid var(--fio);border-radius:var(--r2);padding:var(--s3) var(--s4);
 background:var(--campo);break-inside:avoid}
.insight .ih{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
 flex-wrap:wrap;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--linha)}
.insight .ih b{font:600 14px/1.3 var(--sans);letter-spacing:-.005em}
.insight .src{font:400 11.5px/1.3 var(--mono);color:var(--fraco);white-space:nowrap}
.insight>.v{font:700 26px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.insight>.un{margin-left:5px;font:400 12px/1 var(--mono);color:var(--fraco)}

/* "nao consegui ver" NAO e "esta ruim": o motivo aparece, em tom neutro */
.semdados{display:flex;gap:9px;flex-wrap:wrap;align-items:baseline;padding:11px 13px;
 border-radius:var(--r2);background:var(--campo2);border:1px dashed var(--fio);
 font-size:13.4px;color:var(--fraco)}
.semdados b{font:600 13.4px/1.4 var(--sans);color:var(--tinta2)}

/* a analise que o agente escreve por cima do fato */
.an{font-size:13.8px;line-height:1.6;color:var(--tinta2)}
.an p{margin:0 0 7px}
.an p:last-child{margin-bottom:0}

/* o teto da lista: mostra as primeiras e DIZ quantas ficaram de fora */
.corte{margin-top:11px;font-size:12.8px;color:var(--fraco)}
.corte a{color:var(--acc)}
.muted{font-size:13.4px;color:var(--fraco)}

/* subtitulo dentro de uma secao (disco, certificados) */
.hsub{margin:var(--s4) 0 11px;font:600 12.5px/1 var(--sans);letter-spacing:.05em;
 text-transform:uppercase;color:var(--fraco)}

/* --- tabela: numero alinha por coluna, estado vira pilula --- */
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);
 font-size:12.8px;white-space:nowrap}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:99px;
 font:600 11px/1.6 var(--sans);letter-spacing:.02em;white-space:nowrap;
 background:var(--campo2);color:var(--tinta2)}
.badge.ok{background:var(--oks);color:var(--ok)}
.badge.warn{background:color-mix(in srgb,var(--warn) 14%,var(--campo));color:var(--warn)}
.badge.bad,.badge.high{background:var(--crits);color:var(--crit)}

/* --- a rota que o proxy entrega numa aplicacao --- */
.rota{display:flex;align-items:center;gap:7px;margin:9px 0 11px;font:400 12.4px/1.45 var(--mono);
 color:var(--fraco);overflow-wrap:anywhere}
.rota .ic{width:14px;height:14px;flex:none;color:var(--acc)}

/* --- falhas por codigo de saida: cada linha e UM evento, nao N ocorrencias --- */
.nfail{margin-top:var(--s3)}
.nfh{font:600 11.5px/1 var(--sans);letter-spacing:.07em;text-transform:uppercase;
 color:var(--fraco);margin-bottom:11px}
.nfrow{background:var(--campo);border:1px solid var(--fio);border-radius:var(--r2);
 padding:11px 15px;margin-bottom:7px;break-inside:avoid}
.nfhead{display:flex;align-items:baseline;gap:11px;flex-wrap:wrap}
.nfcode{font:600 13px/1 var(--mono);color:var(--crit);white-space:nowrap}
.nfhint{font-size:12.8px;color:var(--tinta2)}
.nfmulti{font-size:11.8px;color:var(--fraco)}
.nfsvcs{margin-top:7px;font:400 11.8px/1.55 var(--mono);color:var(--fraco);overflow-wrap:anywhere}

/* --- etiqueta de alvo declarado e nao medido --- */
.tag.na{background:var(--campo2);color:var(--fraco);border:1px dashed var(--fio)}
.tag.na em{font-style:normal;margin-left:7px;opacity:.78;font-family:var(--mono);font-size:.92em}

/* --- o nome do sistema e a contagem de achados nao se encostam --- */
.sis .nm2{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
 flex-wrap:wrap}
.sis .nm2 .qt{font:500 11.5px/1.5 var(--mono);color:var(--crit);white-space:nowrap}

/* --- um servico dentro do cartao da aplicacao --- */
.svc{padding:9px 0;border-top:1px solid var(--linha)}
.svc:first-of-type{border-top:0;padding-top:0}
.svch{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2);
 flex-wrap:wrap}
.svch b{font:600 13.4px/1.4 var(--sans)}
.svch em{font-style:normal;font:500 11.5px/1.5 var(--sans);white-space:nowrap}
.svch em.ok{color:var(--ok)}
.svch em.mal{color:var(--warn)}
.svc code{display:block;margin-top:3px;font-size:11.8px;color:var(--fraco);
 overflow-wrap:anywhere}

/* --- o indice nao merece uma pagina so para ele --- */
.idx{break-inside:avoid;break-before:avoid}

/* --- gravidade do bloco de achado: `low` nao pode se pintar de `medium` --- */
.achado.baixo{border-left:3px solid var(--fio)}
.achado.baixo .cab .sel{color:var(--fraco)}
/* --- aceite cuja justificativa expirou volta a contar, e tem de parecer --- */
.item.crit{border-left:3px solid var(--crit);padding-left:var(--s3)}
.item .dt .tag.mal{background:var(--crits);color:var(--crit)}

/* =======================================================================
   O QUE O RENDERIZADOR EMITE E O TEMPLATE NAO DESENHAVA.
   Trinta e seis classes sairam do `build_report.py` sem nenhuma regra aqui.
   Classe sem regra nao e "sem estilo": e o fluxo padrao do navegador por
   cima do desenho — rotulo colado no numero, legenda virando quatro
   colunas, cartao de medida invisivel. `tests/test_template_conhece_o_que_
   o_relatorio_emite.py` nao deixa voltar.
   ======================================================================= */

/* --- o mostrador: so quem declara tolerancia vira agulha --- */
.medidores{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
 gap:var(--s4)}
.mdr{display:flex;flex-direction:column;align-items:center;text-align:center;
 padding:var(--s4) var(--s3) var(--s3);border:1px solid var(--fio);border-radius:var(--r2);
 background:var(--campo);break-inside:avoid;page-break-inside:avoid}
/* meia-lua: 180 graus do zero ao maximo declarado. `--ang` vem do Python. */
.anel{position:relative;width:148px;height:78px;overflow:hidden;margin-bottom:var(--s2)}
.arco{position:absolute;inset:0;width:148px;height:148px;border-radius:50%;
 background:conic-gradient(from 270deg,var(--ok) 0 var(--g1),var(--warn) var(--g1) var(--g2),
 var(--crit) var(--g2) 180deg,transparent 180deg)}
.furo{position:absolute;left:22px;top:22px;width:104px;height:104px;border-radius:50%;
 background:var(--campo)}
.agulha{position:absolute;left:50%;bottom:0;width:2px;height:62px;background:var(--tinta);
 transform-origin:50% 100%;transform:translateX(-50%) rotate(calc(var(--ang) - 90deg));
 border-radius:2px}
.eixo{position:absolute;left:50%;bottom:-5px;width:11px;height:11px;border-radius:50%;
 background:var(--tinta);transform:translateX(-50%)}
.mdr .v{font:700 27px/1 var(--disp);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.mdr .rot{margin-top:5px;font:600 13.4px/1.3 var(--sans);color:var(--tinta2)}
/* `tol`, e nao `faixa`: aquele nome e o da banda de triagem, que em impressao
   forca pagina nova — e o cartao partia ao meio na quebra. */
.mdr .tol{margin-top:7px;font:400 11.6px/1.4 var(--mono);color:var(--fraco)}
.mdr .src{margin-top:4px;font:400 11px/1.3 var(--mono);color:var(--fraco)}

/* --- grupo de achado: um titulo, a gravidade, quantas vezes, a regra --- */
.grp-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
 padding-bottom:9px;border-bottom:1px solid var(--linha)}
.grp-h b{font:600 15.4px/1.3 var(--sans);letter-spacing:-.008em;margin-right:auto}
.sev{font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;
 color:var(--c,var(--fraco))}
.grp.critical .sev,.grp.high .sev{--c:var(--crit)}
.grp.medium .sev{--c:var(--warn)}
.grp-n{font:400 12px/1 var(--mono);color:var(--fraco);white-space:nowrap}
.grp-r{font:400 11.4px/1 var(--mono);color:var(--fraco)}
.grp-d{margin-top:11px;font-size:14.6px;line-height:1.64;color:var(--tinta2);max-width:78ch}
.grp-c{margin-top:7px;font-size:13.6px;color:var(--fraco);max-width:78ch}
.fix-h{display:flex;align-items:center;gap:7px;font:600 13.4px/1.3 var(--sans)}
.val{margin-top:9px;font-size:13.8px;line-height:1.6;color:var(--tinta2);max-width:78ch}

/* --- a tabela de ocorrencias: uma LINHA por ocorrencia --- */
.oc-o{font:400 12.8px/1.4 var(--mono);color:var(--tinta);overflow-wrap:anywhere}
.oc-a{font:400 12.4px/1.4 var(--mono);color:var(--fraco);white-space:nowrap}
.oc-d{font-size:13px;color:var(--tinta2)}
.oc-v{text-align:right;white-space:nowrap}

/* --- o que falta declarar --- */
.pend{padding:var(--s3) 0;border-top:1px solid var(--linha)}
.pend:first-child{border-top:0;padding-top:0}
.pend-h{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.papel{font:500 12px/1 var(--mono);padding:3px 8px;border-radius:99px;
 background:var(--campo2);color:var(--tinta2)}
.pend-m{margin-top:6px;font-size:13.8px;line-height:1.6;color:var(--tinta2);max-width:84ch}
.pend-c{margin-top:5px;font:400 12.4px/1.6 var(--mono);color:var(--fraco);
 overflow-wrap:anywhere}

/* --- o mapa de camadas (que NAO e grafo de dependencia) --- */
.mapa{display:flex;flex-direction:column;gap:var(--s3)}
.legenda{display:flex;gap:var(--s4);flex-wrap:wrap;font-size:12.4px;color:var(--fraco)}
.legenda span{display:inline-flex;align-items:center;gap:6px}
.legenda i{width:9px;height:9px;border-radius:50%;background:var(--c)}
/* Um PARAGRAFO de nota. `.nota` ao lado e um BLOCO com icone (`display:flex`), e usa-la
   num <p> fazia cada <b> e cada <code> virarem uma COLUNA — a legenda do mapa saia em
   quatro colunas, com um dois-pontos solto comecando a ultima. */
.nota-legenda{display:block;font-size:12.8px;line-height:1.6;color:var(--fraco);
 max-width:88ch;margin-top:var(--s4);padding:var(--s3) var(--s4);border-radius:var(--r2);
 background:var(--campo2);border:1px solid var(--fio)}
.nota-legenda code{font:400 12px/1.4 var(--mono)}

/* --- o item de "o que falta declarar": o renderizador emite dt/p/l, e as regras de
   `.item` falavam l1/tt/ev. Sem isso o rotulo colava no numero: "3 perguntas sem
   respostacobertura 70%". --- */
.item .dt{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);
 flex-wrap:wrap}
.item .dt b{font:600 14.6px/1.3 var(--sans);letter-spacing:-.008em}
.item .dt .p{font:400 12px/1 var(--mono);color:var(--fraco);white-space:nowrap}
.item>p{margin-top:7px;font-size:13.8px;line-height:1.6;color:var(--tinta2);max-width:84ch}
.item .l{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s4);
 padding:5px 0;border-top:1px solid var(--linha)}
.item .l:first-of-type{margin-top:9px}
.item .l span{font:400 12.6px/1.4 var(--mono);color:var(--tinta2);overflow-wrap:anywhere}
.item .l em{font-style:italic;font-size:12.8px;color:var(--fraco);text-align:right}
.leitura{margin-top:5px;font:400 11.8px/1.35 var(--mono);color:var(--fraco)}
.leitura.vazio{font-style:italic}

/* --- o cartao de um componente --- */
.card{border:1px solid var(--fio);border-radius:var(--r2);background:var(--campo);
 break-inside:avoid}
.comp{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.sys{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap;
 padding-bottom:10px;border-bottom:1px solid var(--linha)}
.sys h3{font:600 15.6px/1.25 var(--sans);letter-spacing:-.01em;margin-right:auto}
.dono{font:400 11.8px/1 var(--mono);color:var(--fraco)}

/* --- selo curto, com ponto de cor --- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:99px;
 font:500 11.6px/1.5 var(--sans);background:var(--campo2);color:var(--tinta2)}
.chip.bad{background:color-mix(in srgb,var(--crit) 12%,transparent);color:var(--crit)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
</style>
</head>
