# Comandos de LEITURA que a skill roda num host por SSH.
#
# `[comando]` são textos literais. `[molde]` tem vagas (`{unidade}`, `{container}`, `{porta}`…), e
# cada vaga só recebe valor validado por `lib/vagas.py` — nunca texto livre. O ssh entrega o comando
# ao shell de login do servidor: por isso o carregador recusa `;`, `|`, `&`, `$`, crase, `<`, `>`, `%`
# e quebra de linha. Distribuição que precisar de outro comando ganha outro arquivo, não um `if`.

# Processos de sistema que escutam porta e não interessam à auditoria (nome como o `ss` mostra).
ignorar = ["sshd", "systemd-resolve", "systemd-network", "chronyd", "systemd-timesyn",
           "rpcbind", "avahi-daemon", "cupsd", "dhclient", "master", "exim4", "dnsmasq"]

[comando]
usuario = "id -un"
kernel = "uname -sr"
sistema = "cat /etc/os-release"
disco = "df -P -k"
memoria = "cat /proc/meminfo"
carga = "cat /proc/loadavg"
cpus = "nproc"
boot = "cat /proc/uptime"
servicos = "systemctl list-units --type=service --state=running --no-legend --plain --no-pager"
portas = "ss -ltnpH"
containers = '''docker ps --format '{{.Names}}\t{{.Image}}\t{{.Ports}}' '''

# todos os processos com nome curto, memória e idade — sem linha de comando, que carrega senha.
# O filtro pelo nome do componente é feito na skill: o processo não vira vaga.
processos = "ps -e -o comm=,rss=,etimes="

# Moldes: comando com VAGA. Cada vaga tem validador em lib/vagas.py, e o runner monta o comando antes
# do subprocesso. Os caracteres proibidos são os mesmos dos comandos literais.
[molde]
servico_unidade = "systemctl show {unidade} --property=ActiveState,ActiveEnterTimestampMonotonic,NRestarts,MemoryCurrent --no-pager"
servico_container = '''docker inspect --format '{{.RestartCount}} {{json .State}}' {container}'''
memoria_container = '''docker stats --no-stream --format '{{.MemUsage}}' {container}'''
backup = "ls -l --time-style=full-iso {backup_pasta}"
