# Os produtos que a skill RECONHECE PELO NOME DA IMAGEM — e só isso.
#
# Três tabelas viviam no código, as três chaveadas por nome de imagem: o `kind` do serviço, a
# lista de quem monta o `docker.sock` por desenho, e os candidatos a fonte de métrica do
# `configurar.py alvos --sugerir`. Um produto é UMA coisa; o que a skill sabe sobre ele fica
# num bloco só, e acrescentar um é escrever um bloco — não editar três listas em dois arquivos.
#
# ATENÇÃO ao que isto NÃO é. O catálogo de métrica (`references/metricas/`) identifica a
# família pela SÉRIE QUE EXISTE, de propósito, porque nome de imagem mente com fork, imagem
# interna e tag genérica. Aqui o casamento é por nome porque não há alternativa: antes de
# falar com qualquer fonte, a skill precisa saber que perguntas fazer, e isso vem do papel, que
# vem do `kind`. É o elo fraco reconhecido do inventário — e por isso o `alvos.toml` sempre
# vence: `papel = "fila"` num `[[alvo.componente]]` corrige o que a imagem não diz.
#
# `imagem` é uma lista de trechos procurados no CAMINHO da imagem, em minúsculas. Trecho, não
# expressão: expressão num arquivo de dados é código, e o resto da skill recusa isso.
#
# A ORDEM DOS BLOCOS DECIDE o empate — o primeiro que casar vence. `test_produtos.py` fixa a
# classificação de cada produto conhecido, para reordenar não mudar o inventário em silêncio.

# --- quem recebe o tráfego
[[produto]]
nome = "traefik"
imagem = ["traefik"]
kind = "ingress/proxy"
socket_esperado = true          # lê o daemon para descobrir as rotas; é como ele funciona

  # Como ESTE proxy publica rota em label do Docker. O bloco era conhecimento cravado em três
  # módulos: a allowlist de redação (`redact`), a extração de rota por stack (`stacks`) e a
  # contagem de rotas por nó (`impact`) — os três com `traefik.` ou `.rule` escritos no código.
  #
  # `prefixo` é o que sobrevive à redação: label que não começa com um prefixo declarado é
  # DESCARTADO, nunca publicado. `sufixo_da_regra` é o que identifica a label que carrega a
  # regra de roteamento em si. Outro proxy que publique rota em label é outro bloco como este,
  # e nenhuma linha de código.
  [produto.rotas]
  prefixo = "traefik."
  sufixo_da_regra = ".rule"
  [produto.metricas]
  familia = "traefik_metrics"
  porta = 8080
  caminho = "/metrics"
  prioridade = 2
  entrega = "requisições e erros do proxy (exige o exporter Prometheus ligado nele)"

