# Família de exporter: cAdvisor (e compatíveis que publicam o mesmo vocabulário).
#
# É ela que responde pelo papel `app`. A razão está em `lib/perguntas.py`: não existe métrica
# que TODA aplicação publique — uma API em Go, um worker em Python e um frontend estático não
# compartilham vocabulário. O que existe para qualquer uma é o que o CONTAINER consome, e isso
# quem mede é o exporter de container, não a aplicação.
#
# As consultas de CPU e memória não foram inventadas: são as que já rodavam em `lib/enrich.py`
# contra um cluster real, com 43 séries respondidas em cada uma.
familia = "cadvisor"
prioridade = 40

papel = "app"
# NÃO prova papel: a etiqueta desta família é o nome do serviço no Swarm, então TODO
# componente do cluster casa por igualdade exata (medido: 5 de 5). Ela MEDE qualquer
# container e não diz nada sobre o que ele É. Ver D1 no spec.
identifica_papel = false

[identificacao]
# A série que só um exporter de container publica. Identificar pela SÉRIE, e não pelo nome da
# imagem, é o que faz um fork ou uma imagem interna continuarem sendo reconhecidos.
metrica_presente = "container_cpu_usage_seconds_total"

[seletor]
# No Swarm, o cAdvisor carrega o nome do serviço nesta etiqueta. É ela que liga a série ao
# COMPONENTE — sem isso, a resposta seria do nó inteiro e valeria para todos os serviços
# igualmente, que é exatamente a mis-atribuição que o relatório já teve com o proxy.
etiqueta = "container_label_com_docker_swarm_service_name"

[[pergunta]]
id = "app.cpu"
query = 'sum(rate(container_cpu_usage_seconds_total{%SELETOR%}[%JANELA%])) * 100'
valor = "decimal"

[[pergunta]]
id = "app.memoria"
query = 'sum(container_memory_usage_bytes{%SELETOR%})'
valor = "inteiro"

# Parte das horas de 7 dias, a retenção medida, em que o serviço teve container. Sem o `or`, a
# hora sem série sumiria da média e todo serviço daria 100%. O ramo que completa a hora conta o
# cluster inteiro, sem `%SELETOR%`: ele vale 0 quando o serviço sumiu e os outros continuam
# sendo raspados, e não existe na hora sem scrape, que assim fica fora da média. `vector(0)`
# existiria nela também, e o buraco do Prometheus viraria indisponibilidade do serviço. O `and`
# final devolve "sem dados" em vez de 0% quando a fonte não publica `container_last_seen`.
# Serviço criado há menos de 7 dias conta as horas anteriores como indisponíveis, então pode
# aparecer abaixo do real.
[[pergunta]]
id = "app.disponibilidade_7d"
query = '100 * avg_over_time(((count(container_last_seen{name!="",%SELETOR%}) > bool 0) or 0 * count(container_last_seen{name!=""}))[7d:1h]) and on () count(container_last_seen{name!="",%SELETOR%})'
valor = "decimal"
