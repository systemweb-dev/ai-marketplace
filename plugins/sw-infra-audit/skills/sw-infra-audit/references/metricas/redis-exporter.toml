# Família de exporter: redis_exporter.
#
# `cache.acerto` calcula a razão na própria consulta, porque o Redis publica acertos e erros
# como dois contadores separados. Sem nenhuma leitura na janela o resultado é NaN, que sai como
# `sem dados`: cache sem acesso não tem taxa, e 0% acusaria um problema que não existe.
familia = "redis-exporter"
prioridade = 40

papel = "cache"
# `redis_memory_used_bytes` existe no Redis E nos forks compatíveis em protocolo — e é
# exatamente por isso que ela PROVA o papel: identifica a família do produto, não a imagem.
identifica_papel = true

[identificacao]
metrica_presente = "redis_memory_used_bytes"

[seletor]
etiqueta = "job"

[[pergunta]]
id = "cache.memoria_usada"
query = 'sum(redis_memory_used_bytes{%SELETOR%})'
valor = "inteiro"

[[pergunta]]
id = "cache.evicções"
query = 'sum(increase(redis_evicted_keys_total{%SELETOR%}[%JANELA%]))'
valor = "inteiro"

[[pergunta]]
id = "cache.acerto"
query = '100 * sum(rate(redis_keyspace_hits_total{%SELETOR%}[%JANELA%])) / (sum(rate(redis_keyspace_hits_total{%SELETOR%}[%JANELA%])) + sum(rate(redis_keyspace_misses_total{%SELETOR%}[%JANELA%])))'
valor = "decimal"
