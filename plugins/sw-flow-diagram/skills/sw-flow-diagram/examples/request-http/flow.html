<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Request HTTP — arquitetura web — Flow</title>
<script>(function(){try{if(localStorage.getItem('flow-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f8fc;--bg2:#eef2f9;--surface:#ffffff;--ink:#16203a;--muted:#7c879c;
    --line:#e3e9f3;--accent:#2f6bf0;--accent-dk:color-mix(in oklab,var(--accent),#000 24%);
    --accent-lt:color-mix(in oklab,var(--accent),#fff 18%);--node:#ffffff;--node-line:#dbe3f1;
    --edge:#9fb0cf;--display:'Hanken Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
  }
  html[data-theme="dark"]{
    --bg:#0c1322;--bg2:#0a1020;--surface:#141d30;--ink:#e8eef9;--muted:#8392ab;
    --line:#243049;--node:#16213a;--node-line:#2a3a59;--edge:#46577a;
    --accent:color-mix(in oklab,#2f6bf0,#fff 18%);
    --accent-dk:color-mix(in oklab,var(--accent),#fff 30%);--accent-lt:color-mix(in oklab,var(--accent),#fff 12%);
  }
  *{box-sizing:border-box;} body{margin:0;background:radial-gradient(1100px 600px at 80% -10%,color-mix(in oklab,var(--accent),transparent 90%),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2));color:var(--ink);font-family:var(--display);height:100vh;overflow:hidden;display:flex;flex-direction:column;}
  .bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;backdrop-filter:blur(10px);background:color-mix(in oklab,var(--bg),transparent 25%);border-bottom:1px solid var(--line);}
  .bar h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em;}
  .bar .sp{flex:1;}
  .ed-hint{font:500 10.5px/1.3 var(--mono);color:var(--muted);max-width:430px;}
  @media(max-width:900px){.ed-hint{display:none;}}
  /* foco visível em tudo que recebe teclado: sem isso, navegar por Tab é andar no escuro */
  .bar button:focus-visible,.fpanel button:focus-visible,.fdock button:focus-visible,
  .fpanel input:focus-visible,.fpanel select:focus-visible,.fpanel textarea:focus-visible,
  .fdock input:focus-visible,.diagram .node:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* o que só o leitor de tela precisa ouvir (erro de validação, resultado de uma ação) */
  .btn.primary.sujo::after{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block;margin-left:6px;vertical-align:middle;}
  .sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;}
  /* telas estreitas: paleta e painel viram gavetas sobre o canvas, que continua utilizável */
  @media(max-width:900px){
    .fdock{position:fixed;z-index:24;top:52px;bottom:0;left:0;width:min(78vw,300px);box-shadow:0 10px 40px -12px rgba(10,20,50,.35);}
    .fdock.closed{transform:translateX(-100%);}
    .fpanel{position:fixed;z-index:25;top:52px;bottom:0;right:0;width:min(84vw,320px);box-shadow:0 10px 40px -12px rgba(10,20,50,.35);}
    .stage{margin:0;}
  }
  @media(max-width:640px){
    .bar h1{max-width:9rem;}
    /* um de cada vez: com os dois abertos não sobra canvas nenhum */
    body.painel-aberto .fdock{transform:translateX(-100%);}
  }
  .btn{font:600 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 12px;cursor:pointer;transition:.15s;}
  .btn:hover{border-color:var(--accent);color:var(--accent-dk);}
  .btn.primary{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-dk));border:0;}
  .stage{flex:1;min-height:0;overflow:auto;padding:0;}
  svg.diagram{display:block;}
  .gbox{fill:color-mix(in oklab,var(--gc),transparent 92%);stroke:color-mix(in oklab,var(--gc),transparent 60%);stroke-width:1.5;stroke-dasharray:5 5;}
  .lbox{fill:color-mix(in oklab,var(--gc),transparent 94%);stroke:color-mix(in oklab,var(--gc),transparent 70%);stroke-width:1.4;}
  .glabel{fill:color-mix(in oklab,var(--gc),#000 10%);font:700 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;}
  html[data-theme="dark"] .glabel{fill:color-mix(in oklab,var(--gc),#fff 25%);}
  .nbox{fill:var(--node);stroke:var(--node-line);stroke-width:1.5;filter:drop-shadow(0 10px 18px rgba(20,30,60,.10));}
  .node .ico{color:var(--accent-dk);}
  .nlabel{fill:var(--ink);font:600 13px/1 var(--display);}
  .noteDot{fill:var(--accent);}
  .node.hl .nbox{animation:pulse 3s ease-in-out infinite;animation-delay:var(--d);}
  @keyframes pulse{0%,72%,100%{stroke:var(--node-line);}80%{stroke:var(--accent);filter:drop-shadow(0 0 10px var(--accent));}}
  .edge{fill:none;stroke:var(--edge);stroke-width:2;}
  .edge.dashed{stroke-dasharray:6 5;}
  .edge.animated{stroke-dasharray:7 6;animation:flow 2.2s linear infinite;}
  @keyframes flow{to{stroke-dashoffset:-26;}}
  .packet{fill:var(--accent);filter:drop-shadow(0 0 5px var(--accent));}
  .elabel{fill:var(--muted);font:600 11px/1 var(--mono);text-anchor:middle;}
  #arrow path{fill:var(--edge);}
  body.paused .edge.animated{animation:none;} body.paused .packet{display:none;} body.paused .node.hl .nbox{animation:none;}
  body.export{height:auto;overflow:visible;} body.export .bar{display:none!important;} body.export .stage{overflow:visible;}
  .tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:7px 10px;border-radius:8px;max-width:260px;opacity:0;transition:.12s;z-index:9;}
  svg .node{cursor:grab;} body.dragging,body.dragging *{cursor:grabbing!important;} body.dragging .tip{opacity:0!important;}
  .stage{cursor:grab;} body.panning,body.panning *{cursor:grabbing!important;} body.panning .tip{opacity:0!important;}
  /* editor de canvas */
  .node.sel .nbox{stroke:var(--accent);stroke-width:2.5;}
  .edge.sel{stroke:var(--accent);stroke-width:3;}
  .edge.ghost{stroke:var(--accent);stroke-dasharray:4 4;opacity:.7;pointer-events:none;}
  .port{fill:var(--accent);stroke:var(--surface);stroke-width:1.5;opacity:0;cursor:crosshair;transition:opacity .12s;}
  .node:hover .port,.node.sel .port{opacity:.95;}
  .ehandle{fill:var(--surface);stroke:var(--accent);stroke-width:2.5;cursor:grab;}
  .ntb{position:fixed;display:none;gap:5px;z-index:20;}
  .ntb button{font-size:14px;line-height:1;width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:7px;cursor:pointer;box-shadow:0 6px 18px -8px rgba(10,20,50,.4);}
  .ntb button:hover{border-color:var(--accent);}
  .ipal{position:fixed;z-index:21;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px;display:grid;grid-template-columns:repeat(6,1fr);gap:3px;box-shadow:0 16px 50px -16px rgba(10,20,50,.45);max-width:236px;}
  .ipal button{width:30px;height:30px;display:flex;align-items:center;justify-content:center;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:7px;cursor:pointer;}
  .ipal button:hover{border-color:var(--accent);color:var(--accent-dk);}
  .inlED{position:fixed;z-index:22;font:600 13px var(--display);text-align:center;border:2px solid var(--accent);border-radius:7px;padding:3px 6px;background:var(--surface);color:var(--ink);outline:none;box-shadow:0 8px 24px -10px rgba(10,20,50,.4);}
  /* paleta de componentes (catálogo) */
  .cpal{position:fixed;z-index:23;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;box-shadow:0 20px 60px -18px rgba(10,20,50,.5);width:302px;max-height:66vh;overflow:auto;}
  .cpal .srch{width:100%;margin-bottom:8px;font:500 12px var(--display);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);outline:none;}
  .cpal .srch:focus{border-color:var(--accent);}
  .cpal h4{margin:9px 4px 4px;font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .cpal h4:first-child{margin-top:0;}
  .cpal .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px;}
  .cpal button{display:flex;align-items:center;gap:7px;padding:7px 8px;font:600 12px var(--display);color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:8px;cursor:pointer;text-align:left;overflow:hidden;}
  .cpal button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .cpal button:hover{border-color:var(--accent);color:var(--accent-dk);}
  .cpal button svg{flex:none;color:var(--accent-dk);}
  .cpal .blank{grid-column:1/-1;justify-content:center;color:var(--muted);}
  /* menu de grupos (atribuir/criar) */
  .gmenu{position:fixed;z-index:23;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:6px;min-width:176px;box-shadow:0 16px 50px -16px rgba(10,20,50,.45);}
  .gmenu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;font:600 12px var(--display);color:var(--ink);background:none;border:0;border-radius:7px;cursor:pointer;}
  .gmenu button:hover{background:var(--bg);}
  .gmenu .dot{width:11px;height:11px;border-radius:3px;flex:none;}
  .gmenu .sep{height:1px;background:var(--line);margin:4px 2px;}
  .gmenu input{width:100%;font:500 12px var(--display);padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);outline:none;margin-top:3px;}
  .gmenu input:focus{border-color:var(--accent);}

  /* ---------- toolbar: botões de ícone agrupados ---------- */
  .grp{display:flex;gap:2px;padding:2px;background:var(--soft,rgba(127,127,127,.09));border-radius:9px;}
  .ib{width:29px;height:29px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink);
      border-radius:7px;cursor:pointer;font:600 15px/1 var(--display);transition:background .12s;}
  .ib:hover:not(:disabled){background:var(--bg);}
  .ib:disabled{opacity:.3;cursor:default;}

  /* ---------- painel de propriedades ---------- */
  .fpanel{position:fixed;top:56px;right:0;bottom:0;width:288px;background:var(--card,var(--bg));
          border-left:1px solid var(--line);padding:16px;overflow-y:auto;z-index:40;
          transform:translateX(100%);transition:transform .18s ease;display:flex;flex-direction:column;gap:13px;}
  .fpanel.open{transform:none;}
  body.presenting .fpanel,body.export .fpanel{display:none;}
  .ph{display:flex;flex-direction:column;gap:2px;padding-bottom:11px;border-bottom:1px solid var(--line);}
  .ph b{font:700 13px var(--display);}
  .ph span{font:500 10.5px var(--mono);color:var(--muted);}
  .fld{display:flex;flex-direction:column;gap:5px;}
  .fl{font:700 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .finp,.fsel,.fta{width:100%;font:500 12.5px var(--display);padding:7px 9px;border:1px solid var(--line);
                   border-radius:8px;background:var(--bg);color:var(--ink);outline:none;}
  .fta{min-height:62px;resize:vertical;line-height:1.5;}
  .finp:focus,.fsel:focus,.fta:focus{border-color:var(--accent);}
  .fico{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;}
  .fico button{aspect-ratio:1;display:grid;place-items:center;border:1px solid transparent;border-radius:7px;
               background:var(--bg);color:var(--ink);cursor:pointer;}
  .fico button:hover{border-color:var(--line);}
  .fico button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft,transparent);}
  .fchk{display:flex;align-items:center;gap:8px;font:500 12px var(--display);color:var(--ink);cursor:pointer;}
  .frow{display:flex;gap:7px;margin-top:auto;padding-top:11px;}
  .fbtn{flex:1;font:600 12px var(--display);padding:8px;border:1px solid var(--line);border-radius:8px;
        background:var(--bg);color:var(--ink);cursor:pointer;}
  .fbtn:hover{border-color:var(--accent);}
  .fbtn.danger:hover{border-color:#d3453b;color:#d3453b;}

  /* ---------- guias de alinhamento e laço ---------- */
  .guide{stroke:#e0407f;stroke-width:1;stroke-dasharray:4 4;opacity:.85;pointer-events:none;}
  .marquee{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 3;}

  /* ---------- grupo recolhido ---------- */
  .gcollapsed{cursor:pointer;}
  .cbox{fill:var(--gc);fill-opacity:.1;stroke:var(--gc);stroke-width:1.5;}
  .clabel{font:700 14px var(--display);fill:var(--ink);}
  .csub{font:500 10px var(--mono);fill:var(--muted);}
  .cchev{font:700 17px var(--display);fill:var(--muted);}
  .gtoggle{font:700 15px var(--display);fill:var(--gc);cursor:pointer;opacity:.75;}
  .gtoggle:hover{opacity:1;}
  .nstripe{fill:var(--gc);}

  /* ---------- apresentação ---------- */
  .node.dim,.edge.dim,.elabel.dim{opacity:.13;transition:opacity .3s;}
  body.presenting .bar .btn,body.presenting .bar .ib,body.presenting .bar .grp{display:none;}
  .pbar{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);display:flex;align-items:center;gap:11px;
        background:var(--card,var(--bg));border:1px solid var(--line);border-radius:13px;padding:9px 11px;
        box-shadow:0 10px 34px rgba(0,0,0,.19);z-index:60;max-width:min(720px,92vw);}
  .pbar button{width:31px;height:31px;border:0;border-radius:8px;background:var(--bg);color:var(--ink);
               cursor:pointer;font:600 17px/1 var(--display);}
  .pbar button:hover{background:var(--accent);color:#fff;}
  .pbar button.x{width:auto;padding:0 13px;font:600 12px var(--display);}
  .pinfo{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .pinfo b{font:700 11.5px var(--display);}
  .pinfo span{font:500 10.5px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- busca ---------- */
  .fsearch{position:fixed;top:76px;left:50%;transform:translateX(-50%);width:min(430px,92vw);z-index:70;
           background:var(--card,var(--bg));border:1px solid var(--line);border-radius:13px;padding:9px;
           box-shadow:0 14px 40px rgba(0,0,0,.2);}
  .fsearch input{width:100%;font:500 13.5px var(--display);padding:9px 11px;border:1px solid var(--line);
                 border-radius:9px;background:var(--bg);color:var(--ink);outline:none;}
  .fsearch input:focus{border-color:var(--accent);}
  .fsearch .res{max-height:290px;overflow-y:auto;margin-top:7px;display:flex;flex-direction:column;gap:2px;}
  .fsearch .res button{display:flex;justify-content:space-between;align-items:center;gap:9px;width:100%;
                       text-align:left;border:0;background:transparent;color:var(--ink);cursor:pointer;
                       padding:7px 10px;border-radius:8px;font:500 12.5px var(--display);}
  .fsearch .res button:hover,.fsearch .res button.on{background:var(--accent);color:#fff;}
  .fsearch .res em{font:500 10px var(--mono);opacity:.65;font-style:normal;}

  /* ---------- paleta fixa (arrastar para o diagrama) ---------- */
  .fdock{position:fixed;top:56px;left:0;bottom:0;width:196px;background:var(--card,var(--bg));
         border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:35;}
  .fdock.closed{width:38px;}
  body.presenting .fdock,body.export .fdock{display:none;}
  .dkh{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:10px 8px 8px 12px;
       font:700 9.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);}
  .fdock.closed .dkh span{display:none;}
  .dktog{width:22px;height:22px;border:0;background:transparent;color:var(--muted);cursor:pointer;
         border-radius:6px;font:600 14px/1 var(--display);}
  .dktog:hover{background:var(--bg);color:var(--ink);}
  .dksrch{margin:0 8px 8px;font:500 11.5px var(--display);padding:6px 8px;border:1px solid var(--line);
          border-radius:7px;background:var(--bg);color:var(--ink);outline:none;}
  .dksrch:focus{border-color:var(--accent);}
  .dkbody{flex:1;overflow-y:auto;padding:0 8px 12px;}
  .dksection{display:block;width:100%;margin:8px 0 3px;padding:7px 5px;border:0;border-bottom:1px solid var(--line);
             background:transparent;color:var(--muted);cursor:pointer;text-align:left;font:700 9px var(--mono);
             letter-spacing:.1em;text-transform:uppercase;}
  .dksection:hover{color:var(--accent);}
  .dkbody h5{margin:9px 0 5px 4px;font:700 8.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
  .dkgrid{display:flex;flex-direction:column;gap:2px;}
  /* formas em duas colunas: são 21 e, em lista, empurravam as categorias para fora da tela */
  .dkgrid.duas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;}
  .dkgrid[hidden]{display:none;}
  .dkit{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;
        background:transparent;color:var(--ink);cursor:grab;padding:6px 8px;border-radius:7px;
        font:500 11.5px var(--display);}
  .dkit:hover{background:var(--bg);border-color:var(--line);}
  .dkit:active{cursor:grabbing;}
  .dkit span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dkit .shp{flex:none;fill:none;stroke:currentColor;stroke-width:1.6;opacity:.72;}
  .dkit.dksh{flex-direction:column;align-items:center;gap:4px;text-align:center;padding:7px 4px;}
  .dkit.dksh span{max-width:100%;font-size:10.5px;line-height:1.2;white-space:normal;}
  .dkit:hover .shp{opacity:1;color:var(--accent);}
  .fnote{margin:0;font:500 11px/1.5 var(--display);color:var(--muted);}
  .nlabel.mid{text-anchor:middle;}
  .nedge{stroke:var(--line);stroke-width:1.3;fill:none;}
  /* as 4 portas só aparecem quando são úteis: ao passar sobre o nó ou ao conectar */
  .node .port{opacity:0;transition:opacity .12s;cursor:crosshair;}
  .node:hover .port,.node.sel .port,body.connecting .node .port{opacity:1;}
  body.connecting .node:hover .port{r:7.5;}
  .dkempty{margin:12px 4px;font:500 11px var(--display);color:var(--muted);}
  .dkghost{position:fixed;z-index:90;pointer-events:none;display:flex;align-items:center;gap:7px;
           padding:7px 11px;border-radius:10px;font:600 12px var(--display);
           background:var(--card,var(--bg));border:1px solid var(--line);color:var(--muted);
           box-shadow:0 8px 22px rgba(0,0,0,.17);opacity:.9;}
  .dkghost.ok{border-color:var(--accent);color:var(--accent);}
  /* o canvas encolhe quando as laterais abrem — sem isso os nós ficam DEBAIXO do painel,
     impossíveis de clicar ou de receber uma conexão solta em cima */
  .stage{margin-left:196px;transition:margin .18s ease;}
  body:has(.fpanel.open) .stage{margin-right:288px;}
  body:has(.fdock.closed) .stage{margin-left:38px;}
  body.presenting .stage,body.export .stage{margin-left:0;}
</style>
</head>
<body>
<div class="bar" role="toolbar" aria-label="Ferramentas do diagrama">
  <h1>Request HTTP — arquitetura web</h1>
  <div class="grp">
    <button class="ib" id="undoBtn" title="Desfazer (Ctrl+Z)" aria-label="Desfazer"><span aria-hidden="true">↶</span></button>
    <button class="ib" id="redoBtn" title="Refazer (Ctrl+Shift+Z)" aria-label="Refazer"><span aria-hidden="true">↷</span></button>
  </div>
  <div class="grp">
    <button class="ib" id="zoomOut" title="Diminuir (−)" aria-label="Diminuir o zoom"><span aria-hidden="true">−</span></button>
    <button class="ib" id="fitBtn" title="Enquadrar (0)" aria-label="Enquadrar o diagrama"><span aria-hidden="true">⊡</span></button>
    <button class="ib" id="zoomIn" title="Aumentar (+)" aria-label="Aumentar o zoom"><span aria-hidden="true">+</span></button>
  </div>
  <button class="ib" id="searchBtn" title="Buscar nó (Ctrl+F)" aria-label="Buscar nó"><span aria-hidden="true">⌕</span></button>
  <div class="sp"></div>
  <button class="btn" id="presentBtn" title="Percorrer o fluxo etapa por etapa" aria-label="Apresentar o fluxo etapa por etapa"><span aria-hidden="true">▶</span> Apresentar</button>
  <button class="btn" id="autoPos" title="Voltar ao layout automático" aria-label="Voltar ao layout automático"><span aria-hidden="true">⤢</span> Auto</button>
  <button class="btn" id="play" aria-label="Pausar a animação do fluxo"><span aria-hidden="true">⏸</span> Pausar</button>
  <button class="btn" onclick="exp('svg')" aria-label="Exportar em SVG">SVG</button>
  <button class="btn" onclick="exp('png')" aria-label="Exportar em PNG">PNG</button>

const NS = 'http://www.w3.org/2000/svg';

/** Cria elemento SVG com atributos. `inner` entra como innerHTML (usado só p/ ícones nossos). */
function mk(tag, attrs, inner) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (inner != null) el.innerHTML = inner;
  return el;
}
/** Cria elemento HTML com classe e conteúdo opcionais. */
function h(tag, cls, inner) {
  const el = document.createElement(tag);
  if (cls) el.className = cls;
  if (inner != null) el.innerHTML = inner;
  return el;
}
/** Ponto do evento convertido para coordenadas do SVG (respeita zoom/pan). */
function toSvg(e) {
  const p = svg.createSVGPoint();
  p.x = e.clientX; p.y = e.clientY;
  return p.matrixTransform(svg.getScreenCTM().inverse());
}
/** Ponto do SVG convertido para coordenadas de tela (posicionar UI HTML sobre o canvas). */
function toScreen(x, y) {
  const p = svg.createSVGPoint();
  p.x = x; p.y = y;
  return p.matrixTransform(svg.getScreenCTM());
}

// Os quatro lados de conexão. Guardar o lado (e não só "entrada/saída") é o que permite

function render() {

function renderGroups() {

function renderEdges() {
  const vistas = new Set();
  EDGE_OFF = parallelOffsets(F.edges || [], endpointOf);
  const fundidas = mergedCounts(F.edges || [], endpointOf);
  (F.edges || []).forEach((ed, i) => {
    const a = endpointOf(ed.from), b = endpointOf(ed.to);
    if (a === b) return;                            // aresta interna a um grupo recolhido
    const chave = a + '>' + b;
    if (vistas.has(chave)) return;                  // grupo recolhido funde paralelas
    vistas.add(chave);
    const qtd = fundidas.get(chave) || 1;
    const agregada = qtd > 1 && (a.startsWith('g:') || b.startsWith('g:'));
    const geo = edgeGeom(ed, agregada ? 0 : EDGE_OFF[i]);
    if (!geo) return;
    const c = [geo.p1[0], geo.p1[1], geo.p2[0], geo.p2[1]];
    const anim = ed.animated !== false;
    const cls = 'edge' + (anim ? ' animated' : '') + (ed.style === 'dashed' ? ' dashed' : '')
      + (sel.edge === i ? ' sel' : '') + (dimmed(a, b) ? ' dim' : '');
    const p = mk('path', { id: 'e' + i, 'data-i': i, d: geo.d, class: cls, 'marker-end': 'url(#arrow)' });
    p.style.pointerEvents = 'stroke';
    p.addEventListener('pointerdown', ev => { ev.stopPropagation(); selectEdge(i); render(); });
    p.addEventListener('dblclick', ev => { ev.stopPropagation(); editLabel('e', i); });
    svg.appendChild(p);
    if (ANIM === 'packet' && anim && !dimmed(a, b)) {
      // animateMotion SOMA uma translação sobre cx/cy — por isso o círculo fica em (0,0)
      // e quem o posiciona é o movimento. Só que, com `begin` escalonado, ele apareceria
      // parado no canto até a sua vez: nasce invisível e acende junto com o movimento.
      const atraso = (i * .25).toFixed(2) + 's';
      const pk = mk('circle', { r: 4.5, class: 'packet', opacity: 0 });
      const am = mk('animateMotion', { dur: DUR + 's', begin: atraso, repeatCount: 'indefinite' });
      am.appendChild(mk('mpath', { href: '#e' + i }));
      pk.appendChild(am);
      pk.appendChild(mk('set', { attributeName: 'opacity', to: 1, begin: atraso, fill: 'freeze' }));
      svg.appendChild(pk);

    const texto = agregada ? (ed.label ? ed.label + ' (' + qtd + ')' : qtd + ' conexões') : ed.label;
    if (texto) {
      // No leque, cada rótulo acompanha a SUA linha: no mesmo lugar, os dois viravam um borrão.
      const off = agregada ? 0 : (EDGE_OFF[i] || 0);
      const horizontal = geo.s1 === 'left' || geo.s1 === 'right';
      const t = mk('text', {
        x: ((c[0] + c[2]) / 2 + (horizontal ? 0 : off)).toFixed(0),
        y: ((c[1] + c[3]) / 2 + (horizontal && off > 0 ? 16 : -8)).toFixed(0),
        class: 'elabel' + (dimmed(a, b) ? ' dim' : '') });
      t.textContent = texto; svg.appendChild(t);
    }
  });
}

function renderEdgeHandles() {
  if (sel.edge === null || !F.edges[sel.edge]) return;
  const ed = F.edges[sel.edge];
  const geo = edgeGeom(ed);
  if (!geo) return;
  [['from', geo.p1], ['to', geo.p2]].forEach(([end, pt]) => {
    const el = mk('circle', { cx: pt[0], cy: pt[1], r: 7, class: 'ehandle', 'data-end': end });
    el.addEventListener('pointerdown', ev => startRelink(ev, sel.edge, end));
    svg.appendChild(el);

/** Trunca o rótulo ao que cabe na forma. Sem isso, "Decisão de roteamento" transborda

  // uma porta por lado: é o que permite ligar por cima/baixo além dos lados
  SIDES.forEach(side => {
    const a = anchorSide([0, 0], side, NW, NH);
    g.appendChild(mk('circle', { cx: a[0], cy: a[1], r: 6, class: 'port', 'data-side': side }));
  });

/* ---- interação: arrastar (com guias), laço, conectar, religar, teclado ---- */
const SNAP = 6;                        // tolerância de encaixe, em unidades do diagrama

/** Guias de alinhamento: compara o nó arrastado com os demais e devolve o
    deslocamento que encaixa, mais as linhas a desenhar. É o detalhe que faz o
    diagrama sair alinhado sem ninguém medir nada. */
function alignmentGuides(movingIds, x, y) {
  const moving = new Set(movingIds);
  const alvos = [];
  (F.nodes || []).forEach(n => {
    if (moving.has(n.id) || !POS[n.id] || !nodeVisible(n)) return;
    const p = POS[n.id];
    alvos.push({ cx: p[0] + NW / 2, cy: p[1] + NH / 2, x0: p[0], y0: p[1], x1: p[0] + NW, y1: p[1] + NH });
  });
  const meu = { cx: x + NW / 2, cy: y + NH / 2, x0: x, y0: y, x1: x + NW, y1: y + NH };
  let dx = 0, dy = 0; const linhas = [];
  let melhorX = SNAP + 1, melhorY = SNAP + 1;
  alvos.forEach(a => {
    [['cx', 'cx'], ['x0', 'x0'], ['x1', 'x1'], ['x0', 'x1'], ['x1', 'x0']].forEach(([m, o]) => {
      const d = a[o] - meu[m];
      if (Math.abs(d) < Math.abs(melhorX)) { melhorX = d; }
    });
    [['cy', 'cy'], ['y0', 'y0'], ['y1', 'y1'], ['y0', 'y1'], ['y1', 'y0']].forEach(([m, o]) => {
      const d = a[o] - meu[m];
      if (Math.abs(d) < Math.abs(melhorY)) { melhorY = d; }
    });
  });
  if (Math.abs(melhorX) <= SNAP) { dx = melhorX; linhas.push(['v', meu.cx + dx]); }
  if (Math.abs(melhorY) <= SNAP) { dy = melhorY; linhas.push(['h', meu.cy + dy]); }

}
function drawGuides(linhas) {
  svg.querySelectorAll('.guide').forEach(e => e.remove());
  const b = contentBBox();
  linhas.forEach(([dir, v]) => {
    const at = dir === 'v' ? { x1: v, y1: b[1] - 400, x2: v, y2: b[3] + 400 }
                           : { x1: b[0] - 400, y1: v, x2: b[2] + 400, y2: v };
    svg.appendChild(mk('line', { ...at, class: 'guide' }));

/** Reflete a seleção no DOM sem re-renderizar.

    Um render() aqui destruiria o próprio elemento que recebeu o pointerdown — junto com
    o pointer capture e os listeners do arrasto. Era exatamente por isso que arrastar
    parava de funcionar assim que o nó ficava selecionado. */
function pintarSelecao() {
  svg.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('sel', isNodeSelected(el.getAttribute('data-id')));
  });
  svg.querySelectorAll('.edge').forEach(el => {
    el.classList.toggle('sel', sel.edge === +el.getAttribute('data-i'));
  });
  renderPanel();
}

function bindNode(g, n) {
  g.querySelectorAll('.port').forEach(port => {
    port.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      startConnect(ev, n.id, port.getAttribute('data-side'));
    });
  });
  g.addEventListener('dblclick', ev => { ev.stopPropagation(); editLabel('n', n.id); });
  g.addEventListener('pointerdown', ev => {
    if (ev.button !== 0 || ev.target.classList.contains('port')) return;
    ev.preventDefault();
    const additive = ev.shiftKey || ev.ctrlKey || ev.metaKey;
    if (!isNodeSelected(n.id)) selectNode(n.id, additive);
    else if (additive) { selectNode(n.id, true); pintarSelecao(); return; }
    pintarSelecao();

    const ids = selNodeIds();
    const inicio = toSvg(ev);
    const base = {}; ids.forEach(id => { if (POS[id]) base[id] = [...POS[id]]; });
    let mexeu = false, registrou = false;
    document.body.classList.add('dragging');

    const mv = e => {
      const q = toSvg(e);
      let dx = q.x - inicio.x, dy = q.y - inicio.y;
      if (!mexeu && Math.abs(dx) + Math.abs(dy) < 3) return;
      if (!registrou) { beginChange(); registrou = true; }   // só grava histórico se moveu de fato
      mexeu = true;
      if (base[n.id]) {
        const gd = alignmentGuides(ids, base[n.id][0] + dx, base[n.id][1] + dy);
        dx += gd.dx; dy += gd.dy;
        drawGuides(gd.linhas);

      ids.forEach(id => { if (base[id]) POS[id] = [Math.max(0, base[id][0] + dx), Math.max(0, base[id][1] + dy)]; });

      window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
      document.body.classList.remove('dragging');
      svg.querySelectorAll('.guide').forEach(e => e.remove());
      render();
    };

  });

/** Redesenho barato durante o arrasto: move só os nós afetados e reroteia as arestas.
    Um render() completo a cada pointermove trava em diagrama grande. */
function quickRedraw(ids) {
  ids.forEach(id => {
    const el = svg.querySelector(`.node[data-id="${id}"]`);
    if (el && POS[id]) el.setAttribute('transform', `translate(${POS[id][0].toFixed(1)},${POS[id][1].toFixed(1)})`);
  });
  const set = new Set(ids);
  svg.querySelectorAll('.edge').forEach(p => {
    const ed = F.edges[+p.getAttribute('data-i')];
    if (!ed || (!set.has(ed.from) && !set.has(ed.to))) return;
    const geo = edgeGeom(ed);
    if (geo) p.setAttribute('d', geo.d);
  });
  svg.querySelectorAll('.group,.gcollapsed').forEach(e => e.remove());
  const antes = svg.querySelector('.edge') || svg.querySelector('.node');
  const tmp = document.createDocumentFragment();
  const alvo = svg;
  renderGroupsInto(tmp);
  if (antes) alvo.insertBefore(tmp, antes); else alvo.appendChild(tmp);
  onRender();

function renderGroupsInto(frag) {
  const guarda = svg.appendChild.bind(svg);
  svg.appendChild = el => frag.appendChild(el);
  try { renderGroups(); } finally { svg.appendChild = guarda; }
}

let ghost = null;

  document.body.classList.add('connecting');       // acende as portas de todos os nós
  const box = endBox(endpointOf(fromId));
  const p1 = anchorSide(box.pos, lado || 'right', box.w, box.h);
  let ladoAlvo = null;
  const mv = e => {
    const l = toSvg(e);
    const sob = nodeUnder(e);
    // enquanto está sobre um nó, mostra em qual lado vai encostar
    ladoAlvo = sob && POS[sob] ? ladoMaisProximo(POS[sob], l) : null;
    const p2 = ladoAlvo ? anchorSide(POS[sob], ladoAlvo, NW, NH) : [l.x, l.y];
    ghost.setAttribute('d', edgePath(p1[0], p1[1], p2[0], p2[1], lado || 'right', ladoAlvo || 'left'));
  };

    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
    document.body.classList.remove('dragging', 'connecting');
    ghost.remove(); ghost = null;
    const alvo = nodeUnder(e);
    if (alvo && alvo !== fromId) {
      const duplicada = (F.edges || []).some(ed => ed.from === fromId && ed.to === alvo);
      if (!duplicada) {
        beginChange();
      }
      if (!duplicada && addEdge(fromId, alvo)) {
        const nova = F.edges[F.edges.length - 1];
        if (lado) nova.fromSide = lado;
        if (ladoAlvo) nova.toSide = ladoAlvo;

    const a = anchorSide(pos, s, NW, NH);

    if (d < dist) { dist = d; melhor = s; }

    const l = toSvg(e);
    const geo = edgeGeom(ed);
    if (!geo) return;
    const sob = nodeUnder(e);
    ladoNovo = sob && POS[sob] ? ladoMaisProximo(POS[sob], l) : null;
    const movel = ladoNovo && sob ? anchorSide(POS[sob], ladoNovo, NW, NH) : [l.x, l.y];
    const fixo = end === 'from' ? geo.p2 : geo.p1;
    const p = svg.querySelector(`.edge[data-i="${idx}"]`);
    if (!p) return;
    p.setAttribute('d', end === 'from'
      ? edgePath(movel[0], movel[1], fixo[0], fixo[1], ladoNovo || 'right', geo.s2)
      : edgePath(fixo[0], fixo[1], movel[0], movel[1], geo.s1, ladoNovo || 'left'));

      const to = end === 'to' ? alvo : ed.to;

      if (!duplicada && (ed[end] !== alvo || ladoNovo)) {

/** Laço de seleção: arrastar no fundo com Shift, ou com a ferramenta de seleção ativa. */

  };
  const up = e => {
    window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up);
    const b = toSvg(e);
    const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x), y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
    r.remove();
    if (!(ev.shiftKey && (x1 - x0) < 4)) clearSel();
    (F.nodes || []).forEach(n => {
      const p = POS[n.id];
      if (!p || !nodeVisible(n)) return;
      if (p[0] + NW > x0 && p[0] < x1 && p[1] + NH > y0 && p[1] < y1) sel.nodes.add(n.id);
    });
    render();
  };
  window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up);
}

/* === 60-panel.js === */
/* ---- painel de propriedades (lateral) ----
   Reúne num lugar só o que antes exigia caçar botão: rótulo, ícone, grupo, nota,
   e o estilo da conexão. */
const panel = h('aside', 'fpanel');
document.body.appendChild(panel);

/** A largura útil do palco muda quando o painel abre/fecha; sem reaplicar a câmera o
    viewBox fica com o tamanho antigo e o diagrama aparece esticado. */
function ajustarCamera() { setTimeout(() => applyCam(), 190); }

function campo(rotulo, ctrl) {
  const w = h('label', 'fld');
  w.appendChild(h('span', 'fl', rotulo));
  w.appendChild(ctrl);
  return w;
}
function editarNota(n) {
  const ta = h('textarea', 'fta');
  ta.value = n.note || '';
  ta.placeholder = 'Explicação que aparece no diagrama e no tooltip…';
  ta.addEventListener('change', () => {
    beginChange();
    const v = ta.value.trim();
    if (v) n.note = v; else delete n.note;
    render();
  });
  return ta;
}

/* Diz quantos itens a ação pegou: sem isso, aplicar a 12 nós e ver 1 mudar passa batido.
   Fica guardado porque quem aplica chama render() logo em seguida, e o painel é refeito. */
let loteAviso = null;
function avisarLote(quantos, oque, ids) {
  loteAviso = {
    chave: (ids || []).join(','),
    texto: quantos ? `${oque} aplicado a ${quantos} ${quantos > 1 ? 'itens' : 'item'}.`
                   : `Nenhum item mudou de ${oque}.`,
  };
}

function renderPanel() {
  const ids = selNodeIds();
  const estavaAberto = panel.classList.contains('open');
  if (!hasSel()) {
    panel.classList.remove('open'); panel.innerHTML = '';
    document.body.classList.remove('painel-aberto');
    if (estavaAberto) ajustarCamera();
    return;
  }
  panel.classList.add('open');
  document.body.classList.add('painel-aberto');     // em tela estreita, fecha a paleta
  if (!estavaAberto) ajustarCamera();
  panel.innerHTML = '';

  // ---- vários nós selecionados: ações em lote
  if (ids.length > 1) {
    panel.appendChild(h('div', 'ph', `<b>${ids.length} itens</b><span>selecionados</span>`));
    const gsel = h('select', 'fsel');
    gsel.innerHTML = '<option value="">— manter —</option><option value="__none">Sem grupo</option>'
      + (F.groups || []).map(g => `<option value="${g.id}">${g.label || g.id}</option>`).join('')
      + '<option value="__new">+ Novo grupo…</option>';
    gsel.addEventListener('change', () => {
      const v = gsel.value; if (!v) return;
      let gid = v;
      if (v === '__new') { const nome = prompt('Nome do grupo:'); if (!nome) { gsel.value = ''; return; } beginChange(); gid = ensureGroup(nome); }
      else beginChange();
      ids.forEach(id => { const n = nodeById(id); if (!n) return; if (gid === '__none') delete n.group; else n.group = gid; });
      render();
    });
    panel.appendChild(campo('Mover para o grupo', gsel));

    // Formato e ícone do lote: uma transação para todos, e "manter" não toca em nada.
    const fmt = h('select', 'fsel');
    fmt.innerHTML = '<option value="">— manter —</option>'
      + SHAPES.map(sh => `<option value="${sh.id}">${sh.label} — ${sh.hint}</option>`).join('');
    fmt.addEventListener('change', () => {
      if (!fmt.value) return;
      beginChange();
      const n = batchNodes(F, ids, { shape: fmt.value === 'rounded' ? null : fmt.value });
      fmt.value = '';
      avisarLote(n, 'formato', ids);
      render();
    });
    panel.appendChild(campo('Formato de todos', fmt));

    const icones = h('div', 'fico');
    Object.keys(ICN).sort().forEach(nome => {
      const b = h('button', '');
      b.title = 'Aplicar o ícone ' + nome + ' a todos';
      b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICN[nome]}</svg>`;
      b.onclick = () => { beginChange(); avisarLote(batchNodes(F, ids, { icon: nome }), 'ícone', ids); render(); };
      icones.appendChild(b);
    });
    panel.appendChild(campo('Ícone de todos', icones));

    // Conexões internas: as duas pontas estão na seleção, então mexer nelas não surpreende.
    const internas = edgesWithin(F, ids);
    if (internas.length) {
      const est = h('select', 'fsel');
      est.innerHTML = '<option value="">— manter —</option><option value="solid">Contínua</option><option value="dashed">Tracejada</option>';
      est.addEventListener('change', () => {
        if (!est.value) return;
        beginChange();
        const n = batchEdges(F, internas, { style: est.value === 'dashed' ? 'dashed' : null });
        est.value = ''; avisarLote(n, 'traço', ids); render();
      });
      panel.appendChild(campo(`Traço das ${internas.length} conexões internas`, est));
      const linha = h('div', 'frow');
      [['Animar', true], ['Parar', false]].forEach(([rot, valor]) => {
        const b = h('button', 'fbtn', rot);
        b.onclick = () => { beginChange(); avisarLote(batchEdges(F, internas, { animated: valor }), 'animação', ids); render(); };
        linha.appendChild(b);
      });
      panel.appendChild(campo('Fluxo dessas conexões', linha));
    }

    const bDup = h('button', 'fbtn', 'Duplicar (Ctrl+D)');
    bDup.onclick = () => duplicarSelecao();
    const bDel = h('button', 'fbtn danger', 'Excluir (Del)');
    bDel.onclick = () => excluirSelecao();
    const acoes = h('div', 'frow'); acoes.appendChild(bDup); acoes.appendChild(bDel);
    panel.appendChild(acoes);
    if (loteAviso && loteAviso.chave === ids.join(',')) panel.appendChild(h('p', 'fnote flote', loteAviso.texto));
    return;
  }

  // ---- uma conexão
  if (sel.edge !== null && F.edges[sel.edge]) {
    const ed = F.edges[sel.edge];
    const de = nodeById(ed.from), para = nodeById(ed.to);
    panel.appendChild(h('div', 'ph', `<b>Conexão</b><span>${(de && de.label) || ed.from} → ${(para && para.label) || ed.to}</span>`));
    const lab = h('input', 'finp'); lab.value = ed.label || ''; lab.placeholder = 'ex.: 443, async, cache miss';
    lab.addEventListener('change', () => { beginChange(); const v = lab.value.trim(); if (v) ed.label = v; else delete ed.label; render(); });
    panel.appendChild(campo('Rótulo', lab));
    const est = h('select', 'fsel');
    est.innerHTML = '<option value="solid">Contínua</option><option value="dashed">Tracejada</option>';
    est.value = ed.style === 'dashed' ? 'dashed' : 'solid';
    est.addEventListener('change', () => { beginChange(); if (est.value === 'dashed') ed.style = 'dashed'; else delete ed.style; render(); });
    panel.appendChild(campo('Traço', est));
    const anim = h('input'); anim.type = 'checkbox'; anim.checked = ed.animated !== false;
    anim.addEventListener('change', () => { beginChange(); ed.animated = anim.checked; render(); });
    const wrapA = h('label', 'fchk'); wrapA.appendChild(anim); wrapA.appendChild(h('span', null, 'Animar o fluxo nesta conexão'));
    panel.appendChild(wrapA);
    const bInv = h('button', 'fbtn', 'Inverter sentido');
    bInv.onclick = () => { beginChange(); const t = ed.from; ed.from = ed.to; ed.to = t; render(); };
    const bDel = h('button', 'fbtn danger', 'Excluir');
    bDel.onclick = () => excluirSelecao();
    const acoes = h('div', 'frow'); acoes.appendChild(bInv); acoes.appendChild(bDel);
    panel.appendChild(acoes);
    return;
  }

  // ---- um nó
  const n = nodeById(ids[0]); if (!n) return;
  panel.appendChild(h('div', 'ph', `<b>Nó</b><span>${n.id}</span>`));
  const lab = h('input', 'finp'); lab.value = n.label || '';
  lab.addEventListener('change', () => { beginChange(); n.label = lab.value.trim() || 'Nó'; render(); });
  panel.appendChild(campo('Rótulo', lab));

  const fsel = h('select', 'fsel');
  fsel.innerHTML = SHAPES.map(s => `<option value="${s.id}">${s.label} — ${s.hint}</option>`).join('');
  fsel.value = n.shape || 'rounded';
  fsel.addEventListener('change', () => {
    beginChange();
    if (fsel.value === 'rounded') delete n.shape; else n.shape = fsel.value;
    render();
  });
  panel.appendChild(campo('Formato', fsel));

  const grid = h('div', 'fico');
  Object.keys(ICN).sort().forEach(nome => {
    const b = h('button', n.icon === nome ? 'on' : '');
    b.title = nome;
    b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICN[nome]}</svg>`;
    b.onclick = () => { beginChange(); n.icon = nome; render(); };
    grid.appendChild(b);
  });
  if (isCentered(n.shape || 'rounded')) {
    const aviso = h('p', 'fnote', 'Esta forma usa o rótulo centralizado — o ícone não aparece nela.');
    panel.appendChild(campo('Ícone', aviso));
  } else {
    panel.appendChild(campo('Ícone', grid));
  }

  const gsel = h('select', 'fsel');
  gsel.innerHTML = '<option value="__none">Sem grupo</option>'
    + (F.groups || []).map(g => `<option value="${g.id}">${g.label || g.id}</option>`).join('')
    + '<option value="__new">+ Novo grupo…</option>';
  gsel.value = n.group || '__none';
  gsel.addEventListener('change', () => {
    const v = gsel.value;
    if (v === '__new') { const nome = prompt('Nome do grupo:'); if (!nome) { gsel.value = n.group || '__none'; return; } beginChange(); n.group = ensureGroup(nome); }
    else { beginChange(); if (v === '__none') delete n.group; else n.group = v; }
    render();
  });
  panel.appendChild(campo('Grupo', gsel));
  panel.appendChild(campo('Nota', editarNota(n)));

  const bDup = h('button', 'fbtn', 'Duplicar');
  bDup.onclick = () => duplicarSelecao();
  const bDel = h('button', 'fbtn danger', 'Excluir');
  bDel.onclick = () => excluirSelecao();
  const acoes = h('div', 'frow'); acoes.appendChild(bDup); acoes.appendChild(bDel);
  panel.appendChild(acoes);
}

/* === 61-panel-actions.js === */
/* ---- edição em lote ----
   Mudar o grupo de oito nós clicando oito vezes é o tipo de trabalho que faz a pessoa
   desistir de organizar o diagrama. Estas funções aplicam uma mudança a toda a seleção,
   e quem chama abre UMA transação: o desfazer volta o lote inteiro de uma vez. */

/** Aplica os campos de `patch` a cada nó. Valor `null` apaga o campo (é o "voltar ao padrão"
    do formato e do grupo). Devolve quantos nós mudaram de fato. */
function batchNodes(flow, ids, patch) {
  const alvo = new Set(ids || []);
  let mudados = 0;
  (flow.nodes || []).forEach(n => {
    if (!alvo.has(n.id)) return;
    let mudou = false;
    Object.entries(patch || {}).forEach(([campo, valor]) => {
      if (valor === null || valor === undefined) {
        if (campo in n) { delete n[campo]; mudou = true; }
      } else if (n[campo] !== valor) { n[campo] = valor; mudou = true; }
    });
    if (mudou) mudados += 1;
  });
  return mudados;
}

/** Índices das conexões cujas duas pontas estão na seleção — as que o lote pode mexer sem
    surpresa. Uma conexão com um pé fora da seleção fica de fora de propósito. */
function edgesWithin(flow, ids) {
  const dentro = new Set(ids || []);
  const indices = [];
  (flow.edges || []).forEach((e, i) => { if (dentro.has(e.from) && dentro.has(e.to)) indices.push(i); });
  return indices;
}

/** Mesma ideia de `batchNodes`, para conexões. */
function batchEdges(flow, indices, patch) {
  let mudados = 0;
  (indices || []).forEach(i => {
    const e = (flow.edges || [])[i];
    if (!e) return;
    let mudou = false;
    Object.entries(patch || {}).forEach(([campo, valor]) => {
      if (valor === null || valor === undefined) {
        if (campo in e) { delete e[campo]; mudou = true; }
      } else if (e[campo] !== valor) { e[campo] = valor; mudou = true; }
    });
    if (mudou) mudados += 1;
  });
  return mudados;
}

/** Remove nós e, junto, as conexões que dependiam deles — conexão órfã é documento inválido
    (o contrato recusa ponta inexistente), então os dois sempre saem na mesma transação. */
function removeNodesFrom(flow, ids) {
  const set = new Set(ids || []);
  const antes = (flow.nodes || []).length + (flow.edges || []).length;
  flow.nodes = (flow.nodes || []).filter(n => !set.has(n.id));
  flow.edges = (flow.edges || []).filter(e => !set.has(e.from) && !set.has(e.to));
  return antes - ((flow.nodes || []).length + (flow.edges || []).length);
}

if (typeof module === 'object' && module.exports) {
  module.exports = { batchNodes, edgesWithin, batchEdges, removeNodesFrom };
}

/* === 65-dock.js === */
/* ---- paleta fixa lateral: arraste o componente para dentro do diagrama ----
   O duplo-clique no vazio continua valendo, mas exige saber que existe. Uma paleta
   sempre visível mostra o que dá pra usar, e arrastar é o gesto que as pessoas já
   trazem de Miro/Whimsical. */
const dock = h('aside', 'fdock');
document.body.appendChild(dock);

let dockAberto = true;
const dockSections = Object.create(null);
function montarDock() {
  dock.innerHTML = '';
  const topo = h('div', 'dkh');
  topo.appendChild(h('span', null, 'Componentes'));
  const tog = h('button', 'dktog', dockAberto ? '‹' : '›');
  tog.title = dockAberto ? 'Recolher paleta' : 'Abrir paleta';
  tog.onclick = () => { dockAberto = !dockAberto; dock.classList.toggle('closed', !dockAberto); montarDock(); };
  topo.appendChild(tog);
  dock.appendChild(topo);
  if (!dockAberto) return;

  const busca = h('input', 'dksrch');
  busca.placeholder = 'Buscar…';
  dock.appendChild(busca);
  const corpo = h('div', 'dkbody');
  dock.appendChild(corpo);

  function desenhar(q) {
    corpo.innerHTML = '';
    q = (q || '').toLowerCase().trim();
    function secao(titulo, itens, montar, padraoAberta, classe) {
      if (!itens.length) return;
      const aberta = q ? true : (dockSections[titulo] ?? padraoAberta);
      const cab = h('button', 'dksection', `${aberta ? '▾' : '▸'} ${titulo}`);
      cab.type = 'button'; cab.setAttribute('aria-expanded', String(aberta));
      const grid = h('div', 'dkgrid' + (classe ? ' ' + classe : ''));
      grid.hidden = !aberta;
      itens.forEach(item => grid.appendChild(montar(item)));
      cab.onclick = ev => { ev.preventDefault(); ev.stopPropagation(); grid.hidden = !grid.hidden; dockSections[titulo] = !grid.hidden; cab.setAttribute('aria-expanded', String(!grid.hidden)); cab.textContent = `${grid.hidden ? '▸' : '▾'} ${titulo}`; };
      corpo.appendChild(cab); corpo.appendChild(grid);
    }

    // Formas e componentes usam a mesma navegação recolhível. A busca abre só as seções com resultado.
    const formas = SHAPES.filter(s => !q || s.label.toLowerCase().includes(q) || s.hint.includes(q));
    secao('Formas', formas, s => {
        const b = h('button', 'dkit dksh');
        b.title = s.hint + ' — arraste para o diagrama';
        b.innerHTML = `<svg class="shp" width="34" height="24" viewBox="0 0 40 28">${miniForma(s.id)}</svg><span>${s.label}</span>`;
        b.addEventListener('pointerdown', ev => arrastarDoDock(ev, { label: s.label, icon: 'box', shape: s.id }));
        return b;
      }, true, 'duas');
    CAT.forEach(grupo => {
      const itens = (grupo.items || []).filter(it => !q || it.label.toLowerCase().includes(q));
      secao(grupo.cat, itens, it => {
        const b = h('button', 'dkit');
        b.title = 'Arraste para o diagrama (ou clique)';
        b.innerHTML = `<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICN[it.icon] || ICN['box']}</svg><span>${it.label}</span>`;
        b.addEventListener('pointerdown', ev => arrastarDoDock(ev, it));
        return b;
      }, false);
    });
    if (!corpo.children.length) corpo.appendChild(h('p', 'dkempty', 'Nada encontrado.'));
  }
  desenhar('');
  busca.addEventListener('input', () => desenhar(busca.value));
}

/** Arrasta um item da paleta até o canvas. Solta fora do canvas = cancela. */
function arrastarDoDock(ev, item) {
  ev.preventDefault();
  const fantasma = h('div', 'dkghost');
  fantasma.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICN[item.icon] || ICN['box']}</svg><span>${item.label}</span>`;
  document.body.appendChild(fantasma);
  const mover = e => {
    fantasma.style.left = (e.clientX + 12) + 'px';
    fantasma.style.top = (e.clientY + 12) + 'px';
    const sobre = dentroDoCanvas(e);
    fantasma.classList.toggle('ok', sobre);
  };
  mover(ev);
  const soltar = e => {
    window.removeEventListener('pointermove', mover);
    window.removeEventListener('pointerup', soltar);
    fantasma.remove();
    if (!dentroDoCanvas(e)) return;                       // soltou fora: não cria nada
    const p = toSvg(e);
    beginChange();
    const id = addNode([p.x, p.y], item.label, item.icon, grupoSob(p));
    if (item.shape) nodeById(id).shape = item.shape;
    clearSel(); selectNode(id);
    render();
  };
  window.addEventListener('pointermove', mover);
  window.addEventListener('pointerup', soltar);
}
function dentroDoCanvas(e) {
  const r = stage.getBoundingClientRect();
  if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) return false;
  return !(dock.contains(e.target) || panel.contains(e.target));
}
/** Se soltou dentro da caixa de um grupo, o nó já nasce nele — é o que a pessoa espera
    ao arrastar para dentro de uma área nomeada. */
function grupoSob(p) {
  let achado = null;
  (F.groups || []).forEach(g => {
    if (COLLAPSED.has(g.id)) return;
    const b = groupBBox(g.id);
    if (b && p.x >= b[0] - 16 && p.x <= b[2] + 16 && p.y >= b[1] - 30 && p.y <= b[3] + 16) achado = g.id;
  });
  return achado;
}
/** Miniatura da forma para a paleta (mesma geometria do render, em caixa 40×28). */
function miniForma(id) {
  const g = shapeGeom(id, 38, 26);
  const at = Object.entries({ ...g.attrs, transform: 'translate(1,1)' })
    .map(([k, v]) => `${k}="${v}"`).join(' ');
  const ex = shapeExtras(id, 38, 26)
    .map(e => `<${e.tag} ${Object.entries(e.attrs).filter(([k]) => k !== 'class').map(([k, v]) => `${k}="${v}"`).join(' ')} transform="translate(1,1)"/>`).join('');
  return `<${g.tag} ${at}/>${ex}`;
}
montarDock();

/* === 70-palettes.js === */
/* ---- paletas e edição inline de rótulo ---- */
function fecharAoClicarFora(el) {
  setTimeout(() => document.addEventListener('pointerdown', function fn(e) {
    if (!el.contains(e.target)) { el.remove(); document.removeEventListener('pointerdown', fn); }
  }), 0);
}

/** Paleta do catálogo: escolhe um componente pronto (rótulo + ícone) ou nó em branco. */
function componentPalette(sx, sy, pt) {
  document.querySelectorAll('.cpal').forEach(e => e.remove());
  const pal = h('div', 'cpal');
  const busca = h('input', 'srch'); busca.placeholder = 'Buscar componente…';
  const corpo = h('div');
  pal.appendChild(busca); pal.appendChild(corpo);
  function desenhar(q) {
    corpo.innerHTML = ''; q = (q || '').toLowerCase().trim();
    CAT.forEach(grupo => {
      const itens = (grupo.items || []).filter(it => !q || it.label.toLowerCase().includes(q));
      if (!itens.length) return;
      corpo.appendChild(h('h4', null, grupo.cat));
      const grid = h('div', 'grid');
      itens.forEach(it => {
        const b = document.createElement('button');
        b.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${ICN[it.icon] || ICN['box']}</svg><span>${it.label}</span>`;
        b.onclick = () => { beginChange(); const id = addNode(pt, it.label, it.icon); selectNode(id); pal.remove(); render(); };
        grid.appendChild(b);
      });
      corpo.appendChild(grid);
    });
    const wrap = h('div', 'grid');
    const vazio = h('button', 'blank', '+ Nó em branco');
    vazio.onclick = () => { beginChange(); const id = addNode(pt, 'Novo', 'box'); selectNode(id); pal.remove(); render(); setTimeout(() => editLabel('n', id), 0); };
    wrap.appendChild(vazio); corpo.appendChild(wrap);
  }
  desenhar('');
  busca.addEventListener('input', () => desenhar(busca.value));
  busca.addEventListener('keydown', e => {
    if (e.key === 'Escape') pal.remove();
    if (e.key === 'Enter') { const p = corpo.querySelector('.grid button:not(.blank)'); if (p) p.click(); }
  });
  pal.style.left = Math.min(sx - 20, innerWidth - 330) + 'px';
  pal.style.top = Math.min(sy - 10, innerHeight - 80) + 'px';
  document.body.appendChild(pal); busca.focus();
  fecharAoClicarFora(pal);
}

/** Busca de nós — indispensável quando o diagrama passa de algumas dezenas de caixas. */
function abrirBusca() {
  document.querySelectorAll('.fsearch').forEach(e => e.remove());
  const box = h('div', 'fsearch');
  const inp = h('input'); inp.placeholder = 'Ir para o nó…';
  const lista = h('div', 'res');
  box.appendChild(inp); box.appendChild(lista);
  document.body.appendChild(box); inp.focus();
  let marcado = 0, atuais = [];
  function desenhar() {
    const q = inp.value.toLowerCase().trim();
    atuais = (F.nodes || []).filter(n => !q || (n.label || n.id).toLowerCase().includes(q)).slice(0, 12);
    lista.innerHTML = '';
    atuais.forEach((n, i) => {

function shortestDirectedPath(from, to) {
  if (!from || !to) return [];
  const next = {};
  (F.edges || []).forEach(e => { (next[e.from] ||= []).push(e.to); });
  Object.values(next).forEach(list => list.sort());
  const queue = [from], previous = { [from]: null };
  while (queue.length) {
    const id = queue.shift();
    if (id === to) break;
    (next[id] || []).forEach(child => { if (!(child in previous)) { previous[child] = id; queue.push(child); } });
  }
  if (!(to in previous)) return [];
  const path = []; for (let id = to; id !== null; id = previous[id]) path.unshift(id);
  return path;
}

/* ---- organização determinística da seleção e do fluxo ---- */
function selectedPoints(ids) {
  return ids.map(id => POS[id]).filter(Boolean);
}

function alignNodes(ids, axis, edge) {
  const points = selectedPoints(ids);
  if (points.length < 2) return false;
  const value = edge === 'min' ? Math.min(...points.map(p => p[axis])) : Math.max(...points.map(p => p[axis]));
  ids.forEach(id => { if (POS[id]) POS[id][axis] = value; });
  return true;
}

function distributeNodes(ids, axis) {
  const ordered = ids.filter(id => POS[id]).sort((a, b) => POS[a][axis] - POS[b][axis] || a.localeCompare(b));
  if (ordered.length < 3) return false;
  const first = POS[ordered[0]][axis], last = POS[ordered.at(-1)][axis];
  const gap = (last - first) / (ordered.length - 1);
  ordered.forEach((id, i) => { POS[id][axis] = first + gap * i; });
  return true;
}

function autoLayoutModel() {
  const nodes = F.nodes || [], edges = F.edges || [];
  const ids = nodes.map(n => n.id).sort();
  const indegree = Object.fromEntries(ids.map(id => [id, 0]));
  const next = Object.fromEntries(ids.map(id => [id, []]));
  edges.forEach(e => { if (next[e.from] && next[e.to]) { next[e.from].push(e.to); indegree[e.to] += 1; } });
  const layers = [], remaining = new Set(ids);
  while (remaining.size) {
    const layer = ids.filter(id => remaining.has(id) && indegree[id] === 0);
    const chosen = layer.length ? layer : [Array.from(remaining).sort()[0]];
    chosen.forEach(id => { remaining.delete(id); next[id].forEach(to => { indegree[to] -= 1; }); });
    layers.push(chosen);
  }
  layers.forEach((layer, x) => layer.forEach((id, y) => {
    POS[id] = [60 + x * (NW + 88), 60 + y * (NH + 34)];
  }));
  return layers;
}

/* === 77-connectors.js === */
/* ---- conectores legíveis: paralelas que não se escondem ----
   Duas conexões entre os mesmos dois nós (ida e volta, ou dois protocolos) saíam desenhadas
   uma EM CIMA da outra: o diagrama mentia, mostrando uma seta onde havia duas. Aqui cada
   par ganha um leque de deslocamentos, calculado só a partir da ordem no documento — o
   mesmo flow.json desenha sempre igual, e ida e volta continuam sendo duas setas. */
const EDGE_GAP = 15;

/** Chave do par, sem direção: ida e volta compartilham o mesmo leque. */
function pairKey(a, b) {
  return a < b ? a + '|' + b : b + '|' + a;
}

/** Deslocamento de cada aresta visível, em pixels, perpendicular ao traço.
    `resolve` traduz um id de nó no que ele representa na tela (o grupo, se recolhido). */
function parallelOffsets(edges, resolve, gap) {
  const passo = gap || EDGE_GAP;
  const id = resolve || (x => x);
  const baldes = new Map();
  const representante = new Map();             // linha desenhada -> índice que a representa
  const copia = new Map();                     // índice fundido -> índice do representante
  (edges || []).forEach((ed, i) => {
    const a = id(ed.from), b = id(ed.to);
    if (a === b) return;                       // some no grupo recolhido: não ocupa lugar no leque
    const direcao = a + '>' + b;
    if (representante.has(direcao)) { copia.set(i, representante.get(direcao)); return; }
    representante.set(direcao, i);             // a vaga no leque é por LINHA desenhada,
    const k = pairKey(a, b);                   // não por aresta do documento: as fundidas
    if (!baldes.has(k)) baldes.set(k, []);     // pelo grupo recolhido viram uma só.
    baldes.get(k).push(i);
  });
  const offsets = new Array((edges || []).length).fill(0);
  baldes.forEach(indices => {
    if (indices.length < 2) return;
    indices.forEach((idx, pos) => { offsets[idx] = (pos - (indices.length - 1) / 2) * passo; });
  });
  copia.forEach((rep, idx) => { offsets[idx] = offsets[rep]; });
  return offsets;
}

/** Quantas arestas do documento cada par visível representa. Com um grupo recolhido, várias
    viram uma só na tela — e o número é o que impede a leitura errada de "há uma conexão". */
function mergedCounts(edges, resolve) {
  const id = resolve || (x => x);
  const contagem = new Map();
  (edges || []).forEach(ed => {
    const a = id(ed.from), b = id(ed.to);
    if (a === b) return;
    const k = a + '>' + b;
    contagem.set(k, (contagem.get(k) || 0) + 1);
  });
  return contagem;
}

/** Move um ponto de ancoragem ao longo do lado de onde ele sai (o traço anda de lado,
    não para frente: o leque abre sem mudar de qual borda a seta parte). */
function shiftAnchor(point, side, offset) {
  if (!offset) return point;
  return (side === 'left' || side === 'right')
    ? [point[0], point[1] + offset]
    : [point[0] + offset, point[1]];
}

if (typeof module === 'object' && module.exports) {
  module.exports = { pairKey, parallelOffsets, mergedCounts, shiftAnchor, EDGE_GAP };
}

/* === 80-present.js === */
/* ---- modo apresentação: percorre o diagrama por estágios ----
   Em diagrama grande, mostrar tudo de uma vez é o mesmo que não mostrar nada.
   Aqui cada passo acende um trecho e escurece o resto, com a câmera acompanhando. */
let present = { on: false, passo: 0, etapas: [] };

/** Etapas em ordem topológica: cada uma é o conjunto de nós alcançados naquele "nível".
    Nós sem predecessor abrem; ciclos não travam (o que sobra entra como etapa final). */
function montarEtapas() {
  const nos = (F.nodes || []).filter(nodeVisible).map(n => n.id);
  const dentro = new Set(nos);
  const grau = {}; nos.forEach(id => grau[id] = 0);
  const saida = {}; nos.forEach(id => saida[id] = []);
  (F.edges || []).forEach(e => {
    if (!dentro.has(e.from) || !dentro.has(e.to) || e.from === e.to) return;
    grau[e.to]++; saida[e.from].push(e.to);
  });
  const etapas = [];
  let atual = nos.filter(id => grau[id] === 0);
  const visto = new Set(atual);
  while (atual.length) {
    etapas.push(atual);
    const prox = [];
    atual.forEach(id => saida[id].forEach(t => {
      if (--grau[t] === 0 && !visto.has(t)) { visto.add(t); prox.push(t); }
    }));
    atual = prox;
  }
  const restantes = nos.filter(id => !visto.has(id));
  if (restantes.length) etapas.push(restantes);
  return etapas.length ? etapas : [nos];
}

/** Nós acesos até o passo atual (acumulativo: o caminho já percorrido continua visível). */
function acesos() {
  const s = new Set();
  for (let i = 0; i <= present.passo && i < present.etapas.length; i++) present.etapas[i].forEach(id => s.add(id));
  return s;
}
const dimmedNode = id => present.on && !acesos().has(id);
const dimmed = (a, b) => {
  if (!present.on) return false;
  const on = acesos();
  const vale = k => String(k).startsWith('g:') ? nodesOfGroup(String(k).slice(2)).some(n => on.has(n.id)) : on.has(k);
  return !(vale(a) && vale(b));
};

function presentStart() {
  present.on = true; present.passo = 0; present.etapas = montarEtapas();
  clearSel();
  document.body.classList.add('presenting');
  render(); presentFocus();
  atualizarBarra();
}
function presentStop() {
  present.on = false;
  document.body.classList.remove('presenting');
  const b = document.querySelector('.pbar'); if (b) b.remove();
  render(); fitView(true);
}
function presentGo(delta) {
  const n = present.passo + delta;
  if (n < 0) return;
  if (n >= present.etapas.length) { presentStop(); return; }
  present.passo = n;
  render(); presentFocus(); atualizarBarra();
}
function presentFocus() {
  const etapa = present.etapas[present.passo] || [];
  const anterior = present.etapas[present.passo - 1] || [];
  focusNodes([...new Set([...etapa, ...anterior])], 1.15);
}
function atualizarBarra() {
  let bar = document.querySelector('.pbar');
  if (!bar) {
    bar = h('div', 'pbar');

  }
  const total = present.etapas.length;
  const nomes = (present.etapas[present.passo] || []).map(id => {
    const n = nodeById(id); return n ? (n.label || n.id) : id;
  });
  bar.innerHTML = `<button data-a="prev" title="Anterior (←)">‹</button>`
    + `<div class="pinfo"><b>Etapa ${present.passo + 1} de ${total}</b><span>${nomes.join(' · ')}</span></div>`
    + `<button data-a="next" title="Próxima (→)">›</button>`
    + `<button data-a="exit" class="x" title="Sair (Esc)">Sair</button>`;
  bar.querySelector('[data-a="prev"]').onclick = () => presentGo(-1);
  bar.querySelector('[data-a="next"]').onclick = () => presentGo(1);

  const response = await fetch('flow.json', { cache: 'no-store' });
  if (!response.ok) throw new Error('não foi possível ler o flow.json atual');
  const digest = await crypto.subtle.digest('SHA-256', await response.arrayBuffer());

  svg.setAttribute('width', b[2] - b[0]);
  svg.setAttribute('height', b[3] - b[1]);
  document.body.classList.add('export', 'paused');
}

/* O que acontece precisa CHEGAR a quem não vê a tela: alert some do histórico e o botão
   "Salvar" muda só de cor. Toda mensagem passa por aqui e vai para a região aria-live. */
function anunciar(texto) {
  const alvo = document.getElementById('anuncio');
  if (alvo) alvo.textContent = texto;
}

// ---- salvar
async function salvar(auto) {
  const payload = structuredClone(F);
  (payload.nodes || []).forEach(n => {
    if (auto) delete n.pos;
    else if (POS[n.id]) n.pos = [Math.round(POS[n.id][0]), Math.round(POS[n.id][1])];
  });
  try {
    const baseHash = await baseHashPromise;
    const r = await fetch('/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flow: payload, baseHash })
    });
    if (r.ok) { markSaved(); anunciar('Diagrama salvo no flow.json.'); location.reload(); }
    else {
      const erro = await r.json().catch(() => ({}));
      if (erro.code === 'conflict') {
        anunciar('Conflito: o flow.json mudou fora deste editor.');
        const recarregar = confirm('O flow.json mudou fora deste editor. Recarregar e descartar esta edição local?');
        if (recarregar) location.reload();
        else {
          const blob = new Blob([JSON.stringify(F, null, 2) + '\n'], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob); link.download = 'flow-conflict.json'; link.click();
          URL.revokeObjectURL(link.href);
          alert('Edição local mantida e baixada como flow-conflict.json.');
        }
      } else {
        const msg = 'Erro ao salvar: ' + (erro.message || 'operação recusada')
          + (erro.path ? ' (em ' + erro.path + ')' : '');
        anunciar(msg);
        alert(msg);
      }
    }
  } catch (err) {
    anunciar('Sem servidor de edição: o diagrama não foi salvo.');
    alert('Sem servidor de edição. Use serve_flow.py (não o http.server) para salvar.\n' + err);
  }
}
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

function atualizarBotoes() {
  const u = document.getElementById('undoBtn'), r = document.getElementById('redoBtn');
  if (u) u.disabled = !canUndo();
  if (r) r.disabled = !canRedo();
  // Alteração não salva dita por extenso, não só por cor: o botão diz o que ainda falta.
  const sv = document.getElementById('savePos');
  if (sv) {
    sv.textContent = dirty ? 'Salvar alterações' : 'Salvar';
    sv.setAttribute('aria-label', dirty ? 'Salvar no flow.json. Há alterações não salvas.'
                                        : 'Salvar no flow.json. Nada mudou desde o último salvamento.');
    sv.classList.toggle('sujo', !!dirty);
  }
}
function ligar(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }
ligar('savePos', () => salvar(false));
ligar('autoPos', () => salvar(true));
ligar('fitBtn', () => fitView(true));
ligar('undoBtn', () => { if (undo()) { clearSel(); render(); } });
ligar('redoBtn', () => { if (redo()) { clearSel(); render(); } });
ligar('presentBtn', presentStart);
ligar('searchBtn', abrirBusca);
ligar('zoomIn', () => zoomBy(1.2));
ligar('zoomOut', () => zoomBy(1 / 1.2));

render();

// ?present na URL já abre apresentando — serve pra deixar o link pronto antes da reunião,
// sem ter que achar o botão com a sala olhando.
if (QS.has('present') && !EXPORT) {
  const passo = parseInt(QS.get('present'), 10);
  presentStart();
  if (passo > 1) for (let i = 1; i < passo; i++) presentGo(1);
}

})();</script>
<script>
  function tg(){const h=document.documentElement;const d=h.dataset.theme==='dark';if(d)h.removeAttribute('data-theme');else h.dataset.theme='dark';try{localStorage.setItem('flow-theme',d?'light':'dark');}catch(e){}}
  const pb=document.getElementById('play');
  pb.onclick=()=>{document.body.classList.toggle('paused');pb.textContent=document.body.classList.contains('paused')?'▶ Tocar':'⏸ Pausar';};
  // tooltips de nota (delegação — sobrevive ao re-render do editor)
  const tip=document.getElementById('tip'), dg=document.getElementById('dg');
  dg.addEventListener('mousemove',e=>{const n=e.target.closest&&e.target.closest('.node[data-note]');
    if(n){tip.textContent=n.getAttribute('data-note');tip.style.opacity=1;tip.style.left=(e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}else tip.style.opacity=0;});
  dg.addEventListener('mouseleave',()=>tip.style.opacity=0);
  // export
  function exp(kind){
    const src=document.getElementById('dg');
    const svg=src.cloneNode(true);
    const vb=src.getAttribute('data-vb'); // exporta justo no conteúdo, não no canvas expandido
    if(vb){const p=vb.split(' ');svg.setAttribute('viewBox',vb);svg.setAttribute('width',p[2]);svg.setAttribute('height',p[3]);}
    svg.querySelectorAll('.port,.ehandle').forEach(e=>e.remove());
    const cs=getComputedStyle(document.body);
    svg.setAttribute('style','background:'+cs.backgroundColor);
    const xml=new XMLSerializer().serializeToString(svg);
    const blob=new Blob([xml],{type:'image/svg+xml'});
    if(kind==='svg'){dl(URL.createObjectURL(blob),'flow.svg');return;}
    const img=new Image();const url=URL.createObjectURL(blob);
    img.onload=()=>{const sc=2,c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
      const ctx=c.getContext('2d');ctx.scale(sc,sc);ctx.drawImage(img,0,0);URL.revokeObjectURL(url);
      c.toBlob(b=>dl(URL.createObjectURL(b),'flow.png'));};
    img.src=url;
  }
  function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click();}
  // live-reload
  let _lm=null;setInterval(async()=>{try{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});
    const lm=r.headers.get('Last-Modified');if(_lm&&lm&&lm!==_lm)location.reload();_lm=lm;}catch(e){}},1500);
</script>
