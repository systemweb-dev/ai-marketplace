<!DOCTYPE html>
<!--
  REFERÊNCIA VISUAL da "demo que ensina" (direção Estúdio), usada pela sw-frontend-component-kit.
  Não copie como está: PORTE para a stack do projeto (Vue, React, Svelte...), usando os TOKENS do
  projeto no lugar dos valores de exemplo abaixo e os componentes reais do kit no lugar de .kb/.kc.
  O que precisa sobreviver ao porte, em toda tela de componente (ver references/demo-que-ensina.md):
    lista lateral · cabeçalho · barra de controles DENTRO do conteúdo · palco de estúdio com a peça
    viva e a legenda do estado · Todos os tipos · Quando usar cada variante · Exemplos em contexto.
  Sem código na página: o código mora no docblock do componente.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demo do kit de componentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Tokens de EXEMPLO: no projeto, use os tokens reais (claro e escuro). */
  [data-theme="light"] {
    --bg-primary: #f3f5f7; --bg-card: #ffffff; --bg-soft: #eceff3;
    --text-primary: #14171c; --text-secondary: #5a6472;
    --border-color: #dde3ea; --border-strong: #c3ccd6; --grid-dot: #d5dbe3;
    --accent-primary: #2b50c8; --accent-strong: #213fa3; --accent-wash: #e8edfb; --accent-ink: #2442b0; --on-accent: #ffffff;
    --danger: #c2362b; --danger-strong: #a02a20; --danger-ink: #a8322a; --danger-wash: #fbeceb;
    --ring: rgb(43 80 200 / .3); --danger-ring: rgb(194 54 43 / .25);
    --code-bg: #14171c; --code-ink: #dfe5ee; --code-line: #2c323c;
    --bp-bg: #f2f6fd; --bp-line: #dfe7f5; --bp-edge: #cfdaee; --bp-ink: #2b50c8; --bp-pad: rgb(43 80 200 / .14);
    --vit-bg: #dfe6fb; --vit-ink: #1c2f78; --vit-line: #c3cff5; --vit-chip: #eef2fd;
    --font-sans: 'Geist', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg-primary: #0f1216; --bg-card: #171b21; --bg-soft: #1f252d;
    --text-primary: #e8ecf1; --text-secondary: #97a1ae;
    --border-color: #262d36; --border-strong: #37404c; --grid-dot: #262d36;
    --accent-primary: #6d8cf5; --accent-strong: #86a0f7; --accent-wash: #1b2340; --accent-ink: #9db2fa; --on-accent: #0b0e14;
    --danger: #e5645a; --danger-strong: #ee7d74; --danger-ink: #f08a80; --danger-wash: #2c1716;
    --ring: rgb(109 140 245 / .35); --danger-ring: rgb(229 100 90 / .3);
    --code-bg: #0a0c0f; --code-ink: #d7dde6; --code-line: #262d36;
    --bp-bg: #0f1726; --bp-line: #18243a; --bp-edge: #22314d; --bp-ink: #8ea8ff; --bp-pad: rgb(142 168 255 / .16);
    --vit-bg: #1a2446; --vit-ink: #c9d5ff; --vit-line: #2c3a68; --vit-chip: #202c55;
    --font-sans: 'Geist', system-ui, sans-serif;
  }


  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); }
  .pagina { container-type: inline-size; max-width: 1280px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  .tema { position: fixed; top: 1rem; right: 1rem; z-index: 5; font: 600 13px/1 var(--font-sans); padding: 0.55rem 0.8rem; border-radius: 8px;
           border: 1px solid var(--border-strong); background: var(--bg-card); color: var(--text-primary); cursor: pointer; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }


  /* ---- base comum às três direções: lista à esquerda, conteúdo com a barra de controles dentro ---- */
  .pg { display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 2.75rem; align-items: start;
        font-family: var(--pg-sans); color: var(--text-primary); font-size: 15px; line-height: 1.55; }
  .pg code, .pg pre { font-family: var(--pg-mono); }
  .pg ::selection { background: var(--ring); }
  .pg .rotulo { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .pg nav { position: sticky; top: 0; display: grid; gap: 0.1rem; }
  .pg nav .grupo { margin: 1.1rem 0 0.35rem 0.6rem; }
  .pg nav .grupo:first-child { margin-top: 0.2rem; }
  .pg nav button { text-align: left; font: 500 14px/1.2 var(--pg-sans); padding: 0.5rem 0.6rem; border: 0; border-radius: 8px;
                   background: none; color: var(--text-secondary); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 0.6rem; }
  .pg nav button:hover:not(:disabled) { color: var(--text-primary); background: var(--bg-soft); }
  .pg nav button.on { background: var(--nav-on-bg); color: var(--nav-on-ink); font-weight: 600; }
  .pg nav button.on small { color: inherit; opacity: 0.7; }
  .pg nav button:disabled { opacity: 0.45; cursor: default; }
  .pg nav button small { font: 500 11px/1 var(--pg-sans); color: var(--text-secondary); }
  .pg .cabeca h2 { font: 700 var(--pg-h, 36px)/1.08 var(--pg-display); letter-spacing: var(--pg-track, -0.02em); }
  .pg .cabeca p { margin-top: 0.55rem; max-width: 62ch; color: var(--text-secondary); font-size: 16px; }
  .pg .barra { display: flex; flex-wrap: wrap; gap: 0.9rem 1.6rem; align-items: end; margin: 1.6rem 0 1rem; }
  .pg .barra > div { display: grid; gap: 0.4rem; }
  .pg .barra input[type=text] { height: 34px; width: 12rem; padding: 0 0.65rem; font: 400 14px/1 var(--pg-sans);
                                border: 1px solid var(--border-strong); border-radius: 8px; background: var(--bg-card); color: var(--text-primary); }
  .pg .barra input[type=text]:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--ring); }
  .pg .seg { display: inline-flex; flex-wrap: wrap; padding: 3px; gap: 2px; border-radius: 9px; background: var(--bg-soft); }
  .pg .seg button { font: 600 13px/1 var(--pg-sans); padding: 0.5rem 0.7rem; border: 0; border-radius: 7px; background: transparent; color: var(--text-secondary); cursor: pointer; }
  .pg .seg button:hover { color: var(--text-primary); }
  .pg .seg button.on { background: var(--bg-card); color: var(--text-primary); box-shadow: 0 1px 2px rgb(20 23 28 / .14), 0 0 0 1px rgb(20 23 28 / .04); }
  .pg .palco { position: relative; min-height: 300px; display: grid; place-items: center; padding: 3rem 2rem; overflow: hidden; }
  .pg .palco .peca { position: relative; z-index: 1; }
  .pg .codigo { position: relative; margin: 0; padding: 1rem 5.5rem 1rem 1.1rem; overflow-x: auto; font-size: 13px; line-height: 1.6;
                background: var(--code-bg); color: var(--code-ink); }
  .pg .copiar { position: absolute; top: 0.6rem; right: 0.6rem; font: 600 12px/1 var(--pg-sans); padding: 0.45rem 0.65rem; border-radius: 7px;
                border: 1px solid var(--code-line); background: transparent; color: var(--code-ink); cursor: pointer; }
  .pg .copiar:hover { background: var(--code-line); }
  .pg .quando { margin-top: 2.4rem; }
  .pg .quando h3 { font: 700 19px/1.2 var(--pg-display); margin-bottom: 0.9rem; letter-spacing: -0.01em; }
  .pg .quando dl { display: grid; grid-template-columns: 170px minmax(0, 1fr); }
  .pg .quando dt, .pg .quando dd { padding: 1rem 0; border-top: 1px solid var(--border-color); }
  .pg .quando dt { display: grid; gap: 0.55rem; justify-items: start; align-content: start; font-weight: 600; }
  .pg .quando dd .nao { display: block; margin-top: 0.3rem; color: var(--text-secondary); }
  .pg .quando dd .nao b { color: var(--danger-ink); font-weight: 600; }

  /* ---- o componente demonstrado ---- */
  .kb { --h: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; height: var(--h); padding: 0 1rem;
        border-radius: calc(var(--k-raio, 8) * 1px); font: 600 14px/1 var(--pg-sans, system-ui); border: 1px solid transparent; cursor: pointer;
        transition: background-color .15s ease-out, box-shadow .15s ease-out; white-space: nowrap; }
  .kb[data-size="sm"] { --h: 30px; padding: 0 0.7rem; font-size: 13px; }
  .kb[data-size="lg"] { --h: 46px; padding: 0 1.35rem; font-size: 15px; }
  .kb.primaria { background: var(--accent-primary); color: var(--on-accent); }
  .kb.primaria:hover, .kb.primaria.is-hover { background: var(--accent-strong); }
  .kb.secundaria { background: var(--bg-card); border-color: var(--border-strong); color: var(--text-primary); }
  .kb.secundaria:hover, .kb.secundaria.is-hover { background: var(--bg-soft); }
  .kb.fantasma { background: transparent; color: var(--accent-ink); }
  .kb.fantasma:hover, .kb.fantasma.is-hover { background: var(--accent-wash); }
  .kb.perigo { background: var(--danger); color: var(--on-accent); }
  .kb.perigo:hover, .kb.perigo.is-hover { background: var(--danger-strong); }
  .kb:focus-visible, .kb.is-foco { outline: none; box-shadow: 0 0 0 3px var(--ring); }
  .kb:disabled { opacity: 0.45; cursor: not-allowed; }
  .kb .rodinha { width: 14px; height: 14px; border-radius: 99px; border: 2px solid currentColor; border-right-color: transparent; animation: girar .7s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }
  .kc { display: grid; gap: 0.35rem; width: min(100%, 340px); text-align: left; }
  .kc label { font-size: 13px; font-weight: 600; color: var(--text-primary); }
  .kc input { height: 40px; padding: 0 0.75rem; font: 400 14px/1 var(--pg-sans, system-ui); color: var(--text-primary); background: var(--bg-card);
              border: 1px solid var(--border-strong); border-radius: calc(var(--k-raio, 8) * 1px); caret-color: var(--accent-primary); }
  .kc input::placeholder { color: var(--text-secondary); }
  .kc input:focus, .kc.is-foco input { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 3px var(--ring); }
  .kc.is-erro input { border-color: var(--danger); }
  .kc input:disabled { background: var(--bg-soft); color: var(--text-secondary); cursor: not-allowed; }
  .kc .ajuda { font-size: 12.5px; color: var(--text-secondary); }
  .kc.is-erro .ajuda { color: var(--danger-ink); }

  /* ---- fundo do palco (knob em todas): claro, escuro ou pontilhado ---- */
  .variation[data-k-palco="claro"] .palco { background: var(--bg-card); }
  .variation[data-k-palco="pontilhado"] .palco { background: var(--bg-card) radial-gradient(var(--grid-dot) 1px, transparent 1px) 0 0 / 16px 16px; }
  .variation[data-k-palco="escuro"] .palco { background: #0f1217; }
  .variation[data-k-palco="escuro"] .palco .kc label { color: #e6eaf0; }
  .variation[data-k-palco="escuro"] .palco .kc .ajuda { color: #9aa4b1; }

  /* ---- Direção 1: Estúdio. O palco é um estúdio escuro com luz no centro; o código encosta nele ---- */
  .tema-estudio { --pg-sans: 'Geist', system-ui, sans-serif; --pg-display: 'Geist', system-ui, sans-serif; --pg-mono: 'Geist Mono', ui-monospace, monospace;
                  --pg-h: 40px; --pg-track: -0.035em; --nav-on-bg: var(--text-primary); --nav-on-ink: var(--bg-card); }
  .tema-estudio .palco { border-radius: 16px; min-height: 340px; border: 1px solid #1c2129;
                         background: radial-gradient(ellipse 60% 70% at 50% 45%, #262d38 0%, #12161c 62%, #0c0f13 100%); }
  .tema-estudio .palco .kc label { color: #e6eaf0; }
  .tema-estudio .palco .kc .ajuda { color: #9aa4b1; }
  .tema-estudio .palco-legenda { position: absolute; left: 1.1rem; bottom: 0.9rem; font: 500 12px/1 var(--pg-mono); color: #7f8a98; }
  .tema-estudio .codigo { border-radius: 0 0 16px 16px; border: 1px solid #1c2129; border-top: 1px solid #222833; }
  .tema-estudio .quando dt, .tema-estudio .quando dd { border-top-color: var(--border-color); }

  /* ---- todos os tipos: cada forma do componente à vista, sem depender dos controles ---- */
  .pg .todos { margin-top: 2.4rem; }
  .pg .todos > h3, .pg .exemplos > h3 { font: 700 19px/1.2 var(--pg-display); letter-spacing: -0.01em; }
  .pg .todos > p { color: var(--text-secondary); margin: 0.3rem 0 1rem; }
  .pg .todos .quadro { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; overflow-x: auto; }
  .pg .todos table { width: 100%; border-collapse: collapse; min-width: 720px; }
  .pg .todos th { font: 600 12px/1.2 var(--pg-sans); color: var(--text-secondary); text-align: left; padding: 0.85rem 1.1rem 0.6rem; }
  .pg .todos td { padding: 0.9rem 1.1rem; border-top: 1px solid var(--border-color); vertical-align: middle; }
  .pg .todos td:first-child { width: 180px; font-weight: 600; }
  .pg .todos td:last-child, .pg .todos th:last-child { padding-right: 1.4rem; }
  .pg .todos td:first-child small { display: block; font-weight: 400; font-size: 12.5px; color: var(--text-secondary); }
  .pg .todos .formas { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); gap: 1px; margin-top: 1rem;
                       background: var(--border-color); border: 1px solid var(--border-color); border-radius: 16px; overflow: hidden; }
  .pg .todos .forma { background: var(--bg-card); padding: 1.1rem; display: grid; gap: 0.75rem; align-content: start; }
  .pg .todos .forma h4 { font: 600 13.5px/1.2 var(--pg-sans); }
  .pg .todos .forma p { font-size: 12.5px; color: var(--text-secondary); }
  .pg .todos .forma .kc { width: 100%; }
  .kb svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .kb.so-icone { width: var(--h); padding: 0; }
  .kb.cheio { width: 100%; }
  .kc .caixa { position: relative; display: flex; align-items: center; }
  .kc .caixa input { width: 100%; }
  .kc .caixa .pre { position: absolute; left: 0.75rem; font-size: 14px; color: var(--text-secondary); pointer-events: none; }
  .kc .caixa .pre svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; display: block; }
  .kc .caixa.com-pre input { padding-left: 2.2rem; }
  .kc .caixa .depois { position: absolute; right: 0.35rem; height: 30px; padding: 0 0.55rem; border: 0; border-radius: 6px; background: none;
                       font: 600 12.5px/1 var(--pg-sans); color: var(--accent-ink); cursor: pointer; }
  .kc .caixa .depois:hover { background: var(--accent-wash); }
  .kc .rodape { display: flex; justify-content: space-between; gap: 0.5rem; }
  .kc .rodape .conta { font-size: 12.5px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

  /* ---- exemplos em contexto: o componente em uso de verdade, com o porquê e o código ---- */
  .pg .exemplos { margin-top: 2.6rem; }
  .pg .exemplos > h3 { font: 700 19px/1.2 var(--pg-display); letter-spacing: -0.01em; }
  .pg .exemplos > p { color: var(--text-secondary); margin: 0.3rem 0 1rem; }
  .pg .exemplos .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 1.1rem; }
  .pg .exemplo { display: grid; grid-template-rows: auto 1fr; border: 1px solid var(--border-color); border-radius: var(--ex-raio, 14px); overflow: hidden; background: var(--bg-card); }
  .pg .exemplo .ex-topo { padding: 0.9rem 1.1rem 0; }
  .pg .exemplo .ex-topo h4 { font: 650 15px/1.3 var(--pg-display); }
  .pg .exemplo .ex-topo p { font-size: 13.5px; color: var(--text-secondary); margin-top: 0.2rem; }
  .pg .exemplo .ex-vivo { padding: 1.4rem 1.1rem; display: grid; align-content: center; gap: 0.9rem; }
  .pg .exemplo .codigo { border-radius: 0; font-size: 12px; padding-top: 0.8rem; padding-bottom: 0.8rem; }
  .tema-vitrine { --ex-raio: 20px; }
  .tema-estudio .exemplo .ex-vivo { background: var(--bg-primary); margin: 0.9rem 1.1rem 1.1rem; border-radius: 10px; }
  .tema-anatomia .exemplo .ex-vivo { background: var(--bp-bg) linear-gradient(var(--bp-line) 1px, transparent 1px) 0 0 / 100% 24px; margin: 0.9rem 1.1rem 1.1rem; border-radius: 8px; border: 1px solid var(--bp-edge); }
  .ex-linha { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }
  .ex-linha.fim { justify-content: flex-end; }
  .ex-linha.entre { justify-content: space-between; }
  .ex-dialogo { max-width: 360px; justify-self: center; padding: 1.1rem 1.2rem; border-radius: 12px; background: var(--bg-card); border: 1px solid var(--border-color);
                box-shadow: 0 12px 28px -8px rgb(20 23 28 / .22), 0 2px 6px rgb(20 23 28 / .08); display: grid; gap: 0.5rem; }
  .ex-dialogo b { font-size: 15px; }
  .ex-dialogo p { font-size: 13.5px; color: var(--text-secondary); }
  .ex-dialogo .ex-linha { margin-top: 0.5rem; }
  .ex-tabela { display: grid; border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; background: var(--bg-card); }
  .ex-tabela > div { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0.5rem; align-items: center; padding: 0.55rem 0.8rem; font-size: 13.5px; }
  .ex-tabela > div + div { border-top: 1px solid var(--border-color); }
  .ex-tabela small { display: block; color: var(--text-secondary); font-size: 12.5px; }
  .ex-aviso { font-size: 13px; padding: 0.6rem 0.75rem; border-radius: 8px; background: var(--danger-wash); color: var(--danger-ink); }
  .ex-busca { display: flex; gap: 0.5rem; align-items: end; }
  .ex-busca .kc { flex: 1; }
  .ex-form { display: grid; gap: 0.9rem; }

  @container (max-width: 860px) {
    .pg .codigo { padding: 2.6rem 1.1rem 1rem; }
    .pg { grid-template-columns: minmax(0, 1fr); gap: 1.5rem; }
    .pg nav { position: static; grid-auto-flow: column; grid-auto-columns: max-content; overflow-x: auto; }
    .pg nav .grupo { display: none; }
    .pg .quando dl { grid-template-columns: minmax(0, 1fr); }
    .pg .quando dd { border-top: 0; padding-top: 0; }
    .tema-vitrine { --pg-h: 40px; }
    .tema-vitrine .palco .peca { transform: none; }
    .tema-vitrine .palco { padding-top: 1.5rem; display: flex; flex-direction: column; gap: 2rem; }
    .tema-vitrine .palco > .barra { position: static; }
  }



</style>
</head>
<body data-theme="light">
<button class="tema" type="button" onclick="document.body.dataset.theme = document.body.dataset.theme === 'dark' ? 'light' : 'dark'">Tema</button>
<main class="pagina">
  <div class="pg tema-estudio" data-pg data-legenda></div>
</main>
<script>
  const VARIANTES = [
    { id: 'primaria', nome: 'Primária', texto: 'Salvar alterações', resumo: 'A ação principal da tela',
      usar: 'Para a ação que conclui o que a pessoa veio fazer: salvar, enviar o pedido, confirmar o pagamento.',
      nao: 'duas na mesma área. Se tudo é principal, nada é: a segunda vira Secundária.' },
    { id: 'secundaria', nome: 'Secundária', texto: 'Cancelar', resumo: 'Apoio à principal',
      usar: 'Ao lado da Primária, para a alternativa segura: cancelar, voltar, salvar como rascunho.',
      nao: 'na ação que conclui a tarefa, mesmo que ela seja rara.' },
    { id: 'fantasma', nome: 'Fantasma', texto: 'Ver detalhes', resumo: 'Ação terciária, dentro de listas',
      usar: 'Em linhas de tabela, cabeçalhos de card e barras de ferramenta, onde vários botões convivem.',
      nao: 'sozinho num formulário: some no fundo e a pessoa não acha.' },
    { id: 'perigo', nome: 'Perigo', texto: 'Excluir pedido', resumo: 'Destrói ou não tem volta',
      usar: 'Para excluir, cancelar assinatura, revogar acesso. Sempre com confirmação que repete o nome do item.',
      nao: 'para chamar atenção. Vermelho que não destrói ensina a ignorar o vermelho.' },
  ];
  const ESTADOS_BOTAO = [['padrao', 'Padrão'], ['hover', 'Hover'], ['foco', 'Foco'], ['desabilitado', 'Desabilitado'], ['carregando', 'Carregando']];
  const ESTADOS_CAMPO = [
    ['padrao', 'Padrão', 'Aparece na nota fiscal. Pode ser o do financeiro.'],
    ['foco', 'Foco', 'Aparece na nota fiscal. Pode ser o do financeiro.'],
    ['erro', 'Erro', 'Falta o domínio depois do @. Ex.: financeiro@padariaestrela.com.br'],
    ['desabilitado', 'Desabilitado', 'Definido pelo administrador da conta.'],
  ];
  const TAMANHOS = [['sm', 'Pequeno'], ['md', 'Médio'], ['lg', 'Grande']];
  const CAMPO_QUANDO = [
    ['Rótulo', 'Sempre visível, acima do campo.', 'placeholder no lugar do rótulo: some quando a pessoa digita.'],
    ['Ajuda', 'Uma frase que evita o erro antes dele: formato, para que serve.', 'repetir o rótulo com outras palavras.'],
    ['Erro', 'Diz o problema e a saída, no lugar da ajuda. Validar ao sair do campo.', 'só "inválido", ou validar a cada tecla.'],
    ['Desabilitado', 'Quando o valor existe mas a pessoa não pode mudar. A ajuda diz por quê.', 'desabilitar sem explicar.'],
  ];

  const EXEMPLOS = {

      palco.querySelectorAll(':scope > .peca, :scope > .palco-legenda').forEach(n => n.remove());
      palco.appendChild(peca);
      if (pg.hasAttribute('data-legenda')) palco.appendChild(novo('span', 'palco-legenda', eBotao ? estado.variante + ' · ' + estado.tamanho + ' · ' + estado.estado : 'input · ' + estado.campo));
      codigo.replaceChildren();
      if (pg.hasAttribute('data-anatomia')) {
        requestAnimationFrame(() => desenharMedidas(palco, peca));
        const ficha = novo('div', 'ficha');
        requestAnimationFrame(() => {
          const el = peca.querySelector('.kb, .kc input'); if (!el) return;
          const cs = getComputedStyle(el);
          [['altura', Math.round(el.getBoundingClientRect().height) + 'px'], ['raio', cs.borderTopLeftRadius], ['fonte', cs.fontSize + ' / ' + cs.fontWeight],
           ['cor', eBotao ? '--' + (estado.variante === 'perigo' ? 'danger' : estado.variante === 'primaria' ? 'accent-primary' : 'bg-card') : '--bg-card']]
            .forEach(([k, v]) => { const i = novo('span'); i.append(k + ' ', novo('b', '', v)); ficha.appendChild(i); });
        });
        codigo.prepend(ficha);
      }
    }
    if (pg.hasAttribute('data-anatomia')) {
      new ResizeObserver(() => { const p = palco.querySelector('.peca'); if (p) desenharMedidas(palco, p); }).observe(palco);
      new MutationObserver(() => { const p = palco.querySelector('.peca'); if (p) requestAnimationFrame(() => desenharMedidas(palco, p)); })
        .observe(secao, { attributes: true, attributeFilter: ['style'] });
    }
    desenhar();
  });
</script>
</body>
</html>
