<!DOCTYPE html>
<!--
  mockup-preview harness — copy this file, then fill the marked regions.
  THROWAWAY: it doesn't need to follow the project's CSS conventions
  (kebab-case / inline styles are fine here). Only the code applied to the
  real component later follows the project rules.

  Regions to fill:
    1. <title>     — name of the screen/component being explored
    2. TOKENS      — paste the real design tokens into BOTH [data-theme] blocks
    3. FONT <link> — swap to the project's real font if not Inter
    4. .stage      — one <section class="variation"> per variation

  Built-in chrome (no need to touch it):
    • Top bar     — variation tabs · compare side by side · viewport (+ free width switch) ·
                    comment mode · theme · detector badge · side panel toggle
    • Side panel  — the active variation (title, trade-off, "Seguir com esta"), its knobs, its
                    direction (palette + fonts read from the rendered CSS, and title/body font
                    fields that take ANY Google Fonts family), the comments, and the detector
    • Knobs       — 0-4 live controls per variation, declared in data-knobs on the <section>
                    (range → --k-<id>, steps → data-k-<id>, toggle → both). See the example
                    above the first variation.
    • Compare     — every variation side by side; each column is its own CSS container,
                    so @container rules still work (📱 + compare = the mobile versions side by side)
    • Feedback    — with scripts/serve.py, comments on an element and the chosen variation are
                    saved to .mockup/comentarios.json and .mockup/escolha.json for the agent to read.
    • Keys        — ← → variation · C compare · 1-4 width · L free width · K comment · T theme · P panel

  Title font field overrides h1-h6 inside the variations; the body field overrides the rest.
  Mark display text that isn't a heading with data-titulo to have it follow the title font.

  Anti-slop detector: `python3 scripts/detectar.py index.html` scans only the DESIGN (markup
  inside .variation and CSS after `harness:fim`); this chrome never produces findings.

  Responsive: the canvas (.hz-frame) is a CSS container. Write responsive rules with
  @container (max-width: ...) so the viewport toggle triggers REAL breakpoints. Prefer
  intrinsic layouts (auto-fit/minmax, flex-wrap, clamp) so it reflows cleanly.

  URL state: every click rewrites the URL, so live-reload keeps the state and the URL can be
  shared. Params: ?vw=mobile|tablet|desktop|full|livre (&w=<px> with livre), ?theme=light|dark,
  ?v=<n> (1-based variation), ?font=<Google Font> (body), ?font-titulo=<Google Font>,
  ?k=<id>:<valor>,... (knobs of the ACTIVE variation), ?comparar=1, ?painel=0, ?limpo=1
  (hide all chrome, canvas only). Used for fast no-click screenshots.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- 1. COMPONENT NAME -->Mockup Preview</title>

<!-- 3. FONT — replace href + family if the project uses another font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">

<style>
  /* ============================================================
     2. TOKENS — paste the project's real values into BOTH blocks.
     They live on [data-theme] so the canvas can switch live.
     This is what makes the mockup faithful: same colors/spacing/radius
     as production.
     Os valores abaixo são de EXEMPLO (slate + azul + Inter): um placeholder
     para o canvas funcionar, nunca um design. Sem design system no projeto,
     cada variação declara a PRÓPRIA paleta e fonte (SKILL.md, passo 2).
     ============================================================ */
  [data-theme="light"] {
    --bg-primary: #f8fafc;
    --bg-secondary: #ffffff;
    --bg-card: #ffffff;
    --text-primary: #0f172a;
    --text-secondary: #64748b;
    --border-color: #e2e8f0;
    --accent-primary: #3b82f6;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --font-sans: 'Inter', system-ui, sans-serif;
  }
  [data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-card: #1e293b;
    --text-primary: #f8fafc;
    --text-secondary: #94a3b8;
    --border-color: #334155;
    --accent-primary: #3b82f6;
    --radius-md: 0.5rem;
    --radius-lg: 0.75rem;
    --font-sans: 'Inter', system-ui, sans-serif;
  }

  /* harness:inicio — casca do preview, não é design. O detector (scripts/detectar.py)
     ignora tudo até harness:fim; escreva o CSS do mockup DEPOIS dele. */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    --hz-bg: #eceff3; --hz-surface: #ffffff; --hz-line: #dde2e8; --hz-ink: #111827;
    --hz-soft: #5b6472; --hz-muted: #8a93a1; --hz-chip: #f1f3f6; --hz-hover: #e6e9ee;
    --hz-ok: #15803d; --hz-warn: #b45309; --hz-bad: #b91c1c; --hz-azul: #2563eb;
    font: 500 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--hz-ink);
    background: var(--hz-bg);
    display: grid; grid-template-rows: auto 1fr; height: 100vh; overflow: hidden;
  }
  .hz-ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor;
            stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- barra: uma linha, baixa ---- */
  .hz-toolbar {
    display: flex; align-items: center; gap: 0.5rem; height: 46px; padding: 0 0.6rem;
    background: var(--hz-surface); border-bottom: 1px solid var(--hz-line); min-width: 0;
  }
  .hz-group { display: flex; align-items: center; gap: 2px; }
  .hz-group--tabs { flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; gap: 4px; }
  .hz-group--tabs::-webkit-scrollbar { display: none; }
  .hz-seg { display: flex; gap: 2px; padding: 2px; background: var(--hz-chip); border-radius: 8px; }
  .hz-btn {
    height: 30px; min-width: 30px; padding: 0 0.55rem; border: 0; border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
    background: transparent; color: var(--hz-soft); font: inherit; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .hz-btn[hidden] { display: none; }
  .hz-btn:hover { background: var(--hz-hover); color: var(--hz-ink); }
  .hz-btn:focus-visible, .hz-campo:focus-visible, .hz-switch input:focus-visible + i { outline: 2px solid var(--hz-azul); outline-offset: 1px; }
  .hz-seg .hz-btn.is-active { background: var(--hz-surface); color: var(--hz-ink); box-shadow: 0 1px 2px rgb(17 24 39 / .14); }
  .hz-tab { max-width: 15rem; overflow: hidden; text-overflow: ellipsis; color: var(--hz-soft); }
  .hz-tab.is-active { background: var(--hz-ink); color: #fff; }
  .hz-btn.is-on { background: var(--hz-ink); color: #fff; }
  .hz-sep { width: 1px; height: 20px; background: var(--hz-line); margin: 0 0.2rem; flex: none; }
  .hz-selo { gap: 0.45rem; background: var(--hz-chip); }
  .hz-selo i { width: 8px; height: 8px; border-radius: 99px; background: var(--hz-muted); }
  .hz-selo[data-estado="limpo"] i { background: var(--hz-ok); }
  .hz-selo[data-estado="aviso"] i { background: var(--hz-warn); }
  .hz-selo[data-estado="falha"] i { background: var(--hz-bad); }

  .hz-switch { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--hz-soft); font-weight: 600; cursor: pointer; padding: 0 0.3rem; user-select: none; }
  .hz-switch input { position: absolute; opacity: 0; pointer-events: none; }
  .hz-switch i { width: 28px; height: 16px; border-radius: 99px; background: #cbd2db; position: relative; transition: background .15s; }
  .hz-switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 99px; background: #fff; transition: transform .15s; }
  .hz-switch input:checked + i { background: var(--hz-ink); }
  .hz-switch input:checked + i::after { transform: translateX(12px); }

  /* ---- área: canvas + painel ---- */
  .hz-main { display: grid; grid-template-columns: minmax(0, 1fr) 312px; min-height: 0; }
  body[data-painel="fechado"] .hz-main { grid-template-columns: minmax(0, 1fr); }
  body[data-painel="fechado"] .hz-panel { display: none; }

  .hz-stage-wrap { overflow: auto; padding: 1.25rem; display: flex; justify-content: center; align-items: flex-start; min-width: 0; }
  .hz-stage { width: 100%; position: relative; transition: max-width .2s ease; }
  .hz-stage[data-vw="mobile"]  { max-width: 390px; }
  .hz-stage[data-vw="tablet"]  { max-width: 768px; }
  .hz-stage[data-vw="desktop"] { max-width: 1280px; }
  .hz-stage[data-vw="full"]    { max-width: none; }
  .hz-stage[data-vw="livre"]   { max-width: none; flex: none; transition: none; }

  /* Largura total = o design sozinho, de borda a borda: sem margem, moldura nem cantos. */
  .hz-stage-wrap:has(> .hz-stage[data-vw="full"]:not([data-comparar])) { padding: 0; }
  .hz-stage[data-vw="full"]:not([data-comparar]) .hz-frame { border: 0; border-radius: 0; min-height: calc(100vh - 46px); }
  .hz-frame {
    background: var(--bg-primary); color: var(--text-primary);
    font-family: var(--font-sans);
    border: 1px solid #cfd6df; border-radius: 0.9rem; overflow: hidden;
    min-height: calc(100vh - 46px - 2.5rem); padding: 1.75rem;
    container-type: inline-size; container-name: stage;
  }

  .variation { display: none; }
  .variation.is-active { display: block; }

  /* Fontes escolhidas no painel: qualquer família do Google Fonts, só visualização. */
  .hz-frame[data-fonte-corpo] .variation,
  .hz-frame[data-fonte-corpo] .variation :not(h1, h2, h3, h4, h5, h6, [data-titulo], code, pre, kbd, samp, :is(h1, h2, h3, h4, h5, h6, [data-titulo]) *) { font-family: var(--hz-fonte-corpo) !important; }
  /* Só o corpo trocado: o título mantém a fonte que tinha (guardada pelo JS antes da troca),
     senão herdaria a do corpo do elemento em volta. */
  .hz-frame[data-fonte-corpo]:not([data-fonte-titulo]) .variation :is(h1, h2, h3, h4, h5, h6, [data-titulo]) { font-family: var(--hz-fonte-original) !important; }
  .hz-frame[data-fonte-titulo] .variation :is(h1, h2, h3, h4, h5, h6, [data-titulo]),
  .hz-frame[data-fonte-titulo] .variation :is(h1, h2, h3, h4, h5, h6, [data-titulo]) * { font-family: var(--hz-fonte-titulo) !important; }

  /* ---- comparar lado a lado: cada variação vira uma coluna e um container próprio ---- */
  .hz-stage[data-comparar] { max-width: none; width: 100%; }
  .hz-frame[data-comparar] {
    background: transparent; border: 0; padding: 0; overflow: visible; min-height: 0;
    display: grid; grid-auto-flow: column; gap: 1rem; align-items: start;
    grid-auto-columns: var(--hz-col, minmax(420px, 1fr));
  }
  .hz-stage[data-comparar][data-vw="mobile"] { --hz-col: 390px; }
  .hz-stage[data-comparar][data-vw="tablet"] { --hz-col: 768px; }
  .hz-frame[data-comparar] .variation {
    display: block; container-type: inline-size;
    background: var(--bg-primary); border: 1px solid #cfd6df; border-radius: 0.9rem;
    padding: 1.5rem; min-height: 60vh;
  }
  .hz-frame[data-comparar] .variation { cursor: pointer; transition: box-shadow .15s; }
  .hz-frame[data-comparar] .variation[data-foco] { box-shadow: 0 0 0 2px var(--hz-ink, #111827); cursor: auto; }
  .hz-frame[data-comparar] .variation::before {
    content: attr(data-title); display: block; margin: -0.25rem 0 1rem;
    font: 600 12px/1.3 system-ui, sans-serif !important; color: var(--text-secondary);
  }

  /* ---- largura livre: alça na borda direita, com a medida em px ---- */
  .hz-alca {
    position: absolute; top: 0; right: -14px; width: 14px; height: 100%; cursor: ew-resize;
    display: none; align-items: flex-start; justify-content: center; touch-action: none;
  }
  .hz-alca::before { content: ""; position: sticky; top: 45%; width: 4px; height: 44px; border-radius: 99px; background: #9aa3b0; margin-top: 40vh; }
  .hz-alca:hover::before, .hz-alca[data-arrastando]::before { background: var(--hz-ink); }
  .hz-stage[data-vw="livre"]:not([data-comparar]) .hz-alca { display: flex; }
  .hz-medida {
    position: absolute; top: -1.05rem; right: 0; font: 600 11px/1 ui-monospace, SFMono-Regular, monospace;
    color: var(--hz-soft); display: none;
  }
  .hz-stage[data-vw="livre"]:not([data-comparar]) .hz-medida { display: block; }
  .hz-stage[data-vw="livre"]:not([data-comparar]) { margin-top: 0.6rem; }

  /* ---- modo comentário: contorno no elemento sob o mouse, pinos numerados ---- */
  body[data-comentando] .hz-frame .variation, body[data-comentando] .hz-frame .variation * { cursor: crosshair !important; }
  .hz-alvo { outline: 2px dashed var(--hz-azul) !important; outline-offset: 2px !important; }
  .hz-destaque { outline: 3px solid #f59e0b !important; outline-offset: 3px !important; transition: outline-color .3s; }
  .hz-pinos { position: absolute; inset: 0; pointer-events: none; }
  .hz-pino {
    position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
    width: 22px; height: 22px; border-radius: 99px 99px 99px 2px; border: 2px solid #fff;
    background: var(--hz-azul); color: #fff; font: 700 11px/18px system-ui, sans-serif; text-align: center;
    box-shadow: 0 2px 6px rgb(17 24 39 / .3);
  }
  .hz-balao {
    position: fixed; z-index: 10; width: 280px; padding: 0.75rem; display: grid; gap: 0.5rem;
    background: var(--hz-surface); border: 1px solid var(--hz-line); border-radius: 10px;
    box-shadow: 0 12px 32px rgb(17 24 39 / .18); font: 500 13px/1.4 system-ui, sans-serif; color: var(--hz-ink);
  }
  .hz-balao[hidden] { display: none; }
  .hz-balao small { color: var(--hz-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hz-balao textarea { font: inherit; min-height: 76px; resize: vertical; padding: 0.5rem; border: 1px solid var(--hz-line); border-radius: 6px; }
  .hz-balao div { display: flex; justify-content: flex-end; gap: 0.4rem; }

  /* ---- painel lateral: topo fixo com a variação, abas embaixo, uma seção por vez ---- */
  .hz-panel {
    background: var(--hz-surface); border-left: 1px solid var(--hz-line); overflow: auto;
    display: flex; flex-direction: column; min-height: 0;
  }
  .hz-panel-topo { padding: 1rem 1rem 0.9rem; }
  .hz-caption { color: var(--hz-soft); line-height: 1.5; }
  .hz-caption b { display: block; color: var(--hz-ink); font-size: 14px; margin-bottom: 0.2rem; }
  .hz-dica { color: var(--hz-muted); margin-top: 0.4rem; }
  .hz-dica[hidden] { display: none; }
  .hz-escolha { margin-top: 0.8rem; }
  .hz-escolha:empty { display: none; }
  .hz-primario { background: var(--hz-ink); color: #fff; width: 100%; height: 34px; }
  .hz-primario:hover { background: #1f2937; color: #fff; }
  .hz-primario:disabled { opacity: .45; cursor: not-allowed; }
  .hz-escolha-estado { color: var(--hz-ok); font-weight: 600; margin-top: 0.5rem; }
  .hz-escolha-estado:empty { display: none; }

  .hz-abas {
    position: sticky; top: 0; z-index: 1; display: flex; gap: 0.1rem; padding: 0 0.6rem;
    background: var(--hz-surface); border-top: 1px solid var(--hz-line); border-bottom: 1px solid var(--hz-line);
  }
  .hz-aba {
    flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
    height: 38px; border: 0; background: none; font: inherit; font-weight: 600; color: var(--hz-muted);
    cursor: pointer; box-shadow: inset 0 -2px 0 transparent; white-space: nowrap;
  }
  .hz-aba:hover { color: var(--hz-ink); }
  .hz-aba[aria-selected="true"] { color: var(--hz-ink); box-shadow: inset 0 -2px 0 var(--hz-ink); }
  .hz-aba:focus-visible { outline: 2px solid var(--hz-azul); outline-offset: -2px; }
  .hz-conta { min-width: 17px; height: 17px; padding: 0 0.3rem; border-radius: 99px; background: var(--hz-chip);
              color: var(--hz-soft); font-size: 11px; line-height: 17px; text-align: center; }
  .hz-conta:empty { display: none; }
  .hz-ponto { width: 7px; height: 7px; border-radius: 99px; background: var(--hz-muted); }
  .hz-ponto[data-estado="limpo"] { background: var(--hz-ok); }
  .hz-ponto[data-estado="aviso"] { background: var(--hz-warn); }
  .hz-ponto[data-estado="falha"] { background: var(--hz-bad); }
  .hz-pane { padding: 1rem; display: grid; align-content: start; gap: 0.9rem; }
  .hz-pane[hidden] { display: none; }

  .hz-link { border: 0; background: none; font: inherit; font-weight: 600; color: var(--hz-soft); cursor: pointer; padding: 0; }
  .hz-link:hover { color: var(--hz-ink); text-decoration: underline; }
  .hz-link[hidden] { display: none; }
  .hz-restaurar { justify-self: end; }
  .hz-vazio { color: var(--hz-muted); }
  .hz-vazio[hidden] { display: none; }

  .hz-knobs { display: grid; gap: 0.9rem; }
  .hz-knobs[hidden] { display: none; }
  .hz-knob { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 0.35rem 0.5rem; color: var(--hz-soft); }
  .hz-knob > span:first-child { color: var(--hz-ink); font-weight: 600; }
  .hz-knob input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--hz-ink); }
  .hz-knob output { font-variant-numeric: tabular-nums; color: var(--hz-ink); grid-row: 1; grid-column: 2; }
  .hz-knob .hz-seg { grid-column: 1 / -1; }
  .hz-knob .hz-seg button { flex: 1; font: inherit; font-weight: 600; border: 0; background: transparent; padding: 0.35rem 0.5rem; border-radius: 6px; cursor: pointer; color: var(--hz-soft); }
  .hz-knob .hz-seg button.is-active { background: var(--hz-surface); color: var(--hz-ink); box-shadow: 0 1px 2px rgb(17 24 39 / .14); }
  .hz-knob input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--hz-ink); }
  .hz-knobs .hz-nota { color: var(--hz-warn); }

  .hz-direcao { display: grid; gap: 0.6rem; }
  .hz-paleta { display: flex; flex-wrap: wrap; gap: 0.35rem; }
  .hz-cor { display: grid; gap: 0.2rem; justify-items: center; font: 500 10px/1 ui-monospace, SFMono-Regular, monospace; color: var(--hz-soft); }
  .hz-cor i { width: 30px; height: 30px; border-radius: 6px; border: 1px solid rgb(17 24 39 / .12); }
  .hz-tipos { display: grid; gap: 0.2rem; color: var(--hz-soft); }
  .hz-tipos b { color: var(--hz-ink); font-weight: 600; }
  .hz-fontes { display: grid; grid-template-columns: auto 1fr; gap: 0.4rem 0.5rem; align-items: center; margin-top: 0.4rem; }
  .hz-fontes label { color: var(--hz-soft); font-weight: 600; }
  .hz-campo { height: 30px; font: inherit; padding: 0 0.5rem; border: 1px solid var(--hz-line); border-radius: 6px; background: var(--hz-surface); color: var(--hz-ink); min-width: 0; }
  .hz-fonte-estado { grid-column: 1 / -1; color: var(--hz-muted); min-height: 1em; }
  .hz-fonte-estado[data-erro] { color: var(--hz-bad); }

  .hz-lista { list-style: none; display: grid; gap: 0.6rem; }
  .hz-lista li { padding: 0.55rem 0.65rem; border-radius: 8px; background: var(--hz-chip); display: grid; gap: 0.2rem; }
  .hz-lista li[data-local] { cursor: pointer; }
  .hz-lista li[data-local]:hover { background: var(--hz-hover); }
  .hz-lista .hz-li-topo { font-weight: 700; color: var(--hz-ink); display: flex; justify-content: space-between; gap: 0.5rem; }
  .hz-lista .hz-li-topo small { font-weight: 600; }
  .hz-lista li[data-sev="falha"] .hz-li-topo small { color: var(--hz-bad); }
  .hz-lista li[data-sev="aviso"] .hz-li-topo small { color: var(--hz-warn); }
  .hz-lista code { font: 12px/1.4 ui-monospace, SFMono-Regular, monospace; color: var(--hz-soft); overflow-wrap: anywhere; }
  .hz-lista .hz-li-texto { color: var(--hz-soft); }
  .hz-resumo { color: var(--hz-soft); margin-bottom: 0.6rem; }

  body[data-limpo] .hz-toolbar, body[data-limpo] .hz-panel, body[data-limpo] .hz-pinos,
  body[data-limpo] .hz-alca, body[data-limpo] .hz-medida { display: none !important; }
  body[data-limpo] { grid-template-rows: 1fr; }
  body[data-limpo] .hz-main { grid-template-columns: minmax(0, 1fr); }
  body[data-limpo] .hz-stage-wrap { padding: 0; }
  body[data-limpo] .hz-frame { min-height: 100vh; }

  @media (max-width: 900px) {
    .hz-main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
    .hz-panel { border-left: 0; border-top: 1px solid var(--hz-line); max-height: 40vh; }
    .hz-label-longa { display: none; }
  }

  /* Accessibility: respect reduced motion for any animation you add. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* harness:fim */

  /* ============================================================
     Component styles go here, scoped under .mock so they don't leak.
     Use var(--bg-card) etc. for fidelity. For responsive behavior use
     @container (max-width: 480px) { ... } — the viewport toggle drives it.
     ============================================================ */

</style>

      <!-- KNOBS (opcional, 0 a 4 por variação): ajustes que o usuário mexe AO VIVO, sem
           gerar de novo. Declare em data-knobs e escreva o CSS da variação contra eles:
             range  → variável  --k-<id>        ex.: opacity: var(--k-acento, .5)
             steps  → atributo  data-k-<id>     ex.: .variation[data-k-densidade="compacta"] .x {...}
             toggle → --k-<id> (0|1) e o atributo data-k-<id> presente quando ligado
           data-knobs='[
             {"id":"acento","tipo":"range","min":0,"max":1,"passo":0.05,"padrao":0.5,"rotulo":"Acento"},
             {"id":"densidade","tipo":"steps","opcoes":["arejada","compacta"],"padrao":"arejada","rotulo":"Densidade"},
             {"id":"serifa","tipo":"toggle","padrao":false,"rotulo":"Título serifado"}]'
           Na URL: ?k=acento:0.8,densidade:compacta abre direto nesse estado. -->
      <section class="variation is-active"
               data-title="Variação 1: Nome da ideia"
               data-desc="Uma frase sobre a ideia desta variação e o trade-off.">
        <!-- <div class="mock"> ...component markup, using var(--bg-card) etc... </div> -->
      </section>

      <!-- Duplicate for more variations:
      <section class="variation" data-title="Variação 2: Nome da ideia" data-desc="...">
        ...
      </section>
      -->

      </div>

<div class="hz-balao" id="hz-balao" hidden role="dialog" aria-label="Novo comentário">

  <div><button class="hz-btn" id="hz-balao-cancelar" type="button">Cancelar</button>
       <button class="hz-btn is-on" id="hz-balao-salvar" type="button">Salvar</button></div>

<script>
  // ---- harness behavior: tabs · compare · width · theme · fonts · knobs · direction ·
  //      comments · choice · detector · panel · URL state · keys ----
  let pronto = false;   // salvarEstado() só grava depois de ler a URL inicial, senão a apagaria
  const $ = id => document.getElementById(id);
  const frame    = document.querySelector('.hz-frame');
  const stage    = document.querySelector('.hz-stage');
  const caption  = $('hz-caption');
  const tabsWrap = $('hz-tabs');
  const variations = Array.from(document.querySelectorAll('.variation'));
  const servido = location.protocol.startsWith('http');   // serve.py: detector, comentários, escolha

  function el(tag, classe, texto) {
    const n = document.createElement(tag);
    if (classe) n.className = classe;
    if (texto !== undefined) n.textContent = texto;
    return n;
  }

  async function api(caminho, dados) {
    const opcoes = dados === undefined ? { cache: 'no-store' }
      : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados) };
    const r = await fetch(caminho, opcoes);
    const corpo = await r.json();
    if (!r.ok) throw new Error(corpo.erro || ('HTTP ' + r.status));
    return corpo;
  }

  function showCaption(section) {
    caption.replaceChildren();
    const t = section.dataset.title || '';
    const d = section.dataset.desc || '';
    if (t) caption.appendChild(el('b', '', t));
    if (d) caption.appendChild(document.createTextNode(d));
  }

  // ---- knobs: 0 a 4 ajustes por variação, declarados em data-knobs (JSON) ----
  // Mexer num knob não gera nada de novo: ele só troca uma variável CSS ou um atributo na
  // própria <section>, e o CSS da variação responde. Rótulo é sempre TEXTO (textContent).
  const knobsWrap = $('hz-knobs');
  const knobsVazio = $('hz-knobs-vazio');
  const MAX_KNOBS = 4;
  const ID_VALIDO = /^[a-z0-9][a-z0-9-]*$/;
  const TIPOS = ['range', 'steps', 'toggle'];
  // `!!"false"` é verdadeiro em JavaScript: um toggle com padrão "false" abria LIGADO.
  const comoBool = v => v === true || ['1', 'true', 'on', 'sim'].includes(String(v).toLowerCase());
  const valores = new Map();            // <section> -> { id: valor } (sobrevive à troca de aba)

  function lerKnobs(section) {
    const cru = section.dataset.knobs;
    if (!cru) return { lista: [], notas: [] };
    let lista;
    try { lista = JSON.parse(cru); } catch (e) {
      return { lista: [], notas: ['data-knobs inválido nesta variação (JSON quebrado)'] };
    }
    if (!Array.isArray(lista)) return { lista: [], notas: ['data-knobs precisa ser uma lista'] };
    const notas = [];
    const vistos = new Set();
    const validos = lista.filter(k => {
      if (!k || !ID_VALIDO.test(String(k.id || ''))) {
        notas.push('knob com id inválido ignorado (use a-z, 0-9 e hífen)'); return false;
      }
      const tipo = k.tipo || 'range';
      if (!TIPOS.includes(tipo)) {
        notas.push('knob "' + k.id + '": tipo "' + tipo + '" não existe (range, steps ou toggle)'); return false;
      }
      if (tipo === 'steps' && !(Array.isArray(k.opcoes) && k.opcoes.length)) {
        notas.push('knob "' + k.id + '": steps sem opções'); return false;
      }
      if (vistos.has(k.id)) {
        notas.push('knob "' + k.id + '" repetido nesta variação: só o primeiro vale'); return false;
      }
      vistos.add(k.id);
      return true;
    });
    if (validos.length > MAX_KNOBS) notas.push('mais de ' + MAX_KNOBS + ' knobs: só os ' + MAX_KNOBS + ' primeiros aparecem');
    return { lista: validos.slice(0, MAX_KNOBS), notas };
  }

  // Todo valor passa por aqui antes de valer: faixa limitada ao min/max, opção dentro da lista,
  // toggle como booleano. Sem isso, `?k=acento:7` gravava 7 e o slider mostrava 1.
  function normalizar(k, bruto) {
    if (k.tipo === 'toggle') return comoBool(bruto);
    if (k.tipo === 'steps') return k.opcoes.includes(bruto) ? bruto : padraoDe(k);
    const min = k.min !== undefined ? Number(k.min) : 0;
    const max = k.max !== undefined ? Number(k.max) : 1;
    const n = Number(bruto);
    if (bruto === '' || bruto === null || Number.isNaN(n)) return padraoDe(k);
    return Math.min(max, Math.max(min, n));
  }

  function padraoDe(k) {
    if (k.tipo === 'toggle') return comoBool(k.padrao);
    if (k.tipo === 'steps') return k.opcoes.includes(k.padrao) ? k.padrao : k.opcoes[0];
    const min = k.min !== undefined ? Number(k.min) : 0;
    const max = k.max !== undefined ? Number(k.max) : 1;
    const n = Number(k.padrao);
    return Number.isNaN(n) || k.padrao === undefined ? min : Math.min(max, Math.max(min, n));
  }

  function aplicarKnob(section, k, bruto) {
    const valor = normalizar(k, bruto);
    const nome = 'k-' + k.id;
    if (k.tipo === 'steps') {
      section.setAttribute('data-' + nome, valor);
    } else if (k.tipo === 'toggle') {
      section.style.setProperty('--' + nome, valor ? '1' : '0');
      section.toggleAttribute('data-' + nome, !!valor);
    } else {
      section.style.setProperty('--' + nome, String(valor));
    }
    (valores.get(section) || valores.set(section, {}).get(section))[k.id] = valor;
    salvarEstado();
    depoisDeMudar();
  }

  function valorInicial(section, k) {
    const guardado = (valores.get(section) || {})[k.id];
    return guardado !== undefined ? guardado : padraoDe(k);
  }

  function controle(section, k) {
    const rotulo = el('label', 'hz-knob');
    rotulo.appendChild(el('span', '', k.rotulo || k.id));
    const atual = valorInicial(section, k);
    if (k.tipo === 'steps') {
      const seg = el('span', 'hz-seg');
      (k.opcoes || []).forEach(opcao => {
        const b = el('button', '', opcao);
        b.type = 'button';
        b.classList.toggle('is-active', opcao === atual);
        b.addEventListener('click', () => {
          seg.querySelectorAll('button').forEach(x => x.classList.toggle('is-active', x === b));
          aplicarKnob(section, k, opcao);
        });
        seg.appendChild(b);
      });
      rotulo.appendChild(seg);
    } else if (k.tipo === 'toggle') {
      const caixa = el('input');
      caixa.type = 'checkbox';
      caixa.checked = !!atual;
      caixa.addEventListener('change', () => aplicarKnob(section, k, caixa.checked));
      rotulo.appendChild(caixa);
    } else {
      const faixa = el('input');
      faixa.type = 'range';
      faixa.min = k.min !== undefined ? k.min : 0;
      faixa.max = k.max !== undefined ? k.max : 1;
      faixa.step = k.passo !== undefined ? k.passo : 0.05;
      faixa.value = atual;
      faixa.setAttribute('value', atual);
      const saida = el('output', '', atual);
      faixa.addEventListener('input', () => {
        saida.textContent = faixa.value;
        aplicarKnob(section, k, faixa.value);
      });
      rotulo.append(saida, faixa);
    }
    return rotulo;
  }

  // Desenha os knobs de uma ou de várias variações (no modo comparar, agrupados por título).
  function desenharKnobs(secoes) {
    knobsWrap.replaceChildren();
    let algum = false;
    secoes.forEach(section => {
      const { lista, notas } = lerKnobs(section);
      if (!lista.length && !notas.length) return;
      lista.forEach(k => knobsWrap.appendChild(controle(section, k)));
      notas.forEach(n => knobsWrap.appendChild(el('span', 'hz-nota', n)));
      algum = true;
    });
    knobsWrap.hidden = !algum;
    knobsVazio.hidden = algum;
    $('hz-knobs-restaurar').hidden = !algum;
    $('hz-conta-ajustes').textContent = secoes.reduce((n, sec) => n + lerKnobs(sec).lista.length, 0) || '';
  }

  // Todas as variações começam nos padrões: o CSS de cada uma tem valor desde o primeiro render.
  variations.forEach(section => lerKnobs(section).lista.forEach(k => aplicarKnob(section, k, valorInicial(section, k))));

  $('hz-knobs-restaurar').addEventListener('click', () => {
    const alvo = [variations[foco]].filter(Boolean);
    alvo.forEach(sec => lerKnobs(sec).lista.forEach(k => aplicarKnob(sec, k, padraoDe(k))));
    desenharKnobs(alvo);
  });

  // ---- abas e comparar ----
  // `ativa` é a aba (uma variação na tela); `foco` é a variação que o painel mostra. Fora do
  // comparar são a mesma; no comparar, clicar numa coluna muda só o foco.
  const compararBtn = $('hz-comparar');
  let ativa = 0, foco = 0;
  function comparando() { return frame.hasAttribute('data-comparar'); }

  function focar(i) {
    foco = i;
    variations.forEach((v, j) => v.toggleAttribute('data-foco', comparando() && i === j));
    if (variations[i]) { showCaption(variations[i]); desenharKnobs([variations[i]]); }
    $('hz-dica-comparar').hidden = !comparando();
    desenharEscolha();
    depoisDeMudar();
  }

  function setComparar(ligar) {
    frame.toggleAttribute('data-comparar', ligar);
    stage.toggleAttribute('data-comparar', ligar);
    compararBtn.classList.toggle('is-on', ligar);
    compararBtn.setAttribute('aria-pressed', String(ligar));
    if (ligar) {
      tabsWrap.querySelectorAll('.hz-tab').forEach(b => b.classList.remove('is-active'));
      focar(ativa);
    } else {
      activate(ativa);
    }
    salvarEstado();
  }

  function activate(i) {
    ativa = i;
    if (comparando()) { setComparar(false); return; }
    variations.forEach((v, j) => v.classList.toggle('is-active', i === j));
    tabsWrap.querySelectorAll('.hz-tab').forEach((b, j) => b.classList.toggle('is-active', i === j));
    focar(i);
    salvarEstado();
  }

  // No comparar, clicar numa coluna a põe em foco no painel (o clique segue para o mockup).
  frame.addEventListener('pointerdown', e => {
    if (!comparando() || document.body.hasAttribute('data-comentando')) return;
    const i = variations.indexOf(e.target.closest('.variation'));
    if (i >= 0 && i !== foco) focar(i);
  });

  // Tabs and compare only when there's more than one variation.
  if (variations.length > 1) {
    variations.forEach((v, i) => {
      const b = el('button', 'hz-btn hz-tab' + (i === 0 ? ' is-active' : ''), v.dataset.title || ('Variação ' + (i + 1)));
      b.addEventListener('click', () => activate(i));
      tabsWrap.appendChild(b);
    });
    compararBtn.addEventListener('click', () => setComparar(!comparando()));
  } else {
    compararBtn.hidden = true;
  }
  if (variations[0]) { showCaption(variations[0]); desenharKnobs([variations[0]]); }

  // ---- abas do painel: uma seção por vez; a última aberta fica lembrada neste navegador ----
  const ABAS = ['ajustes', 'direcao', 'comentarios', 'detector'];
  function abrirAba(nome) {
    if (!ABAS.includes(nome)) nome = 'ajustes';
    ABAS.forEach(a => {
      $('hz-aba-' + a).setAttribute('aria-selected', String(a === nome));
      $('hz-aba-' + a).tabIndex = a === nome ? 0 : -1;
      $('hz-pane-' + a).hidden = a !== nome;
    });
    try { localStorage.setItem('hz-aba', nome); } catch (e) {}
    depoisDeMudar();
  }
  ABAS.forEach((a, i) => {
    const b = $('hz-aba-' + a);
    b.addEventListener('click', () => abrirAba(a));
    b.addEventListener('keydown', e => {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault(); e.stopPropagation();
      const prox = ABAS[(i + (e.key === 'ArrowRight' ? 1 : -1) + ABAS.length) % ABAS.length];
      abrirAba(prox); $('hz-aba-' + prox).focus();
    });
  });

  // ---- largura: 4 fixas + livre (switch), que mostra uma alça na borda do canvas ----
  const livreSw = $('hz-livre');
  const medida = $('hz-medida');
  const LARGURAS = ['mobile', 'tablet', 'desktop', 'full'];
  let larguraLivre = 1024;

  function setVw(vw) {
    const btn = document.querySelector('.hz-btn[data-vw="' + vw + '"]');
    if (!btn) return;
    document.querySelectorAll('.hz-btn[data-vw]').forEach(x => x.classList.toggle('is-active', x === btn));
    stage.dataset.vw = vw;
    livreSw.checked = false;
    stage.style.removeProperty('width');
    stage.style.removeProperty('--hz-col');
    salvarEstado();
    depoisDeMudar();
  }
  document.querySelectorAll('.hz-btn[data-vw]').forEach(btn => btn.addEventListener('click', () => setVw(btn.dataset.vw)));

  function setLivre(px) {
    const wrap = stage.parentElement;
    const maximo = Math.max(320, wrap.clientWidth - 48);
    larguraLivre = Math.round(Math.min(maximo, Math.max(280, px)));
    stage.dataset.vw = 'livre';
    livreSw.checked = true;
    document.querySelectorAll('.hz-btn[data-vw]').forEach(x => x.classList.remove('is-active'));
    stage.style.width = larguraLivre + 'px';
    stage.style.setProperty('--hz-col', larguraLivre + 'px');
    medida.textContent = larguraLivre + 'px';
    salvarEstado();
    depoisDeMudar();
  }
  livreSw.addEventListener('change', () => {
    if (livreSw.checked) setLivre(stage.getBoundingClientRect().width || larguraLivre);
    else setVw('desktop');
  });

  // A alça segue o ponteiro: o canvas é centralizado, então cada px arrastado vale dois de largura.
  const alca = $('hz-alca');
  alca.addEventListener('pointerdown', e => {
    e.preventDefault();
    alca.setPointerCapture(e.pointerId);
    alca.dataset.arrastando = '';
    const x0 = e.clientX, w0 = stage.getBoundingClientRect().width;
    const mover = ev => setLivre(w0 + (ev.clientX - x0) * 2);
    const soltar = () => { delete alca.dataset.arrastando; alca.removeEventListener('pointermove', mover); };
    alca.addEventListener('pointermove', mover);
    alca.addEventListener('pointerup', soltar, { once: true });
    alca.addEventListener('pointercancel', soltar, { once: true });
  });

  // ---- tema ----
  const themeBtn = $('hz-theme');
  function setTheme(t) {
    frame.dataset.theme = t;
    themeBtn.querySelector('use').setAttribute('href', t === 'dark' ? '#hz-i-lua' : '#hz-i-sol');
    themeBtn.title = t === 'dark' ? 'Tema escuro (clique para claro) · T' : 'Tema claro (clique para escuro) · T';
    salvarEstado();
    depoisDeMudar();
  }
  themeBtn.addEventListener('click', () => setTheme(frame.dataset.theme === 'dark' ? 'light' : 'dark'));

  // ---- fontes: QUALQUER família do Google Fonts, carregada na hora (título e corpo) ----
  // Pede os pesos 400-800; família que não tem todos devolve erro, então tenta só o nome.
  const SUGESTOES = ['Inter', 'DM Sans', 'Manrope', 'Plus Jakarta Sans', 'Figtree', 'Outfit', 'Sora',
    'Space Grotesk', 'Bricolage Grotesque', 'IBM Plex Sans', 'Work Sans', 'Fraunces', 'Newsreader',
    'Instrument Serif', 'Lora', 'Playfair Display', 'DM Serif Display', 'JetBrains Mono',
    'IBM Plex Mono', 'system-ui'];
  SUGESTOES.forEach(nome => { const o = el('option'); o.value = nome; $('hz-fontes-sugestoes').appendChild(o); });
  const NOME_FONTE = /^[A-Za-z0-9][A-Za-z0-9 -]{0,59}$/;   // aspas e ; nunca entram no CSS
  const fontesCarregadas = new Map();   // nome -> Promise
  const fonteEstado = $('hz-fonte-estado');

  function linkGoogle(familia) {
    return new Promise((ok, falha) => {
      const l = el('link');
      l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + familia + '&display=swap';
      l.onload = () => ok();
      l.onerror = () => { l.remove(); falha(); };
      document.head.appendChild(l);
    });
  }
  function carregarFonte(nome) {
    if (nome === 'system-ui') return Promise.resolve();
    if (!fontesCarregadas.has(nome)) {
      const familia = nome.trim().replace(/ +/g, '+');
      fontesCarregadas.set(nome, linkGoogle(familia + ':wght@400;500;600;700;800')
        .catch(() => linkGoogle(familia))
        .catch(() => { fontesCarregadas.delete(nome); throw new Error('não encontrada'); }));
    }
    return fontesCarregadas.get(nome);
  }
  function pilha(nome) {
    return nome === 'system-ui' ? "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
                                : "'" + nome + "', system-ui, sans-serif";
  }
  const fonteAtual = { titulo: '', corpo: '' };
  function guardarFonteDosTitulos() {
    const antes = ['corpo', 'titulo'].map(p => [p, frame.getAttribute('data-fonte-' + p)]);
    antes.forEach(([p]) => frame.removeAttribute('data-fonte-' + p));
    frame.querySelectorAll('.variation :is(h1, h2, h3, h4, h5, h6, [data-titulo])')
      .forEach(h => h.style.setProperty('--hz-fonte-original', getComputedStyle(h).fontFamily));
    antes.forEach(([p, v]) => { if (v !== null) frame.setAttribute('data-fonte-' + p, v); });
  }
  async function aplicarFonte(papel, bruto) {
    const nome = (bruto || '').trim().replace(/\s+/g, ' ');
    const campo = $('hz-fonte-' + papel);
    campo.value = nome;
    delete fonteEstado.dataset.erro;
    if (!nome) {
      fonteAtual[papel] = '';
      frame.removeAttribute('data-fonte-' + papel);
      fonteEstado.textContent = 'Qualquer família do Google Fonts. Vazio volta à do projeto.';
      salvarEstado(); depoisDeMudar();
      return;
    }
    if (!NOME_FONTE.test(nome)) {
      fonteEstado.dataset.erro = ''; fonteEstado.textContent = 'Nome de fonte inválido: use letras, números, espaço e hífen.';
      return;
    }
    fonteEstado.textContent = 'Carregando ' + nome + '…';
    try {
      await carregarFonte(nome);
    } catch (e) {
      fonteEstado.dataset.erro = '';
      fonteEstado.textContent = '"' + nome + '" não existe no Google Fonts (confira a grafia).';
      return;
    }
    fonteAtual[papel] = nome;
    guardarFonteDosTitulos();
    frame.style.setProperty('--hz-fonte-' + papel, pilha(nome));
    frame.setAttribute('data-fonte-' + papel, nome);
    fonteEstado.textContent = 'Visualizando ' + [fonteAtual.titulo && 'título em ' + fonteAtual.titulo,
      fonteAtual.corpo && 'corpo em ' + fonteAtual.corpo].filter(Boolean).join(' e ') + '.';
    salvarEstado();
    if (document.fonts) document.fonts.ready.then(depoisDeMudar); else depoisDeMudar();
  }
  ['titulo', 'corpo'].forEach(papel => $('hz-fonte-' + papel)
    .addEventListener('change', e => aplicarFonte(papel, e.target.value)));

  // ---- direção: paleta e tipografia lidas do CSS já renderizado de cada variação ----
  function hex(cor) {
    const m = cor.match(/rgba?\(([\d.]+)[, ]+([\d.]+)[, ]+([\d.]+)(?:[,/ ]+([\d.]+%?))?\)/);
    if (!m) return null;
    const a = m[4] === undefined ? 1 : (m[4].endsWith('%') ? parseFloat(m[4]) / 100 : Number(m[4]));
    if (a < 0.35) return null;   // transparente ou véu: não é cor da paleta
    return '#' + [m[1], m[2], m[3]].map(n => Math.round(Number(n)).toString(16).padStart(2, '0')).join('');
  }
  function lerDirecao(section) {
    const cores = new Map(), titulo = new Map(), corpo = new Map();
    const conta = (mapa, chave, peso) => chave && mapa.set(chave, (mapa.get(chave) || 0) + peso);
    [section, ...section.querySelectorAll('*')].forEach(n => {
      const s = getComputedStyle(n);
      const temTexto = Array.from(n.childNodes).some(c => c.nodeType === 3 && c.textContent.trim());
      if (temTexto) conta(cores, hex(s.color), 2);
      conta(cores, hex(s.backgroundColor), 3);
      if (parseFloat(s.borderTopWidth) > 0 && s.borderTopStyle !== 'none') conta(cores, hex(s.borderTopColor), 1);
      if (temTexto) {
        const familia = s.fontFamily.split(',')[0].replace(/["']/g, '').trim();
        conta(n.matches('h1, h2, h3, h4, h5, h6, [data-titulo]') ? titulo : corpo,
              familia + ' ' + s.fontWeight, 1);
      }
    });
    // Sem fundo próprio (uma variação só), o fundo que se vê é o do canvas.
    if (!hex(getComputedStyle(section).backgroundColor)) conta(cores, hex(getComputedStyle(frame).backgroundColor), 4);
    const top = (mapa, n) => [...mapa.entries()].sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]);
    return { cores: top(cores, 8), titulo: top(titulo, 2), corpo: top(corpo, 2) };
  }
  function desenharDirecao() {
    const wrap = $('hz-direcao');
    wrap.replaceChildren();
    [variations[foco]].filter(Boolean).forEach(section => {
      const d = lerDirecao(section);
      const paleta = el('div', 'hz-paleta');
      d.cores.forEach(c => {
        const item = el('span', 'hz-cor');
        const amostra = el('i'); amostra.style.background = c;
        item.title = c; item.append(amostra, el('span', '', c.slice(1)));
        paleta.appendChild(item);
      });
      const tipos = el('div', 'hz-tipos');
      if (d.titulo.length) { const t = el('span'); t.append(el('b', '', 'Título '), d.titulo.join(' · ')); tipos.appendChild(t); }
      if (d.corpo.length) { const t = el('span'); t.append(el('b', '', 'Corpo '), d.corpo.join(' · ')); tipos.appendChild(t); }
      if (!d.cores.length && !d.titulo.length && !d.corpo.length) tipos.appendChild(el('span', 'hz-vazio', 'Variação vazia.'));
      wrap.append(paleta, tipos);
    });
  }

  // ---- escolha: "Seguir com esta" grava .mockup/escolha.json para o agente ler ----
  const escolhaWrap = $('hz-escolha');
  const escolhaEstado = $('hz-escolha-estado');
  function desenharEscolha() {
    escolhaWrap.replaceChildren();
    if (!variations.length) return;
    [foco].forEach(i => {
      const b = el('button', 'hz-btn hz-primario', 'Seguir com esta');
      b.type = 'button';
      if (!servido) { b.disabled = true; b.title = 'Precisa do scripts/serve.py: diga a escolha no chat.'; }
      b.addEventListener('click', () => escolher(i));
      escolhaWrap.appendChild(b);
    });
  }
  async function escolher(i) {
    const sec = variations[i];
    try {
      const r = await api('/__escolha', {
        variacao: i + 1, titulo: sec.dataset.title || 'Variação ' + (i + 1),
        knobs: Object.assign({}, valores.get(sec) || {}), vw: stage.dataset.vw,
        theme: frame.dataset.theme, fonte_titulo: fonteAtual.titulo || null, fonte_corpo: fonteAtual.corpo || null });
      escolhaEstado.textContent = 'Escolhida: ' + r.titulo + '. Volte ao chat e diga "escolhi".';
    } catch (e) {
      escolhaEstado.textContent = 'Não gravou (' + e.message + '). Diga a escolha no chat.';
    }
  }
  if (servido) api('/__escolha').then(r => { if (r) escolhaEstado.textContent = 'Escolhida: ' + r.titulo + '.'; }).catch(() => {});

  // ---- comentários: clique num elemento, escreva o ajuste; o agente lê .mockup/comentarios.json ----
  const comentarBtn = $('hz-comentar');
  const balao = $('hz-balao');
  const balaoTexto = $('hz-balao-texto');
  const pinos = $('hz-pinos');
  let comentarios = [];
  let alvoAtual = null, alvoBalao = null;

  if (!servido) { comentarBtn.disabled = true; comentarBtn.title = 'Comentar precisa do scripts/serve.py'; }

  function setComentando(ligar) {
    if (!servido) return;
    document.body.toggleAttribute('data-comentando', ligar);
    comentarBtn.classList.toggle('is-on', ligar);
    comentarBtn.setAttribute('aria-pressed', String(ligar));
    if (ligar) abrirAba('comentarios');
    else { marcarAlvo(null); fecharBalao(); }
  }
  comentarBtn.addEventListener('click', () => setComentando(!document.body.hasAttribute('data-comentando')));

  function marcarAlvo(n) {
    if (alvoAtual) alvoAtual.classList.remove('hz-alvo');
    alvoAtual = n;
    if (n) n.classList.add('hz-alvo');
  }
  // Caminho estável do elemento dentro da variação: tag, até 2 classes e a posição entre irmãos.
  function seletorDe(n, section) {
    const partes = [];
    for (let atual = n; atual && atual !== section; atual = atual.parentElement) {
      const classes = Array.from(atual.classList).filter(c => !c.startsWith('hz-')).slice(0, 2);
      let parte = atual.tagName.toLowerCase() + classes.map(c => '.' + CSS.escape(c)).join('');
      const irmaos = Array.from(atual.parentElement.children).filter(x => x.tagName === atual.tagName);
      if (irmaos.length > 1) parte += ':nth-of-type(' + (irmaos.indexOf(atual) + 1) + ')';
      partes.unshift(parte);
    }
    return partes.join(' > ');
  }
  function acharPorSeletor(section, seletor) {
    if (!seletor) return section;
    try { return section.querySelector(':scope > ' + seletor); } catch (e) { return null; }
  }

  frame.addEventListener('mouseover', e => {
    if (!document.body.hasAttribute('data-comentando') || !balao.hidden) return;
    const n = e.target.closest('.variation') ? e.target : null;
    marcarAlvo(n);
  });
  frame.addEventListener('click', e => {
    if (!document.body.hasAttribute('data-comentando')) return;
    const section = e.target.closest('.variation');
    if (!section) return;
    e.preventDefault(); e.stopPropagation();
    marcarAlvo(e.target);
    alvoBalao = e.target;
    const trecho = (e.target.textContent || '').trim().replace(/\s+/g, ' ');
    $('hz-balao-alvo').textContent = (section.dataset.title || 'Variação') + (trecho ? ' · "' + trecho.slice(0, 60) + '"' : '');
    balao.hidden = false;
    const r = balao.getBoundingClientRect();
    balao.style.left = Math.min(e.clientX + 12, innerWidth - r.width - 12) + 'px';
    balao.style.top = Math.min(e.clientY + 12, innerHeight - r.height - 12) + 'px';
    balaoTexto.value = '';
    balaoTexto.focus();
  }, true);

  function fecharBalao() { balao.hidden = true; alvoBalao = null; }
  $('hz-balao-cancelar').addEventListener('click', () => { fecharBalao(); marcarAlvo(null); });
  async function salvarComentario() {
    const texto = balaoTexto.value.trim();
    if (!texto || !alvoBalao) return;
    const section = alvoBalao.closest('.variation');
    const i = variations.indexOf(section);
    try {
      await api('/__comentarios', {
        variacao: i + 1, titulo: section.dataset.title || 'Variação ' + (i + 1),
        seletor: seletorDe(alvoBalao, section),
        trecho: (alvoBalao.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 200),
        texto, vw: stage.dataset.vw, theme: frame.dataset.theme });
      fecharBalao(); marcarAlvo(null);
      carregarComentarios();
    } catch (e) {
      $('hz-balao-alvo').textContent = 'Não gravou: ' + e.message;
    }
  }
  $('hz-balao-salvar').addEventListener('click', salvarComentario);
  balaoTexto.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) salvarComentario();
    if (e.key === 'Escape') { fecharBalao(); marcarAlvo(null); }
  });

  async function carregarComentarios() {
    if (!servido) return;
    try { comentarios = await api('/__comentarios'); } catch (e) { comentarios = []; }
    desenharComentarios();
  }
  function alvoDoComentario(c) {
    const section = variations[c.variacao - 1];
    return section ? acharPorSeletor(section, c.seletor) : null;
  }
  function desenharComentarios() {
    const lista = $('hz-com-lista');
    lista.replaceChildren();
    $('hz-com-vazio').hidden = comentarios.length > 0;
    $('hz-conta-comentarios').textContent = comentarios.length || '';
    comentarios.forEach((c, n) => {
      const li = el('li');
      const topo = el('span', 'hz-li-topo');
      topo.append(el('span', '', (n + 1) + '. ' + (c.titulo || 'Variação ' + c.variacao)));
      const resolver = el('button', 'hz-link', 'Resolver');
      resolver.type = 'button';
      resolver.addEventListener('click', async ev => {
        ev.stopPropagation();
        try { await api('/__comentarios/apagar', { id: c.id }); } catch (e) {}
        carregarComentarios();
      });
      topo.appendChild(resolver);
      li.append(topo);
      if (c.trecho) li.append(el('code', '', '"' + c.trecho.slice(0, 80) + '"'));
      li.append(el('span', 'hz-li-texto', c.texto));
      if (alvoDoComentario(c)) {
        li.dataset.local = '';
        li.title = 'Mostrar no canvas';
        li.addEventListener('click', () => mostrarNoCanvas(alvoDoComentario(c)));
      }
      lista.appendChild(li);
    });
    posicionarPinos();
  }
  function posicionarPinos() {
    pinos.replaceChildren();
    const base = stage.getBoundingClientRect();
    comentarios.forEach((c, n) => {
      const alvo = alvoDoComentario(c);
      if (!alvo || !alvo.getClientRects().length) return;   // variação escondida
      const r = alvo.getBoundingClientRect();
      const pino = el('span', 'hz-pino', String(n + 1));
      pino.title = c.texto;
      pino.style.left = (r.left - base.left) + 'px';
      pino.style.top = (r.top - base.top) + 'px';
      pino.addEventListener('click', () => mostrarNoCanvas(alvo));
      pinos.appendChild(pino);
    });
  }

  function mostrarNoCanvas(alvo) {
    if (!alvo) return;
    const section = alvo.closest('.variation');
    const i = variations.indexOf(section);
    if (!comparando() && i >= 0 && i !== ativa) activate(i);
    else if (comparando() && i >= 0 && i !== foco) focar(i);
    alvo.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    alvo.classList.add('hz-destaque');
    setTimeout(() => alvo.classList.remove('hz-destaque'), 1600);
  }

  // ---- painel lateral: lembra se estava aberto (conveniência deste navegador) ----
  const painelBtn = $('hz-painel-botao');
  function setPainel(aberto) {
    document.body.dataset.painel = aberto ? 'aberto' : 'fechado';
    painelBtn.classList.toggle('is-on', aberto);
    painelBtn.setAttribute('aria-pressed', String(aberto));
    try { localStorage.setItem('hz-painel', aberto ? '1' : '0'); } catch (e) {}
    depoisDeMudar();
  }
  painelBtn.addEventListener('click', () => setPainel(document.body.dataset.painel === 'fechado'));

  // ---- detector: o servidor de preview (serve.py) responde /__detector ----
  // Cada achado aponta o elemento: a linha do index.html vira uma regra CSS (seletor) ou uma
  // tag dentro de uma variação (contando as tags de abertura desde o <section>).
  const selo = $('hz-detector-selo');
  const detResumo = $('hz-det-resumo');
  const detLista = $('hz-det-lista');
  let fonteHtml = '';

  function semComentarios(txt) { return txt.replace(/<!--[\s\S]*?-->/g, m => m.replace(/[^\n]/g, ' ')); }
  function localizarAchado(a) {
    if (!fonteHtml || !a.linha) return null;
    const src = semComentarios(fonteHtml);
    const linhas = src.split('\n');
    const inicio = linhas.slice(0, a.linha - 1).reduce((t, l) => t + l.length + 1, 0);
    const fim = inicio + (linhas[a.linha - 1] || '').length;
    // Dentro de <style>: acha a regra que contém a linha e usa o seletor dela.
    const abreStyle = src.lastIndexOf('<style', inicio), fechaStyle = src.lastIndexOf('</style>', inicio);
    if (abreStyle > fechaStyle) {
      let prof = 0, abre = -1;
      for (let p = fim; p > abreStyle; p--) {
        if (src[p] === '}' && p < fim) prof++;
        else if (src[p] === '{') { if (prof === 0) { abre = p; break; } prof--; }
      }
      if (abre < 0) return null;
      const corte = Math.max(src.lastIndexOf('}', abre - 1), src.lastIndexOf('{', abre - 1),
                             src.lastIndexOf('*/', abre - 1) + 1, src.indexOf('>', abreStyle));
      const seletor = src.slice(corte + 1, abre).trim();
      if (!seletor || seletor.startsWith('@')) return null;
      try {
        return Array.from(frame.querySelectorAll(seletor)).find(n => n.closest('.variation')) || null;
      } catch (e) { return null; }
    }
    // No markup: qual variação contém a linha, e qual tag de abertura dela.
    const re = /<section\b[^>]*\bclass="[^"]*\bvariation\b[^"]*"/g;
    let m, secao = -1, inicioSecao = 0;
    while ((m = re.exec(src)) && m.index <= fim) { secao++; inicioSecao = m.index; }
    const section = variations[secao];
    if (!section) return null;
    const tags = src.slice(inicioSecao, inicio).match(/<[a-zA-Z][^>]*>/g) || [];
    const naLinha = /<[a-zA-Z]/.test(linhas[a.linha - 1] || '');
    const ordem = tags.length - 1 + (naLinha ? 1 : 0);   // 0 é o próprio <section>
    const todos = [section, ...section.querySelectorAll('*')];
    const candidato = todos[ordem] || section;
    // Confere pelo trecho quando é texto: evita apontar o vizinho se o JS mexeu no DOM.
    const pelaFrase = a.trecho && todos.reverse().find(n => (n.textContent || '').includes(a.trecho));
    return candidato.textContent.includes(a.trecho) || !pelaFrase ? candidato : pelaFrase;
  }

  function mostrarDetector(r) {
    detLista.replaceChildren();
    if (r.erro) {
      selo.dataset.estado = 'erro'; selo.querySelector('span').textContent = 'Detector: erro';
      detResumo.textContent = r.erro; return;
    }
    const falhas = r.achados.filter(a => a.severidade === 'falha').length;
    const avisos = r.achados.length - falhas;
    selo.dataset.estado = $('hz-ponto-detector').dataset.estado = falhas ? 'falha' : (avisos ? 'aviso' : 'limpo');
    selo.querySelector('span').textContent = falhas || avisos
      ? [falhas && falhas + (falhas > 1 ? ' falhas' : ' falha'), avisos && avisos + (avisos > 1 ? ' avisos' : ' aviso')].filter(Boolean).join(' · ')
      : 'Limpo';
    detResumo.textContent = r.variacoes + (r.variacoes === 1 ? ' variação analisada. ' : ' variações analisadas. ')
      + (r.achados.length ? 'Clique num achado para ver onde está.' : 'Nenhum padrão genérico encontrado.')
      + (r.ignoradas && r.ignoradas.length ? ' Ignoradas por declaração: ' + r.ignoradas.join(', ') + '.' : '');
    r.achados.forEach(a => {
      const li = el('li');
      li.dataset.sev = a.severidade;
      const topo = el('span', 'hz-li-topo');
      topo.append(el('span', '', a.regra), el('small', '', a.severidade + ' · linha ' + a.linha));
      li.append(topo, el('code', '', a.trecho), el('span', 'hz-li-texto', a.dica));
      const alvo = localizarAchado(a);
      if (alvo) {
        li.dataset.local = '';
        li.title = 'Mostrar no canvas';
        li.addEventListener('click', () => mostrarNoCanvas(localizarAchado(a)));
      }
      detLista.appendChild(li);
    });
  }
  if (servido) {
    Promise.all([api('/__detector'), fetch(location.pathname, { cache: 'no-store' }).then(r => r.text()).catch(() => '')])
      .then(([r, html]) => { fonteHtml = html; mostrarDetector(r); })
      .catch(() => { selo.dataset.estado = 'erro'; detResumo.textContent = 'O servidor não respondeu ao detector.'; });
  } else {
    detResumo.textContent = 'Aberto como arquivo: sirva com scripts/serve.py para ver o detector aqui, ou rode scripts/detectar.py no terminal.';
  }
  selo.addEventListener('click', () => {
    setPainel(true);
    abrirAba('detector');
  });

  // ---- depois de qualquer mudança visual: repinta a direção e reposiciona os pinos ----
  let quadro = 0;
  function depoisDeMudar() {
    if (!pronto) return;
    cancelAnimationFrame(quadro);
    quadro = requestAnimationFrame(() => { desenharDirecao(); posicionarPinos(); });
  }
  new ResizeObserver(depoisDeMudar).observe(stage);

  // ---- estado na URL: cada clique reescreve a URL (sem recarregar). O live-reload recarrega a
  // MESMA URL, então aba, comparar, largura, tema, fontes e knobs sobrevivem a cada edição do
  // index.html; e copiar a URL compartilha exatamente o que está na tela.
  function salvarEstado() {
    if (!pronto) return;
    const q = new URLSearchParams();
    if (stage.dataset.vw !== 'desktop') q.set('vw', stage.dataset.vw);
    if (stage.dataset.vw === 'livre') q.set('w', String(larguraLivre));
    if (frame.dataset.theme === 'dark') q.set('theme', 'dark');
    if (comparando()) q.set('comparar', '1');
    else if (ativa > 0) q.set('v', String(ativa + 1));
    if (fonteAtual.corpo) q.set('font', fonteAtual.corpo);
    if (fonteAtual.titulo) q.set('font-titulo', fonteAtual.titulo);
    const sec = variations[ativa];
    if (sec && !comparando()) {
      const mudados = lerKnobs(sec).lista
        .filter(k => (valores.get(sec) || {})[k.id] !== padraoDe(k))
        .map(k => k.id + ':' + (valores.get(sec) || {})[k.id]);
      if (mudados.length) q.set('k', mudados.join(','));
    }
    if (document.body.dataset.limpo) q.set('limpo', '1');
    const texto = q.toString().replace(/%3A/g, ':').replace(/%2C/g, ',');
    try { history.replaceState(null, '', location.pathname + (texto ? '?' + texto : '')); } catch (e) {}
  }

  // ---- atalhos ----
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.hasAttribute('data-comentando') && balao.hidden) { setComentando(false); return; }
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest('input, select, textarea, [contenteditable]')) return;
    const tecla = e.key.toLowerCase();
    if ((tecla === 'arrowright' || tecla === 'arrowleft') && variations.length > 1) {
      const passo = tecla === 'arrowright' ? 1 : -1;
      activate((ativa + passo + variations.length) % variations.length);
    } else if (tecla === 'c' && variations.length > 1) setComparar(!comparando());
    else if (tecla === 't') setTheme(frame.dataset.theme === 'dark' ? 'light' : 'dark');
    else if (tecla === 'p') setPainel(document.body.dataset.painel === 'fechado');
    else if (tecla === 'k') setComentando(!document.body.hasAttribute('data-comentando'));
    else if (tecla === 'l') { livreSw.checked = !livreSw.checked; livreSw.dispatchEvent(new Event('change')); }
    else if (/^[1-4]$/.test(tecla)) setVw(LARGURAS[Number(tecla) - 1]);
    else return;
    e.preventDefault();
  });

  // Initial state from the URL — ?vw=mobile&theme=dark&v=2 — so a screenshot or a
  // shared link opens straight in that state, with NO clicks (fast auto-checks).
  const p = new URLSearchParams(location.search);
  if (p.get('vw') === 'livre') setLivre(Number(p.get('w')) || larguraLivre);
  else if (p.get('vw')) setVw(p.get('vw'));
  if (p.get('theme') === 'dark' || p.get('theme') === 'light') setTheme(p.get('theme'));
  const vi = parseInt(p.get('v'), 10);
  if (!Number.isNaN(vi) && variations[vi - 1]) activate(vi - 1);
  let painelSalvo = null;
  try { painelSalvo = localStorage.getItem('hz-painel'); } catch (e) {}
  setPainel(p.get('painel') === '0' ? false : p.get('painel') === '1' ? true : painelSalvo !== '0');
  // ?limpo=1 esconde a casca (barra e painel): screenshot só do design.
  if (p.has('limpo')) document.body.dataset.limpo = '1';
  // ?k=acento:0.8,densidade:compacta — ajusta os knobs da variação ativa, sem clique
  const kp = p.get('k');
  const ativaSec = variations.find(v => v.classList.contains('is-active'));
  if (kp && ativaSec) {
    const porId = Object.fromEntries(lerKnobs(ativaSec).lista.map(k => [k.id, k]));
    kp.split(',').forEach(par => {
      const corte = par.indexOf(':');
      if (corte < 0) return;
      const k = porId[par.slice(0, corte)];
      if (k) aplicarKnob(ativaSec, k, par.slice(corte + 1));
    });
    desenharKnobs([ativaSec]);
  }
  if (p.get('comparar') === '1' && variations.length > 1) setComparar(true);
  desenharEscolha();
  let abaSalva = null;
  try { abaSalva = localStorage.getItem('hz-aba'); } catch (e) {}
  abrirAba(abaSalva || 'ajustes');
  pronto = true;
  if (p.get('font')) aplicarFonte('corpo', p.get('font'));
  if (p.get('font-titulo')) aplicarFonte('titulo', p.get('font-titulo'));
  carregarComentarios();
  depoisDeMudar();
</script>
